 mam_pc.reserve_budget_tt:0 "Reserve the stated remaining project budget in the common fund. This approval does not transfer it to the Emperor. Eligible contributions are advanced and executed individually; they share one remaining ceiling. No personal Gold is used."
 mam_pc.budget_request_desc:0 "Please reserve #high [mam_cf_quote|0]#! [treasury_i] for contributions to #high [mam_cf_selected_project.GetName]#!.\n\nRevenue will release common funds as eligible ministries fulfill their pledges. This changes the remaining budget; it does not repeat an earlier payment or campaign launch authorization."
 mam_pc.campaign_request_desc:0 "Please approve #high [mam_cf_quote|0]#! [treasury_i] for #high [mam_cf_selected_project.GetName]#!, including up to [mam_cf_mobilization|0] [treasury_i] for mobilization.\n\nThis authorizes the Grand Marshal’s pledge and may begin war. Revenue will use the common fund."
 mam_pc.budget_approved_desc:0 "A remaining budget of #high [mam_cf_quote|0]#! [treasury_i] is reserved for #high [mam_cf_selected_project.GetName]#!.\n\nCovered contributions can now proceed. Cash remains in common custody until needed; this approval does not pay the same pledge twice."
 mam_pc.invoice_title:0 "A Contribution to Imperial Work"
 mam_pc.invoice_desc:0 "What shall my office provide for #high [mam_cf_selected_project.GetName]#!? Its remaining common budget is #high [mam_cf_project_remaining|0]#! [treasury_i]; recorded expenditure is #high [mam_cf_project_spent|0]#! [treasury_i].\n\nRevenue advances the native price and carries out my chosen contribution. If more funds or higher authority are needed, I will submit the budget for approval first."
 mam_pc.choose_one:0 "Provide #high [mam_cf_menu_slot_one.GetName]#! for [mam_cf_menu_price_one|0] [treasury_i]."
 mam_pc.choose_two:0 "Provide #high [mam_cf_menu_slot_two.GetName]#! for [mam_cf_menu_price_two|0] [treasury_i]."
 mam_pc.choose_three:0 "Provide #high [mam_cf_menu_slot_three.GetName]#! for [mam_cf_menu_price_three|0] [treasury_i]."
 mam_pc.choose_invoice_tt:0 "Fund and execute this exact native contribution with the current eligible minister. Its cost and rewards remain native. A covered contribution does not require another approval or a 90-day new-project cooldown. An uncovered invoice requests the lawful project budget first."
 mam_pc.next_invoices:0 "Examine later contributions."
 mam_pc.next_invoices_tt:0 "Review the next eligible treasury contributions on this project. If none remain, return to the first contributions."
 mam_pc.first_invoices:0 "Return to the project's contributions."
 mam_pc.close:0 "Set these papers aside."
 mam_pc.blocked_title:0 "The Contribution Must Wait"
 mam_pc.held_desc:0 "A public-account payment could not be verified. Further releases are held to prevent paying twice.\n\nThe contribution will not be retried until the account and its receipt have been reviewed. Existing project records remain in place."
 mam_pc.debt_desc:0 "My office is in public debt. Its essential provision must be restored before a project advance can be spent on the intended contribution.\n\nThe project budget remains distinct from ordinary upkeep. No new contribution has been claimed."
 mam_pc.cash_shortfall_desc:0 "The approved contribution to #high [mam_cf_selected_project.GetName]#! must wait for available common funds. Existing operating reserves and other project commitments remain protected.\n\nA campaign cannot launch while its approved mobilization provision remains unpaid. The office will check again in seven days; this delay does not make another pledge or create treasury."
 mam_pc.pending_desc:0 "The contribution budget for #high [mam_cf_selected_project.GetName]#! is awaiting its lawful reviewer.\n\nThe selected contribution remains attached to my request. Once adequate authorization is granted, the ministry will resume it without a duplicate funding request."
 mam_pc.retry_desc:0 "The previous request concerning #high [mam_cf_selected_project.GetName]#! was not approved. A new budget request must wait until the thirty-day reconsideration period has passed.\n\nAny earlier valid project commitment remains in place; this decision does not pay another contribution."
 mam_pc.budget_submitted:0 "A Project Budget Submitted"
 mam_pc.budget_submitted_tt:0 "A remaining contribution budget of [mam_cf_budget_quote|0] [treasury_i] for [mam_cf_selected_project.GetName] has been submitted for the lawful review. No money moves until authorization and native contribution execution."
 mam_pc.native_blocked_desc:0 "#high [mam_cf_selected_project.GetName]#! could not accept the chosen contribution under its current native requirements.\n\nAny unspent advance is reconciled. Eligibility, Influence, cooldowns and project state are checked again before another attempt; an uncertain native payment is held."
 mam_pc.no_invoice_desc:0 "No eligible unfunded treasury contribution is available on this page, or its project has changed.\n\nOnly contributions this office can provide are offered. Native contributions using other resources remain in the project's own controls."
 mam_pc.invoice_paid:0 "An Imperial Contribution Fulfilled"
 mam_pc.invoice_paid_tt:0 "[mam_cf_executing_contributor.GetShortUIName] completed a native contribution to [mam_cf_selected_project.GetName] for [mam_cf_execute_price|0] [treasury_i]. The common budget was reduced once; native participation and rewards remain with the contributor."
 mam_pc.launch_title:0 "Carry Out the Imperial Campaign"
 mam_pc.launch_desc:0 "The throne has authorized #high [mam_cf_selected_project.GetName]#! and reserved its public funds. My mandatory pledge costs #high [mam_cf_invoice_price|0]#! [treasury_i].\n\nAs Grand Marshal, I may now carry out the pledge. The native campaign will determine its targets and can begin the war immediately."
 mam_pc.launch:0 "Carry out the authorized campaign pledge."
 mam_pc.launch_tt:0 "Release the approved mobilization provision, advance the native pledge price and execute the Grand Marshal's mandatory contribution. This can start the Grand Campaign war. Native war leader, targets, casus belli and participant rules remain unchanged."
 mam_pc.launch_authority_tt:0 "Authorize the Grand Marshal’s required native pledge, which can begin the Grand Campaign war. Up to [mam_cf_mobilization|0] [treasury_i] of this budget provides one-time mobilization. Native pledge costs and existing operating commitments remain protected."
 mam_pc.defer_launch:0 "I need more time to prepare."
 mam_pc.defer_launch_tt:0 "Wait 30 days before presenting the launch again. No pledge is paid by deferring; the common project budget remains reserved."
 mam_revenue_fund_contribute_project_interaction:0 "Revenue: Contribute to an Imperial Project"
 mam_revenue_fund_contribute_project_interaction_desc:0 "Choose a project and an eligible native contribution. Revenue finances and executes covered invoices; uncovered costs request the proper approval. Governors keep their own native contribution funds."
 mam_pc.campaign_underway:0 "The Grand Campaign Is Under Way"
 mam_pc.campaign_underway_tt:0 "[mam_cf_campaign_notice_marshal.GetShortUIName] has fulfilled the required pledge for [mam_cf_campaign_notice_project.GetName] and leads its Grand Campaign war. The campaign remains a native imperial project; inspect the Marshal’s war to follow the fighting."

 mam_cf.project_obsolete_desc:0 "The project proposed by #high [mam_cf_subject.GetShortUIName]#! can no longer proceed under the conditions used to prepare this request. The ministry must choose an eligible project and site, or revise the amount, before submitting it again. No Treasury was transferred."

 mam_pc.wall_conflict_title:0 "A Wall Section Could Not Be Upgraded"
 mam_pc.wall_conflict_tt:0 "Another great building occupies [mam_cf_wall_site.GetName]. It has been preserved. The Wall project did not replace it."
