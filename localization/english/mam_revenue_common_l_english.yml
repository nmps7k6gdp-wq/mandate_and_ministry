l_english:
 mam_cf.open:0 "Open the papers"
 mam_cf.opening:0 "Concerning the public accounts,"
 mam_cf.request_title:0 "A Request for Public Funds"
 mam_cf.relief_desc:0 "[mam_cf_subject.GetShortUIName] asks for #high [mam_cf_quote|0]#! [treasury_i] for #high [mam_cf_title.GetName]#!.\n\nThe ministry has placed this request before me. Shall the common fund meet the expense?"
 mam_cf.topup_desc:0 "The ministries seek an additional #high [mam_cf_quote|0]#! [treasury_i] from the imperial treasury.\n\nThe money would enter the common fund in Revenue's custody. Shall I grant this provision?"
 mam_cf.remit_desc:0 "A contribution of #high [mam_cf_quote|0]#! [treasury_i] is proposed from #high [mam_cf_title.GetName]#! to the common fund.\n\nThe province must consent and retain sufficient money for its own affairs."
 mam_cf.project_desc:0 "[mam_cf_subject.GetShortUIName] proposes a great project in #high [mam_cf_project_target.GetName]#! and requests #high [mam_cf_quote|0]#! [treasury_i].\n\nThe common fund would provide the starting expense. Shall this work receive our support?"
 mam_cf.contribution_desc:0 "[mam_cf_subject.GetShortUIName] requests #high [mam_cf_quote|0]#! [treasury_i] towards #high [mam_cf_selected_project.GetName]#!.\n\nThis allowance would support further work on the project. Shall the common fund meet it?"
 mam_cf.revise:0 "Let me revise the amount."
 mam_cf.revise_tt:0 "Revise the proposed amount. This draft moves no money."
 mam_cf.recommend:0 "Submit [mam_cf_quote|0] [treasury_i] for consideration."
 mam_cf.recommend_tt:0 "Submit the proposal under the current fiscal law. Eligible delegated payments can be released directly; other measures require the proper superior. No payment may breach protected commitments."
 mam_cf.approve:0 "Authorize [mam_cf_quote|0] [treasury_i]."
 mam_cf.approval_tt:0 "The payment uses the named public accounts. Existing operating obligations and the common reserve remain protected. The beneficiary gains 10 Opinion of the authorizing official for two years; provincial contributors instead lose 10 Opinion. No personal gold changes hands. Supplementary provision lasts 90 days. Project advances bind their stated project or purpose and expire after one year; unused cash is reconciled. Existing salaries and standing obligations remain protected."
 mam_cf.consent:0 "I will make this contribution."
 mam_cf.consent_tt:0 "Consent to the stated public contribution. Any further approval required by the fiscal law still comes before payment."
 mam_cf.refuse:0 "I cannot support this request."
 mam_cf.refuse_tt:0 "Close this request without a payment. A refused operating increase can be appealed once. Existing authorized salaries and standing costs continue."
 mam_cf.defer:0 "I will return to these papers later."
 mam_cf.defer_tt:0 "Set this request aside for 30 days. Other pending matters can proceed. The Revenue: Resume Fiscal Papers decision can recall it sooner."
 mam_cf.operations_title:0 "The Means to Carry Out the Work"
 mam_cf.operations_desc:0 "#high [mam_cf_title.GetName]#! reports #high [mam_cf_cost|1]#! [treasury_i] in recurring monthly expenses. Its proposed ordinary headroom is #high [mam_cf_headroom|0]#! [treasury_i].\n\nI must decide what provision its work deserves. Existing project advances are accounted for separately. Existing native bills remain covered while the discretionary provision is reviewed."
 mam_cf.lean:0 "Keep only a modest working balance for [mam_cf_title.GetName]."
 mam_cf.standard:0 "Provide ordinary means for [mam_cf_title.GetName]."
 mam_cf.expanded:0 "Give [mam_cf_title.GetName] more room to act."
 mam_cf.lean_tt:0 "Authorize the reported recurring cost and 25 [treasury_i] of discretionary headroom. The protected two-month operating buffer remains. A material cut causes -15 Opinion for two years and permits one appeal. Standing native expenses receive separate automatic provision; the quarterly cap applies only to discretionary advances."
 mam_cf.standard_tt:0 "Authorize the reported recurring cost and 75 [treasury_i] of discretionary headroom. Raising the working balance grants +10 Opinion for two years. Actual advances remain limited by available funds and the quarterly allowance. Standing native expenses receive separate automatic provision; the quarterly cap applies only to discretionary advances."
 mam_cf.expanded_tt:0 "Authorize the reported recurring cost and 150 [treasury_i] of discretionary headroom. Raising the working balance grants +10 Opinion for two years. This authorizes a target, not an immediate unconditional payment. Standing native expenses receive separate automatic provision; the quarterly cap applies only to discretionary advances."
 mam_cf.decline_increase:0 "The existing provision must suffice."
 mam_cf.decline_increase_tt:0 "Do not authorize new recurring commitments or a larger allowance. Retain the office's existing authorization. Its holder may appeal this material refusal once."
 mam_cf.amount_title:0 "How Much Can Be Committed?"
 mam_cf.amount_desc:0 "The current draft is #high [mam_cf_quote|0]#! [treasury_i]. Up to #high [mam_cf_max|0]#! [treasury_i] can presently be proposed without breaching the payer's protected balance.\n\nEditing the draft moves no money. A project advance smaller than its native starting cost cannot fund the start; it must be amended before the project can proceed."
 mam_cf.plus25:0 "Add 25 [treasury_i]."
 mam_cf.plus100:0 "Add 100 [treasury_i]."
 mam_cf.minus25:0 "Reduce it by 25 [treasury_i]."
 mam_cf.minus100:0 "Reduce it by 100 [treasury_i]."
 mam_cf.amount_max:0 "Use the available [mam_cf_max|0] [treasury_i]."
 mam_cf.amount_done:0 "Return to the request."
 mam_cf.programme_title:0 "The Government's Spending Programme"
 mam_cf.programme_desc:0 "The common fund holds #high [mam_cf_fund_balance|0]#! [treasury_i]. Recurring commitments total #high [mam_cf_monthly|1]#! [treasury_i] a month; #high [mam_cf_reserve|0]#! [treasury_i] is protected.\n\nWhat should the government's remaining resources accomplish in the coming year?"
 mam_cf.balanced:0 "Give Revenue room to meet the ordinary needs of government."
 mam_cf.reserves:0 "Build our reserves before undertaking optional work."
 mam_cf.recovery:0 "Put the recovery of the provinces first."
 mam_cf.balanced_tt:0 "Protect two months of aggregate approved recurring costs plus 200 [treasury_i]. Under Revenue delegation, eligible ordinary projects and grants up to 500 [treasury_i] may be approved by Revenue. Other laws require superior approval."
 mam_cf.reserves_tt:0 "Protect two months of aggregate recurring costs plus 700 [treasury_i]. New projects require superior approval. Revenue seeks at most one affordable voluntary provincial contribution per quarter. Routine obligations remain automatic."
 mam_cf.recovery_tt:0 "Protect two months of aggregate recurring costs plus 500 [treasury_i], including a 300 [treasury_i] relief provision. Genuine recovery requests take precedence. Optional projects require superior approval; distressed provinces are exempt from extraordinary contributions."
 mam_cf.project_title:0 "Provision for a Great Project"
 mam_cf.project_choose_desc:0 "What work should I propose for #high [mam_cf_site_title.GetName]#!? I will request its native starting cost from the common fund, then use the ordinary project controls once the advance is authorized.\n\nFunding does not waive the project's site, Influence, construction or other requirements."
 mam_cf.project_request_tt:0 "Submit a project-specific advance for the selected jurisdiction. No money moves until authorized. The native project must still be planned and funded through its own controls. The initial quote uses the native starting cost; treasury is advanced before planning. Native Influence and location requirements still apply."
 mam_cf.cancel:0 "I need more time to consider this."
 mam_cf.accounts_title:0 "The Common Ministerial Fund"
 mam_cf.accounts_desc:0 "Revenue holds #high [GetTitleByKey('e_minister_of_revenue').MakeScope.ScriptValue('mam_revenue_fund_display_cash')|0]#! [treasury_i] in the common fund. After commitments and reserves, #high [GetTitleByKey('h_china').MakeScope.ScriptValue('mam_revenue_fund_available')|0]#! [treasury_i] is available.\n\n[GetPlayer.Custom('MamRevenueFundStatement')]\n\nProgramme: #high [GetPlayer.Custom('MamRevenueFundProgramme')]#!.\nAuthority: #high [GetPlayer.Custom('MamRevenueFundAuthority')]#!."
 mam_cf.accounts_close:0 "The accounts are before me."
 mam_cf.accounts_tt:0 "Monthly refills pay only the shortfall to an authorized target. Quarterly advances are limited to three months of approved costs plus discretionary headroom; initial establishment also provides a starting buffer. Unused project advances are protected until consumed, cancelled or expired. The first common reconciliation follows a one-time 35-day adoption period. Essential cash needs are checked weekly. A depleted discretionary allowance does not stop recurring payroll; unverified payments still stop releases."
 mam_cf.suspend:0 "Require superior review of discretionary releases."
 mam_cf.suspend_tt:0 "For 90 days, Revenue must submit discretionary proposals to the lawful superior. Routine authorized operating advances continue. The emperor or the official imposing the suspension may lift it early."
 mam_cf.restore:0 "Restore the ordinary delegation rules."
 mam_cf.restore_tt:0 "End this administrative suspension. The fiscal law and programme still govern new allocations."
 mam_cf.release_programme:0 "Let the Chancellor direct the next programme."
 mam_cf.release_programme_tt:0 "Withdraw the standing imperial programme override. The Chancellor may prepare the next programme, subject to the fiscal law. Existing allocations remain in effect."
 mam_cf.contribution_title:0 "An Allowance for Ongoing Work"
 mam_cf.contribution_choose_desc:0 "Which imperial project shall my office support? Choose a project to review its eligible contribution. Funding and native execution follow the same order."
 mam_cf.contribution_request_tt:0 "Request a ceiling initially equal to one native base contribution. Revenue can revise it. This is not an automatic payment for every contribution, and it does not complete the project."
 mam_cf.outcome_title:0 "The Public Accounts: A Decision"
 mam_cf.programme_result_desc:0 "The spending programme has received the required seal. Revenue will follow these priorities when allocating public funds. Existing commitments remain in force."
 mam_cf.operations_result_desc:0 "The provision for #high [mam_cf_title.GetName]#! is approved: #high [mam_cf_cost|1]#! [treasury_i] in monthly recurring costs and #high [mam_cf_headroom|0]#! [treasury_i] in ordinary headroom.\n\nThe office will receive any funded shortfall at the next reconciliation."
 mam_cf.reserved_result_desc:0 "#high [mam_cf_result_amount|0]#! [treasury_i] within the common fund is reserved for Revenue's approved project.\n\nThe money remains in custody until the project expense is paid."
 mam_cf.paid_result_desc:0 "#high [mam_cf_result_amount|0]#! [treasury_i] has passed from #high [mam_cf_result_payer_title.GetName]#! to #high [mam_cf_result_payee_title.GetName]#!.\n\nBoth account changes are recorded. The approved measure has taken effect."
 mam_cf.refused_result_desc:0 "The request concerning #high [mam_cf_title.GetName]#! has been refused. No money was released.\n\nExisting provision continues. A material operating refusal may be appealed once."
 mam_cf.unpaid_result_desc:0 "The proposed measure concerning #high [mam_cf_title.GetName]#! could not be completed. No successful payment is recorded.\n\nThe papers must be reviewed against the current accounts before money is released."
 mam_cf.recorded:0 "I have received the decision."
 mam_cf.reserve_self_tt:0 "Earmark this amount inside the common fund for Revenue's approved project. No self-transfer or personal gold payment occurs."
 mam_cf.project_authorization_tt:0 "A ministry using the common fund needs an approved advance for this project type, sufficient unspent project money and an unexpired authorization. Request funding through the Ministry interaction on the intended senior governor."
 mam_cf.project_location_tt:0 "Use the area authorized for this project. Strengthen Capital uses the imperial realm, including counties held directly by the Emperor; provincial work uses the jurisdiction named in its approved request. Native site requirements still apply."
 mam_cf.contribution_authorization_tt:0 "Use Revenue: Contribute to an Imperial Project to request and execute a funded pledge. The system preserves the native contributor and price; required continuation does not wait for the new-project cooldown."
 mam_cf.native_payment_guard_tt:0 "Public funds of the nine pooled ministries must use the common-fund requests and approvals. Use the Ministry interactions for operating allocations, provincial relief and project advances, or Revenue: Appropriate Imperial Funds for a top-up."
 mam_revenue_fund_support_opinion:0 "Supported My Department"
 mam_revenue_fund_cut_opinion:0 "Reduced My Provision"
 mam_revenue_fund_levy_opinion:0 "Requested a Provincial Contribution"
 mam_revenue_fund_review_operations_interaction:0 "Revenue: Review Operating Provision"
 mam_revenue_fund_review_operations_interaction_desc:0 "Review this ministry's actual recurring costs and discretionary working balance. Current law determines who may authorize a change."
 mam_revenue_fund_request_operations_interaction:0 "Revenue: Request Operating Provision"
 mam_revenue_fund_request_operations_interaction_desc:0 "Ask Revenue to review this office's recurring costs and operating allowance. Existing commitments remain protected; new costs need approval."
 mam_revenue_fund_petition_interaction:0 "Revenue: Petition for Public Funds"
 mam_revenue_fund_petition_interaction_desc:0 "Request common funds for public debt or genuine provincial distress. Revenue reviews the request; the fiscal law determines the required approval. Requesting costs native medium Influence. The optional debt-clearance request uses the present public debt; a payment which clears it grants the continuing creditor the native indebted hook and Influence reward."
 mam_revenue_fund_remittance_interaction:0 "Revenue: Request Provincial Contribution"
 mam_revenue_fund_remittance_interaction_desc:0 "Seek a voluntary contribution from an affordable, non-distressed provincial treasury. The province must retain 200 treasury and can refuse."
 mam_revenue_fund_project_interaction:0 "Revenue: Request Great Project Funding"
 mam_revenue_fund_project_interaction_desc:0 "Choose a native project for this senior jurisdiction and request its starting cost. Once funded, use the native project controls to plan it."
 mam_revenue_fund_appeal_interaction:0 "Revenue: Appeal Operating Provision"
 mam_revenue_fund_appeal_interaction_desc:0 "Appeal a material cut or refusal once within six months. The Chancellor hears ordinary appeals; reserved or self-interested matters reach the emperor."
 mam_revenue_fund_accounts_decision:0 "Revenue: Examine Common Accounts"
 mam_revenue_fund_accounts_decision_desc:0 "Examine common cash, approved recurring obligations and the reserve."
 mam_revenue_fund_programme_decision:0 "Revenue: Set the Spending Programme"
 mam_revenue_fund_programme_decision_desc:0 "Set funded priorities for the coming year. Imperial control requires the emperor's approval; the other laws permit Chancellor direction."
 mam_revenue_fund_topup_decision:0 "Revenue: Appropriate Imperial Funds"
 mam_revenue_fund_topup_decision_desc:0 "Ask the emperor to transfer additional public money into the common ministerial fund. The imperial treasury must retain 500 treasury."
 mam_revenue_fund_contribution_decision:0 "Revenue: Contribute to an Imperial Project"
 mam_revenue_fund_contribution_decision_desc:0 "Choose an existing project and an eligible contribution. Approved project budgets finance the native contribution automatically; uncovered costs request lawful approval. Required contributions do not wait for the new-project cooldown."
 mam_revenue_fund_resume_decision:0 "Revenue: Resume Fiscal Papers"
 mam_revenue_fund_resume_decision_desc:0 "Recall deferred fiscal papers for the current lawful reviewers. One actionable request is displayed at a time per reviewer."
 mam_revenue_fund_return_advance_decision:0 "Revenue: Return Uncommitted Project Funds"
 mam_revenue_fund_return_advance_decision_desc:0 "Cancel this office's unused project allowance. Cash actually present above its operating target returns to common custody immediately when the custodian is available, or at the next reconciliation. Paid native costs remain intact. Returning an advance does not reset its 90-day grant interval."
 mam_revenue_fund_supplement_interaction:0 "Revenue: Request Supplementary Provision"
 mam_revenue_fund_supplement_interaction_desc:0 "Request a one-time public-treasury advance for an exceptional operating expense, such as recruitment or native military assistance. The amount can be revised before approval. Standing maintenance still needs its own operating review."
 mam_revenue_fund_supplement_decision:0 "Revenue: Request Supplementary Provision"
 mam_revenue_fund_supplement_decision_desc:0 "Ask for a one-time public operating advance for a large expense. Choose the amount before submission. Revenue cannot approve its own increase; current authority and available cash determine who may release it."
 mam_cf.project_1:0 "Request provision for $great_project_type_grand_campaign_project$."
 mam_cf.project_2:0 "Request provision for $great_project_type_minister_project_culture$."
 mam_cf.project_3:0 "Request provision for $great_project_type_minister_project_development$."
 mam_cf.project_4:0 "Request provision for $great_project_type_minister_project_establish_control$."
 mam_cf.project_5:0 "Request provision for $great_project_type_minister_project_train_troops$."
 mam_cf.project_6:0 "Request provision for $great_project_type_minister_project_conduct_census$."
 mam_cf.project_7:0 "Request provision for $great_project_type_minister_compel_religious_uniformity$."
 mam_cf.project_8:0 "Request provision for $great_project_type_construct_great_barracks$."
 mam_cf.project_9:0 "Request provision for $great_project_type_strengthen_capital$."
 mam_cf.project_10:0 "Request provision for $great_project_type_great_wall$."
 mam_cf.project_11:0 "Request provision for $great_project_type_great_wall_extend_to_shanhai_pass$."
 mam_cf.project_12:0 "Request provision for $great_project_type_great_wall_extend_to_liaodong$."
 mam_cf.project_13:0 "Request provision for $great_project_type_grand_canals$."
 mam_cf.project_14:0 "Request provision for $great_project_type_pam_cathedral_01$."
 mam_cf.project_15:0 "Request provision for $great_project_type_pam_cathedral_02$."
 mam_cf.project_16:0 "Request provision for $great_project_type_pam_cathedral_03$."
 mam_cf.project_17:0 "Request provision for $great_project_type_pam_mass_rite_conversion$."
 mam_cf.contribution_one:0 "Provide for #high [mam_cf_project_one.GetName]#!."
 mam_cf.contribution_two:0 "Provide for #high [mam_cf_project_two.GetName]#!."
 mam_cf.contribution_three:0 "Provide for #high [mam_cf_project_three.GetName]#!."
 mam_cf.accounts_minister_desc:0 "$mam_cf.accounts_desc$"
 mam_cf.review_mine:0 "Review the provision for my own office."
 mam_cf.supplement_desc:0 "The ordinary provision for #high [mam_cf_title.GetName]#! will not cover its work. [mam_cf_subject.GetShortUIName] asks for an additional #high [mam_cf_quote|0]#! [treasury_i].\n\nShall the common fund provide the money?"
 mam_cf.supplement_self_result_desc:0 "Revenue may use an additional #high [mam_cf_result_amount|0]#! [treasury_i] for its operations over the next 90 days.\n\nThis provision remains within the common account; no self-payment was made."
 mam_cf.earned_payment:0 "An Earned Public Payment"
 mam_cf.earned_payment_tt:0 "The common ministerial fund paid [mam_cf_paid|0] [treasury_i] for an existing Census insurance or debt-relief entitlement. The payer's debit and recipient's credit were checked. This is an earned native benefit, separate from a discretionary relief grant."
 mam_cf.programme_balanced:0 "balanced administration"
 mam_cf.programme_reserves:0 "building reserves"
 mam_cf.programme_recovery:0 "provincial recovery"
 mam_cf.project_interval_tt:0 "An office can receive one new project or contribution allowance per 90 days. An uncommitted return must be reconciled before another advance. Paid project costs and native benefits remain intact."
 mam_cf.changed:0 "The circumstances have changed. Set these papers aside."
 mam_cf.changed_tt:0 "Close this outdated window without authorizing a payment. A pending valid request remains with its current lawful reviewer."
 mam_cf.next_projects:0 "Bring me the next project papers."
 mam_cf.first_projects:0 "Return to the first project papers."
 mam_cf.debt_desc:0 "#high [mam_cf_title.GetName]#! seeks up to #high [mam_cf_quote|0]#! [treasury_i] to settle its public debt.\n\nThe common fund would pay only the debt still outstanding. Shall I authorize the request?"
 mam_cf.legacy_changed:0 "These papers belong to the former fiscal arrangement. Close them."
 mam_cf.accounts_paused_desc:0 "The common fund awaits a qualified Revenue custodian. The imperial treasury will not be treated as the common account during temporary custody. Office records and pending claims remain in place, while native income and ordinary local expenses continue. Pooled releases resume when the Revenue title and council seat agree."
 mam_cf.accounts_held_desc:0 "The common account is on hold after a payment could not be verified. Further releases have stopped so that the same money is not paid twice. The receipt records both account readings for inspection. Keep the immediate save and error log before attempting another transaction."
 mam_cf.ready_tt:0 "The common-fund administration needs a qualified Revenue custodian and a one-time 35-day transition for native income and expenses to settle. Existing native funding continues during that period."
 mam_cf.context_tt:0 "The current circumstances allow this choice."
 mam_cf.flow_title:0 "How the Public Funds Move"
 mam_cf.flow_desc:0 "Ministry income reaches each office. At reconciliation, offices keep approved operating balances and project advances; surplus passes to Revenue. The fund then pays funded operating shortfalls.\n\n[GetPlayer.Custom('MamRevenueFundStatement')]\n\nNative income, expenses and separate grants change cash between settlements. Revenue's public treasury is the common bank. Its operating target is an authorization within that bank. Personal Gold remains separate. Essential operating shortfalls are also checked weekly, without a new approval popup."
 mam_cf.own_title:0 "The Provision for My Office"
 mam_cf.own_desc:0 "My public treasury holds #high [mam_cf_local|0]#! [treasury_i]. The working target is #high [mam_cf_target_balance|0]#! [treasury_i], with #high [mam_cf_left|0]#! [treasury_i] left in discretionary advances this quarter.\n\nRecurring costs: [mam_cf_cost|1] [treasury_i] per month.\nProject funds: [mam_cf_earmark|0] [treasury_i].\nSupplementary provision: [mam_cf_special|0] [treasury_i].\n\nMy personal purse holds [mam_cf_gold|0] [gold_i]; it is separate from these public accounts.\n\nRecorded project: #high [GetPlayer.Custom('MamRevenueFundGrantProject')]#!."
 mam_cf.own_revenue_desc:0 "The #high [mam_cf_local|0]#! [treasury_i] in my native treasury is the #high common fund#!, not Revenue's private departmental budget.\n\nRevenue's own operating target is #high [mam_cf_target_balance|0]#! [treasury_i]. Its approved costs are [mam_cf_cost|1] [treasury_i] a month, with [mam_cf_earmark|0] [treasury_i] reserved for a project and [mam_cf_special|0] [treasury_i] in supplementary provision.\n\nMy personal purse holds [mam_cf_gold|0] [gold_i]. Gold, public cash and operating permission are different figures.\n\nRecorded project: #high [GetPlayer.Custom('MamRevenueFundGrantProject')]#!."
 mam_cf.view_own:0 "Examine the provision for my office."
 mam_cf.view_flow:0 "Explain the movement of public funds."
 mam_cf.view_departments:0 "Examine the departmental accounts."
 mam_cf.departments_title:0 "The Departmental Accounts"
 mam_cf.next_accounts:0 "Bring the next accounts."
 mam_cf.previous_accounts:0 "Return to the previous accounts."
 mam_cf.operations_ready_tt:0 "The office must be qualified, have no unresolved operating review, and be outside its 90-day review interval."
 mam_cf.petition_ready_tt:0 "A qualified senior civilian office must have public debt or recovery needs, no pending petition, and no active relief cooldown. The common-fund administration must be available."
 mam_cf.remittance_ready_tt:0 "The province must be able to retain its protected 200 treasury, have no recovery need or unresolved contribution, and be outside its contribution cooldown."
 mam_cf.project_ready_tt:0 "The office must be eligible, have no unresolved or unreturned project advance, and be outside its 90-day allowance interval. Select a senior jurisdiction suitable for the native project."
 mam_cf.appeal_ready_tt:0 "The current holder must have a recent material cut or refusal, with no pending or previously used appeal for that decision."
 mam_cf.supplement_ready_tt:0 "The office must be qualified, have no pending supplementary request or active 90-day supplementary provision, and have access to the common-fund administration."
 mam_cf.refresh_accounts:0 "Bring the current accounts."
 mam_cf.refresh_accounts_tt:0 "Re-read current cash and recalculate the account summary. This does not collect money, pay an advance or approve new spending. Reconciliation figures describe the last completed monthly settlement. Current cash may include weekly essential advances made after that settlement."
 mam_cf.view_controls:0 "Review the safeguards on public spending."
 mam_cf.controls_title:0 "Safeguards on Public Spending"
 mam_cf.controls_desc:0 "The fiscal law is #high [GetPlayer.Custom('MamRevenueFundAuthority')]#!. The programme is #high [GetPlayer.Custom('MamRevenueFundProgramme')]#!.\n\nExisting salaries and approved commitments continue. I may change who directs future programmes or temporarily require superior review of discretionary releases."
 mam_cf.statement_none:0 "No monthly reconciliation has been completed yet. Operating income continues during adoption."
 mam_cf.statement_done:0 "Last completed reconciliation: #high [GetTitleByKey('h_china').MakeScope.Var('mam_cf_statement_collected').GetValue|0]#! [treasury_i] collected; #high [GetTitleByKey('h_china').MakeScope.Var('mam_cf_statement_advanced').GetValue|0]#! [treasury_i] advanced. These are settled transfers, not current cash. Additional essential advances since that settlement: #high [GetTitleByKey('h_china').MakeScope.Var('mam_cf_interim_advances').GetValue|0]#! [treasury_i]."
 mam_cf.department_1:0 "#high Chancellery#!: [GetTitleByKey('e_minister_chancellor').MakeScope.ScriptValue('mam_revenue_fund_display_cash')|0] / [GetTitleByKey('e_minister_chancellor').MakeScope.ScriptValue('mam_revenue_fund_display_target')|0]"
 mam_cf.department_1_unreviewed:0 "#high Chancellery#!: [GetTitleByKey('e_minister_chancellor').MakeScope.ScriptValue('mam_revenue_fund_display_cash')|0] / unreviewed"
 mam_cf.department_1_shared:0 "#high Chancellery#!: [GetTitleByKey('e_minister_chancellor').MakeScope.ScriptValue('mam_revenue_fund_display_cash')|0] / shared holder account"
 mam_cf.department_1_vacant:0 "#high Chancellery#!: vacant"
 mam_cf.department_2:0 "#high Censorate#!: [GetTitleByKey('e_minister_censor').MakeScope.ScriptValue('mam_revenue_fund_display_cash')|0] / [GetTitleByKey('e_minister_censor').MakeScope.ScriptValue('mam_revenue_fund_display_target')|0]"
 mam_cf.department_2_unreviewed:0 "#high Censorate#!: [GetTitleByKey('e_minister_censor').MakeScope.ScriptValue('mam_revenue_fund_display_cash')|0] / unreviewed"
 mam_cf.department_2_shared:0 "#high Censorate#!: [GetTitleByKey('e_minister_censor').MakeScope.ScriptValue('mam_revenue_fund_display_cash')|0] / shared holder account"
 mam_cf.department_2_vacant:0 "#high Censorate#!: vacant"
 mam_cf.department_3:0 "#high Grand Marshal#!: [GetTitleByKey('e_minister_grand_marshal').MakeScope.ScriptValue('mam_revenue_fund_display_cash')|0] / [GetTitleByKey('e_minister_grand_marshal').MakeScope.ScriptValue('mam_revenue_fund_display_target')|0]"
 mam_cf.department_3_unreviewed:0 "#high Grand Marshal#!: [GetTitleByKey('e_minister_grand_marshal').MakeScope.ScriptValue('mam_revenue_fund_display_cash')|0] / unreviewed"
