l_english:
 mam_personnel_confirmation_laws:0 "Personnel Appointment Confirmation"
 mam_personnel_confirmation_delegated:0 "Delegate Senior Appointments"
 mam_personnel_confirmation_delegated_desc:0 "Personnel chooses and appoints eligible senior civilian governors without seeking a separate imperial decision for each nomination."
 mam_personnel_confirmation_empire:0 "Reserve Empire Appointments"
 mam_personnel_confirmation_empire_desc:0 "Personnel appoints kingdom governors directly. Every nomination to an empire office must receive the emperor's confirmation."
 mam_personnel_confirmation_all:0 "Confirm Every Senior Appointment"
 mam_personnel_confirmation_all_desc:0 "Personnel puts forward eligible nominees, but the emperor must confirm every appointment to a kingdom or empire office."
 mam_personnel_authority_decision:0 "Personnel: Set Appointment Authority"
 mam_personnel_authority_title:0 "Personnel: Appointment Authority"
 mam_personnel_authority_desc:0 "Delegate senior appointments, reserve empire-tier public offices, or require confirmation for all senior offices. Changes cost 150 Prestige, require peace and have a five-year cooldown. Existing submitted recommendations retain their confirmation requirement. Unanswered recommendations return to Personnel after 90 days; they are not silently approved."
 mam_personnel_authority_open:0 "Review appointment authority"
 mam_personnel_review_recommendation_decision:0 "Personnel: Review Appointment Recommendation"
 mam_personnel_review_recommendation_desc:0 "Review one senior appointment awaiting your confirmation. Only the emperor can approve a reserved appointment."
 mam_personnel_authority_event_desc:0 "The ministry can carry much of the burden of choosing governors. Yet every seal entrusted to an official is a share of imperial authority. How much of that choice should I leave to Personnel, and how much should remain before the throne?"
 mam_personnel_authority_delegate_option:0 "Let Personnel settle the senior appointments."
 mam_personnel_authority_empire_option:0 "Bring the highest provincial appointments before me."
 mam_personnel_authority_all_option:0 "No senior appointment shall proceed without my seal."
 mam_personnel_authority_change_tt:0 "Costs 150 Prestige. Requires peace and starts a five-year cooldown. Existing submitted recommendations keep their confirmation requirement."

# The native law panel renders *_effects through Law.GetEffectDescription.
 mam_personnel_confirmation_scope:0 "$EFFECT_LIST_BULLET$#indent_newline:3 [county|E] and [duchy|E] appointments follow the usual succession#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Central [ministry|E] appointments and imperial succession follow separate rules#!"
 mam_personnel_confirmation_delegated_effects:0 "$EFFECT_LIST_BULLET$#indent_newline:3 The [minister_of_personnel|E] directly appoints civilian [kingdom|E] [governors|E]#!\n$EFFECT_LIST_BULLET$#indent_newline:3 The [minister_of_personnel|E] directly appoints civilian [empire|E] [governors|E]#!\n$mam_personnel_confirmation_scope$"
 mam_personnel_confirmation_empire_effects:0 "$EFFECT_LIST_BULLET$#indent_newline:3 The [minister_of_personnel|E] directly appoints civilian [kingdom|E] [governors|E]#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Civilian [empire|E] appointments require imperial confirmation#!\n$mam_personnel_confirmation_scope$"
 mam_personnel_confirmation_all_effects:0 "$EFFECT_LIST_BULLET$#indent_newline:3 Civilian [kingdom|E] appointments require imperial confirmation#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Civilian [empire|E] appointments require imperial confirmation#!\n$mam_personnel_confirmation_scope$"
