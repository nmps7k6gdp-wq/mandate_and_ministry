 mam_senior.consequence_obligation:0 "On successful appointment, the sponsored appointment fulfills this minister's paid obligation to the candidate."
 mam_senior.narrative:0 "A new governor must take up the seal of #V [mam_posting.GetName]#!. Until the appointment is settled, the office rests with the throne.\n\nThe ministry has examined those who could serve. Some would leave another post to come here; others would take a step upward, or enter office for the first time. Whom shall I put forward?"
 mam_senior.no_candidates_title:0 "The Succession Needs Review"
 mam_senior.no_candidates_desc:0 "The ministry could not obtain a living local successor from the records for #V [mam_posting.GetName]#!. Rather than interrupt the realm's succession, I must leave this vacancy to the established process."
 mam_senior.no_candidates_accept:0 "Let the established succession proceed."
 mam_senior.commit_failed_title:0 "The appointment could not be completed"
 mam_senior.commit_failed_tt:0 "The candidate or the arrangements for their old office no longer passed the final checks. The office remains pending; other appointments can proceed."
 mam_senior.block_source_tt:0 "The candidate meets the destination screening, but the ministry cannot automatically surrender this person's present mix of offices. The existing office must be regularized before this transfer can proceed."
 mam_senior.block_dead_tt:0 "This nominee has died. Mark another living candidate."
 mam_senior.block_age_tt:0 "This office requires an adult nominee."
 mam_senior.block_prison_tt:0 "This nominee is imprisoned."
 mam_senior.block_realm_tt:0 "This nominee is no longer in the appointing realm."
 mam_senior.block_merit_tt:0 "This nominee's current merit rank is below the recorded requirement for this office."
 mam_senior.block_exam_tt:0 "The nominee does not meet the emperor's current examination requirement for this office."
 mam_senior.block_rank_tt:0 "This candidate already governs a higher-tier territorial office. This route does not make a demotion."
 mam_senior.native_appointment_law_tt:0 "The office follows appointment succession."
 mam_senior.native_different_holder_tt:0 "The candidate does not already hold this office."
 mam_senior.sponsorship_deferred_tt:0 "After a successful appointment, the appointee appreciates the minister who nominated them:"

 mam_senior.confirmation_later:0 "This recommendation can wait."
 mam_senior.imperial_approve_tt:0 "Grant #V [mam_posting.GetName]#! and its recorded jurisdiction to #bold [mam_senior_nominee.GetShortUIName]#!."
 mam_senior.imperial_return_tt:0 "Personnel reopens the nomination after 30 days. The office remains in imperial custody."
 mam_senior.imperial_later_tt:0 "Leave the recommendation pending. You can reopen it through Personnel: Review Appointment Recommendation. After 90 days without a decision, it returns to Personnel."
 mam_senior.imperial_first_tt:0 "This is a first territorial appointment; no existing governorship is vacated."
 mam_senior.imperial_lateral_tt:0 "A transfer from #V [mam_senior_nominee.GetPrimaryTitle.GetName]#!. That office is vacated and filled separately."
 mam_senior.imperial_promotion_tt:0 "A promotion from #V [mam_senior_nominee.GetPrimaryTitle.GetName]#!. That office is vacated and filled separately."
 mam_senior.imperial_source_blocked_tt:0 "The nominee's current holdings cannot be separated for this appointment. Return the recommendation to Personnel for reconsideration."
 mam_senior.parent_governor_tt:0 "After appointment, this kingdom office will serve under #bold [mam_senior_preview_parent.GetShortUIName]#!, the current governor of its de jure empire. The ministry checks the superior again when the appointment is completed. Recorded lower holdings and vassals remain part of the office."
 mam_senior.parent_throne_tt:0 "The governor serves directly under the throne while no eligible de jure empire governor is available. Recorded lower holdings and vassals remain part of the office. A kingdom awaiting its empire governor is placed under that governor when the appointment is settled."
 mam_senior.parent_empire_throne_tt:0 "This empire office answers directly to the throne. Its recorded lower holdings and vassals are restored with the appointment; separately pending kingdom offices keep their own appointments."
