l_english:
 mam_senior.title:0 "A Successor for [mam_posting.GetNameNoTooltip]"
 mam_senior.desc:0 "[mam_posting.GetName] is held temporarily by the throne. Choose an eligible successor. The office retains its jurisdiction. A serving nominee leaves their old posting to its eligible native successor. Unresolved files attempt the default appointment after 90 days."
 mam_senior.later:0 "This appointment can wait a little longer."
 mam_senior.default:0 "Appoint [mam_senior_default.GetShortUINameNoTooltip] - [mam_senior_default.Custom('MamSeniorAppointmentType')] (vanilla order)"
 mam_senior.default_tt:0 "#bold [mam_senior_default.GetShortUIName]#! is next in the appointment order for #V [mam_posting.GetName]#!."
 mam_senior.professional:0 "Appoint [mam_senior_professional.GetShortUINameNoTooltip] (professional choice)"
 mam_senior.professional_tt:0 "[mam_senior_professional.GetShortUIName]. Eligibility is checked again before appointment."
 mam_senior.preferred:0 "Appoint [mam_senior_preferred.GetShortUINameNoTooltip] - [mam_senior_preferred.Custom('MamSeniorAppointmentType')] (ministerial preference)"
 mam_senior.preferred_tt:0 "The minister favors #bold [mam_senior_preferred.GetShortUIName]#! for #V [mam_posting.GetName]#!."
 mam_senior.marked:0 "Appoint [mam_senior_marked.GetShortUINameNoTooltip] - [mam_senior_marked.Custom('MamSeniorAppointmentType')] (marked candidate)"
 mam_senior.marked_tt:0 "I have marked #bold [mam_senior_marked.GetShortUIName]#! for consideration. This appointment would place them in #V [mam_posting.GetName]#!."
 mam_senior.stress_tt:0 "Choosing a candidate more than five public-suitability points below the professional choice gives 15 Stress for each of Just and Honest. A qualified relative is not automatically an improper choice. A Vengeful minister gains 15 Stress for appointing a personal rival."
 mam_senior.refresh:0 "Review another shortlist"
 mam_personnel_resume_appointments_decision:0 "Personnel: Resume Senior Appointments"
 mam_personnel_resume_appointments_desc:0 "Resume pending senior appointments one at a time. Another open appointment must be resolved or deferred first. County and duchy succession remains automatic."
 mam_senior.resume:0 "Review the next appointment"
 mam_senior.confirmation_title:0 "An Appointment for [mam_posting.GetNameNoTooltip]"
 mam_senior.confirmation_desc:0 "Before me lies the ministry's recommendation: #bold [mam_senior_nominee.GetShortUIName]#! is to take charge of #V [mam_posting.GetName]#!.\n\nThe appointment awaits my seal. I can entrust the office to [mam_senior_nominee.GetHerHim], or return the papers and ask Personnel to reconsider."
 mam_senior.approve:0 "I entrust #V [mam_posting.GetName]#! to #bold [mam_senior_nominee.GetShortUIName]#! [mam_senior_nominee.Custom('MamExamAppointmentLabel')]."
 mam_senior.return:0 "Ask Personnel to reconsider this appointment."
 mam_senior.rival_stress_tt:0 "A Vengeful minister gains 15 Stress for appointing a personal rival. Stress applies only after a successful appointment."
 mam_senior.type_first:0 "first office grant"
 mam_senior.type_lateral:0 "lateral transfer"
 mam_senior.type_promotion:0 "promotion"
 mam_senior.type_unavailable:0 "rank no longer eligible"
