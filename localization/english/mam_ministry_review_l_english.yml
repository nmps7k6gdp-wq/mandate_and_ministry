l_english:
 mam_mr.title:0 "[mam_mr_title.GetNameNoTier]: A New Minister"
 mam_mr.narrative:0 "Following [mam_mr_predecessor.GetShortUINamePossessive] death, [mam_mr_incumbent.GetShortUIName] has taken charge of the #V [mam_mr_title.GetNameNoTier]#!. The seal has already passed to [mam_mr_incumbent.GetHerHim], but the transfer of authority awaits my approval.\n\nI may confirm the succession or entrust the ministry to another qualified servant of the realm."
 mam_mr.confirm:0 "Confirm #bold [mam_mr_incumbent.GetShortUIName]#! [mam_mr_incumbent.Custom('MamExamAppointmentLabel')] as head of the #V [mam_mr_title.GetNameNoTier]#!."
 mam_mr.professional:0 "Appoint #bold [mam_mr_professional.GetShortUIName]#! [mam_mr_professional.Custom('MamExamAppointmentLabel')] to the #V [mam_mr_title.GetNameNoTier]#!. [mam_mr_professional.Custom('MamMinistryReviewBasis')]"
 mam_mr.preferred:0 "Give the #V [mam_mr_title.GetNameNoTier]#! to #bold [mam_mr_preferred.GetShortUIName]#! [mam_mr_preferred.Custom('MamExamAppointmentLabel')]. [mam_mr_preferred.Custom('MamMinistryReviewBasis')]"
 mam_mr.marked:0 "Entrust the #V [mam_mr_title.GetNameNoTier]#! to my nominee, #bold [mam_mr_marked.GetShortUIName]#! [mam_mr_marked.Custom('MamExamAppointmentLabel')]. [mam_mr_marked.Custom('MamMinistryReviewBasis')]"
 mam_mr.defer:0 "Let the present minister serve while I consider the matter."
 mam_mr.approve_tt:0 "Confirm the minister who already holds this office. They retain the ministry and its council seat."
 mam_mr.replace_tt:0 "The selected candidate takes this ministry and its council seat. The installed successor relinquishes this office. Any move from another ministry follows its normal succession."
 mam_mr.defer_tt:0 "Keep this review pending for 30 days. The installed minister continues governing. You may resume pending reviews through your Ministry decision; deferral does not count as approval."
 mam_mr.marked_tt:0 "This is your standing ministerial nominee. An endorsement does not waive the qualifications of this particular office."
 mam_mr.stress_commit_tt:0 "Stress is applied only after confirmation or replacement succeeds."
 mam_mr.block_dead:0 "This nominee has died."
 mam_mr.block_age:0 "This nominee is not an adult."
 mam_mr.block_prison:0 "This nominee is imprisoned."
 mam_mr.block_realm:0 "This nominee is no longer in the Chinese imperial realm."
 mam_mr.block_native_council:0 "This nominee does not currently meet this ministry's council qualifications, including availability and the applicable service restrictions."
 mam_mr.block_native_title:0 "This nominee cannot currently receive this particular ministry under its appointment rules."
 mam_mr.block_merit:0 "This nominee does not meet this office's required merit level."
 mam_mr.block_upper_minister:0 "Only the emperor may redirect one of the three upper ministers; the Chancellor cannot move them into a lower ministry through this review."
 mam_mr.basis_paid:0 "#N Paid patronage#!"
 mam_mr.basis_nepotism:0 "#N Nepotism: weaker record#!"
 mam_mr.basis_weak:0 "#N Weaker record#!"
 mam_mr.basis_family:0 "#warning Family backing#!"
 mam_mr.basis_faction:0 "#warning Faction backing#!"
 mam_mr.basis_friend:0 "#warning Friendship#!"
 mam_mr.basis_trait:0 "#warning Personal preference#!"
 mam_mr.basis_qualified:0 "#weak Qualified alternative#!"
 mam_mark_upper_ministry_candidate_interaction:0 "Ministry: Endorse an Upper Minister"
 mam_mark_upper_ministry_candidate_interaction_desc:0 "Mark this person for consideration when the Chancellor, Censor or Grand Marshal dies. The successor takes office first; you can then confirm them or choose a qualified alternative. Your nominee remains marked until you withdraw the endorsement."
 mam_mark_lower_ministry_candidate_interaction:0 "Ministry: Endorse a Lower Minister"
 mam_mark_lower_ministry_candidate_interaction_desc:0 "Mark this person for your next review following the death of the minister of Personnel, War, Rites, Works, Revenue or Justice. The installed successor and your qualified alternatives remain available. Your nominee remains marked until you withdraw the endorsement."
 mam_clear_upper_ministry_candidate_interaction:0 "Ministry: Withdraw My Endorsement"
 mam_clear_lower_ministry_candidate_interaction:0 "Ministry: Withdraw My Endorsement"
 mam_clear_ministry_candidate_desc:0 "Withdraw my standing endorsement for a future ministerial succession. This does not remove anyone from office or clear Personnel's provincial nominee."
 mam_clear_ministry_candidate_decision:0 "Ministry: Clear My Ministerial Nominee"
 mam_mr.clear_mark:0 "Withdraw the endorsement"
 mam_resume_ministry_reviews_decision:0 "Ministry: Resume Succession Reviews"
 mam_resume_ministry_reviews_desc:0 "Resume deferred ministerial succession reviews within my authority. Reviews are considered one at a time. The emperor confirms the upper three ministries; the Chancellor confirms the lower six."
 mam_mr.resume:0 "Review pending successions"
 mam_ministry_confirmed_appointment:0 "Confirmed My Ministry"
 mam_ministry_displaced_appointment:0 "Denied Me the Ministry"
 mam_mr.confirmed_title:0 "My Ministry Confirmed"
 mam_mr.confirmed_notice:0 "[mam_mr_actor.GetShortUIName] has confirmed my appointment to the [mam_mr_title.GetNameNoTier]."
 mam_mr.displaced_title:0 "Passed Over for the Ministry"
 mam_mr.displaced_notice:0 "[mam_mr_actor.GetShortUIName] has entrusted the [mam_mr_title.GetNameNoTier] to [mam_mr_selected.GetShortUIName] instead of confirming me."
 mam_mr.failed_title:0 "The Appointment Remains Unsettled"
 mam_mr.failed_notice:0 "The selected appointment did not complete. The ministry has not been recorded as approved; its current holder will be reviewed again."
