l_english:
 mam_recruitment_laws:0 "Civil Recruitment Standards"
 mam_recruitment_mixed:0 "Mixed Recruitment"
 mam_recruitment_mixed_desc:0 "Retired in the Personnel revamp. Native appointment requirements apply; this saved law has no effect and is cleared by maintenance."
 mam_recruitment_preference:0 "Examination Preference"
 mam_recruitment_preference_desc:0 "Retired in the Personnel revamp. Native appointment requirements apply; this saved law has no effect and is cleared by maintenance."
 mam_recruitment_strict:0 "Strict Examination Standards"
 mam_recruitment_strict_desc:0 "Retired in the Personnel revamp. Native appointment requirements apply; this saved law has no effect and is cleared by maintenance."
 mam_recruitment_policy_decision:0 "Personnel: Review Recruitment Law"
 mam_recruitment_policy_decision_desc:0 "Review recruitment qualifications for senior Personnel appointments. Only the emperor may change this law. Opening the review is free; changes cost 150 Prestige and require peace, no pending legacy proposal, and the ten-year recruitment cooldown."
 mam_policy.open:0 "Review the recruitment law"
 mam_policy.cooldown:0 "\n\nThe realm is within its ten-year recruitment-law cooldown. You can review the current standard, but cannot change it yet."
 mam_personnel.0050.t:0 "Civil Recruitment Standards"
 mam_policy.overview:0 "#bold Current standard:#! [ROOT.Char.Custom('MamRecruitmentStandard')]\n\n#bold Mixed Recruitment#!\nUse ordinary appointment requirements and suitability scores.\n\n#bold Examination Preference#!\nAdd 10 suitability points for officials who passed the provincial examination or higher.\n\n#bold Strict Examination Standards#!\nAlso require provincial qualification for duchies and metropolitan or palace qualification for kingdoms. A bypass alone does not qualify.\n\n#bold Changing the law#!\n150 Prestige; ten-year cooldown. Only the independent emperor may change it, at peace with no pending recommendation. These standards govern ministry nominations; CK3's other appointment routes remain separate."
 mam_policy.choose_mixed:0 "Adopt Mixed Recruitment (150 Prestige)"
 mam_policy.choose_preference:0 "Adopt Examination Preference (150 Prestige)"
 mam_policy.choose_strict:0 "Adopt Strict Examination Standards (150 Prestige)"
 mam_personnel.0051.t:0 "State the Case for Appointment"
 mam_reason.overview:0 "#bold Nominee:#! [mam_nominee.GetShortUIName]\n#bold Posting:#! [mam_posting.GetName]\n\n#bold State your grounds#!\nPublic qualifications require suitability at least equal to the incumbent. Established service requires merit rank 4 or higher. Personal patronage requires shared house membership or friendship. Recruitment law and appointment requirements apply to every route.\n\n#N Declared patronage adds 15 Stress for each of the Just and Honest traits.#! Cancelling a draft has no such cost. Successful appointments create a sponsorship relationship and a service assessment after two years."
 mam_reason.professional:0 "Recommend on public qualifications"
 mam_reason.service:0 "Recommend on established service"
 mam_reason.patronage:0 "Declare personal patronage"
 mam_reason.approval_professional:0 "Basis: public qualifications. The ministry is putting its professional judgment behind this nomination."
 mam_reason.approval_service:0 "Basis: established service. The nominee has native merit rank 4 or higher; examination law still applies."
 mam_reason.approval_patronage:0 "Basis: personal patronage. The minister has declared a house or friendship connection. This does not waive qualifications."
 mam_personnel.0052.t:0 "Personnel: Two-Year Service Assessment"
 mam_service.record:0 "Official: [mam_nominee.GetShortUIName].\nPosting: [mam_posting.GetName].\n\nMerit rank at appointment: [mam_review_start_merit|0].\nCurrent merit rank: [mam_review_end_merit|0].\nCurrent Stewardship: [mam_review_stewardship|0].\n\nThe official has remained in the reviewed office. The assessment compares native merit rank with the appointment baseline and considers current Stewardship. It does not measure revenue or prove misconduct.\n\n"
 mam_service.good:0 "Merit rank increased and Stewardship is at least 10. A living sponsor still serving in this realm receives the ruler's approval (+10 Opinion for three years)."
 mam_service.poor:0 "Merit rank fell, or Stewardship is below 8. A living sponsor still serving in this realm receives criticism (-10 Opinion for three years); Just, Honest and Diligent sponsors each gain 10 Stress. The assessment changes no titles."
 mam_service.neutral:0 "The record is inconclusive: neither the positive nor adverse threshold was met. No political reward or penalty is applied."
 mam_sponsored_appointment:0 "Sponsored My Appointment"
 mam_sound_recommendation:0 "Sound Personnel Recommendation"
 mam_weak_recommendation:0 "Weak Personnel Recommendation"
 mam_recruitment_native:0 "Native Appointment Requirements"
