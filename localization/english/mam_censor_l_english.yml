l_english:
 mam_cen.opening:0 "Concerning the conduct of public office,"
 mam_cen.stale:0 "These papers have been overtaken by events."
 mam_cen.facts_document:0 "\n\nThe surviving papers connect a private payment with an appointment. They establish an exchange to explain; they do not turn every favor into a crime."
 mam_cen.facts_proof:0 "\n\nThe payment and appointment linkage has now been corroborated."
 mam_cen.facts_no_proof:0 "\n\nThe inquiry has not established misconduct. The court can still debate an official's judgment without treating suspicion as a proved charge."
 mam_cen.facts_payment_unproved:0 "\n\nThe alleged connection between a private payment and an appointment remains uncorroborated."
 mam_cen.facts_obstruction:0 "\n\nAn explicit order to withhold records or turn away the inquiry is recorded separately from the original concern."
 mam_cen.facts_receipt:0 "\n\nA public project contribution appears in the accounts. It records legitimate expenditure; its presence is no evidence of theft."
 mam_cen.facts_abuse:0 "\n\nThe inspection itself has become contentious: threats or a demand for private advantage are recorded against [mam_cen_abuser.GetShortUIName]."
 mam_cen.facts_coercion:0 "\n\nA confession was demanded under threat. It has not been treated as independent corroboration."
 mam_cen.facts_fabricated:0 "\n\nThe memorial asserts more than the admitted record supports. The accusation must not be mistaken for an established fact."
 mam_cen.facts_defense:0 "\n\n[mam_cen_defender.GetShortUIName] has put their standing behind the accused. Disregarding this defense may widen the dispute beyond the original inquiry."
 mam_cen.facts_legal_caution:0 "\n\n[mam_cen_legal_reviewer.GetShortUIName] disputes the framing of the accusation. The facts remain on record, alongside this disagreement."
 mam_cen.facts_safeguards:0 "\n\nA request for safeguards is on the record. Continuing the same pressure will now be a deliberate choice."
 mam_cen.facts_inherited:0 "\n\nThis file belongs to the office. Earlier threats and promises remain the responsibility of their recorded authors, including a former Censor."
 mam_cen.facts_handoff:0 "\n\nThe intended handoff could not be confirmed. No retirement or appointment timeout is claimed; another disposition is still required."
 mam_cen.facts_return:0 "\n\nA return certified during this inspection has been contradicted by its own surviving records. The unsupported attestation is a new official act, not a theft invented from missing money."
 mam_cen.facts_public:0 "\n\nA criminal accusation or detention is part of this inspection. Its existence is recorded separately from proof of the alleged act. The Censorate is reviewing the official's fitness for office and the handling of the matter; it has not issued a criminal sentence."
 mam_cen.facts_public_source:0 "\n\nThe referral records [mam_cen_charge_accuser.GetShortUIName] as the authority who raised or acted on the matter. That does not make their claim an established finding."
 mam_cen.facts_public_checked:0 "\n\nThe current native legal grounds have been examined. Any recommendation based on those grounds must still satisfy them when acted upon; a pardon, consumed reason or changed authority can alter the position."
 mam_cen.facts_judicial:0 "\n\nA documented request for private benefit or an unauthorized judicial measure has been corroborated against this official. The actual author and act are on record. This finding alone is not a criminal warrant or conviction."
 mam_cen.quiet:0 "Hear #bold [mam_cen_subject.GetShortUIName]#! privately first."
 mam_cen.quiet_tt:0 "Begin with a confidential request. No guilt, loss of office or payment follows. The official will choose how to answer."
 mam_cen.summon:0 "Require the records of #bold [mam_cen_office.GetName]#! under seal."
 mam_cen.summon_tt:0 "Issue a formal demand for records and an explanation. An explicit order to obstruct can become a separate supported finding; a lawful challenge is not obstruction."
 mam_cen.terror:0 "Let #bold [mam_cen_subject.GetShortUIName]#! fear what comes next."
 mam_cen.terror_tt:0 "Gain 10 Dread and Feared Censor for 3 years (+10 Dread baseline, -10 General Opinion). The official loses 25 Opinion of you for 5 years. Your threats are recorded and can provoke a counter-petition. They do not create proof."
 mam_cen.decline:0 "There is no need to pursue this inspection."
 mam_cen.decline_tt:0 "Close without penalties or a finding of guilt. The subject cannot be repeatedly selected to farm rewards."
 mam_cen.1_title:0 "Where the Censor Casts a Shadow"
 mam_cen.1_desc:0 "The seal of [mam_cen_office.GetName] carries authority, but authority invites scrutiny. I have opened an inspection of [mam_cen_subject.GetShortUIName]. How I approach these papers will determine whether officials see a fair hearing, an obligation to answer, or a warning to the whole court."
 mam_cen.imperial_request:0 "\n\nThe emperor has requested scrutiny. The request names a subject, not a predetermined guilty verdict."
 mam_cen.cooperate:0 "Send the papers. I will answer for my decisions."
 mam_cen.cooperate_tt:0 "Cooperate. Any existing supported appointment record can be corroborated. Lawful public payments and ordinary mistakes do not become crimes."
 mam_cen.contest:0 "I will answer, but first put the limits of this demand in writing."
 mam_cen.contest_tt:0 "Challenge the inspection's scope while providing an answer. This is not recorded as obstruction. The Chancellor or another eligible petitioner can take up the dispute."
 mam_cen.withhold:0 "Turn away the messengers. These papers will not leave my office."
 mam_cen.withhold_tt:0 "Deliberately obstruct the inspection. This new act is recorded separately. If appointment papers are concealed, the current chance of recovering them is [mam_cen_payment_chance|0]%, based on the inspector's and your relevant skills and traits. Failure does not prove the original allegation."
 mam_cen.admit:0 "The private payment was connected to the appointment. Let me explain."
 mam_cen.admit_tt:0 "Admit the documented exchange. The admission supports a finding, but correction, censure and imperial protection remain possible. No money is confiscated."
 mam_cen.2_title:0 "An Answer Under Seal"
 mam_cen.2_desc:0 "Your administration of [mam_cen_office.GetName] is under inspection. Send an account of your conduct and the relevant records. I will hear your explanation before deciding what to put before the throne."
 mam_cen.2_public:0 "A criminal accusation concerning you has reached the Censorate. I will hear your account of the charge and of how it has been pursued. You may answer from custody. Neither detention nor this demand for an answer establishes your guilt."
 mam_cen.back_inquiry:0 "The Censor must be allowed to ask difficult questions."
 mam_cen.back_inquiry_tt:0 "Support independent scrutiny without declaring the subject guilty. Your intervention is retained for the findings and imperial review."
 mam_cen.defend:0 "I will put my name behind #bold [mam_cen_subject.GetShortUIName]#!."
 mam_cen.defend_tt:0 "The official gains 20 Opinion of you for 5 years; the Censor loses 15 Opinion of you for 3 years. Your defense does not erase records and is weighed in the imperial response."
 mam_cen.safeguards:0 "Produce the facts, and stop governing through fear."
 mam_cen.safeguards_tt:0 "Demand safeguards and preserve a counter-petition about the inspection. The Censor can respect it or deliberately continue; the emperor can judge recorded abuses."
 mam_cen.3_title:0 "Who Watches the Watcher?"
 mam_cen.3_desc:0 "The inspection of [mam_cen_subject.GetShortUIName] has reached my door. Some officials fear that resistance will be called guilt; others fear that protection will become a license for abuse. My intervention could steady this inquiry, or turn it into a contest between offices."
 mam_cen.verify:0 "Check the records before I reach a finding."
 mam_cen.verify_tt:0 "Allow three weeks for comparison. If a false return exists, the current chance of exposing it is [mam_cen_return_chance|0]%. Intrigue, Stewardship, Learning and relevant traits on both sides matter; Martial also matters for War/Marshal returns. Honest papers never become false because of a failed check."
 mam_cen.public_compare:0 "Examine the lawful grounds before I judge their fitness for office."
 mam_cen.public_compare_tt:0 "Record whether the emperor or current liege actually has a native imprisonment reason against this official. A verified, still-current reason can justify an administrative censure or recommendation to leave office. It does not prove the alleged crime, create another criminal reason or release a prisoner."
 mam_cen.consult:0 "Ask Justice what these facts can actually support."
 mam_cen.consult_tt:0 "Request a reasoned advisory opinion from the current Justice minister, or the emperor if Justice is implicated or unavailable. This is not a trial and grants no imprisonment reason."
 mam_cen.connected:0 "Hear #bold [mam_cen_connected.GetShortUIName]#! about the appointment."
 mam_cen.connected_tt:0 "Hear the actual recorded payer. An evasive denial can be challenged with a current [mam_cen_witness_chance|0]% chance, comparing your Intrigue/Learning with their Intrigue/Diplomacy and relevant traits. Admitted proof cannot be erased by eloquence. Kinship and faction alone are not evidence."
 mam_cen.coerce:0 "They will confess before I put down my brush."
 mam_cen.coerce_tt:0 "Gain 10 Dread and renew Feared Censor for 3 years (+10 Dread baseline, -10 General Opinion). Record coercion against you. A pressured confession does not supply independent proof and may provoke imperial restraint."
 mam_cen.bargain:0 "A private obligation might settle this more quietly."
 mam_cen.bargain_tt:0 "Ask the official to owe you a favor in exchange for withholding this custom report. They can refuse or reveal the demand. No Gold or Treasury changes hands; known native secrets remain known."
 mam_cen.4_title:0 "The Papers Between Us"
 mam_cen.4_desc:0 "The reply from [mam_cen_subject.GetShortUIName] lies beside the interventions it has stirred. I can examine what survives, seek an independent view, or use the weight of my office to make resistance costly. The next step will be mine to defend."
 mam_cen.public_legal_check:0 "Examine the lawful grounds without prejudging the charge."
 mam_cen.public_legal_check_tt:0 "Check whether the emperor or the official's current liege presently holds a native imprisonment reason. Record your own review. This can support an administrative fitness recommendation while the grounds remain; it does not prove the alleged act or create a conviction, release or new criminal reason."
 mam_cen.legal_check:0 "Compare the original papers before I give my opinion."
 mam_cen.legal_check_tt:0 "Carry out an independent check using your own Learning, Stewardship, Intrigue and traits against the official's abilities. Current chance to uncover each actual concealed linkage or false return: [mam_cen_justice_chance|0]%. No wrongdoing is generated when the record is honest."
 mam_cen.legal_support:0 "There is a supported matter for the throne to consider."
 mam_cen.legal_support_tt:0 "Support an administrative referral on the recorded facts. This adds no criminal secret, lawful arrest reason or sentence."
 mam_cen.legal_caution:0 "Separate what is proved from what is merely suspected."
 mam_cen.legal_caution_tt:0 "Record caution about the legal framing. The Censor can still impeach or remonstrate, but the emperor will see this disagreement."
 mam_cen.legal_protect:0 "I will stand against proceedings against this official."
 mam_cen.legal_protect_tt:0 "The official gains 20 Opinion of you for 5 years. Your personal intervention is recorded; it cannot erase documents or prevent direct imperial reporting."
 mam_cen.5_title:0 "A Finding Is Not a Sentence"
 mam_cen.5_desc:0 "I ask for your assessment of the inspection concerning [mam_cen_subject.GetShortUIName]. State what the admitted facts can support, and where my conclusions run ahead of them. Your reply will accompany any memorial; it will not replace the emperor's judgment."
 mam_cen.clear:0 "Close the inspection of #bold [mam_cen_subject.GetShortUIName]#! without a sanction."
 mam_cen.clear_tt:0 "Close with no sanction or payment. The official gains 15 Opinion of you for 3 years. Closing does not erase independently known secrets or actual historical acts."
 mam_cen.correct:0 "Accept a correction instead of breaking their career."
 mam_cen.correct_tt:0 "Resolve the supported administrative fault without removing office or moving money. The official gains 15 Opinion of you for 3 years and Reconciled with Oversight for 1 year (-10% Stress gain)."
 mam_cen.censure:0 "Censure #bold [mam_cen_subject.GetShortUIName]#! publicly."
 mam_cen.censure_tt:0 "For a supported finding: the official loses 50 Influence and gains Publicly Censured for 2 years (-15% monthly Influence, -5 General Opinion), and loses 25 Opinion of you for 5 years. No title, appointment score or Treasury changes."
 mam_cen.public_censure:0 "Censure #bold [mam_cen_subject.GetShortUIName]#!'s continuance in office under these grounds."
 mam_cen.public_censure_tt:0 "On separately reviewed, still-current native legal grounds, impose the administrative censure detailed below. This is not proof of the original crime or a criminal sentence. No discovery reward is granted."
 mam_cen.impeach:0 "Put #bold [mam_cen_subject.GetShortUIName]#!'s tenure before the emperor."
 mam_cen.impeach_tt:0 "Submit the facts, defenses, advisory opinion and recorded methods directly to the emperor. Removal, protection, censure, further scrutiny and a rebuke to the investigator are possible. No punishment happens merely on submission."
 mam_cen.remonstrate:0 "The appointment or policy deserves an answer, even without a charge."
 mam_cen.remonstrate_tt:0 "Submit a political objection, explicitly distinguished from a proved crime. The emperor can defend the official or act politically. This does not veto Personnel or Revenue."
 mam_cen.misrepresent:0 "Present my suspicion as an established charge."
 mam_cen.misrepresent_tt:0 "Knowingly overstate an unsupported accusation. This records your misrepresentation, not the subject's guilt. An arbitrary emperor may still act politically; an adverse review can discredit or remove you."
 mam_cen.6_title:0 "What Shall the Court Hear?"
 mam_cen.6_desc:0 "The inspection of [mam_cen_office.GetName] is ready for my seal. The record does not speak for itself: I must decide what deserves correction, what merits public censure, and what should put an official's place before the emperor. My own conduct may now be part of that decision."
 mam_cen.public_imperial_check:0 "Examine the current lawful grounds before deciding."
 mam_cen.public_imperial_check_tt:0 "Check the current native imprisonment grounds once, without treating the accusation as a conviction. If verified grounds remain when you act, they can support an administrative censure or guarded removal. No prisoner is released and no crime is created."
 mam_cen.imperial_censure:0 "Uphold the supported censure of #bold [mam_cen_subject.GetShortUIName]#!."
 mam_cen.imperial_censure_tt:0 "The official loses 50 Influence, receives Publicly Censured for 2 years (-15% monthly Influence, -5 General Opinion), and loses 25 Opinion of the Censor for 5 years. No imprisonment, title transfer, money or candidate score change."
 mam_cen.public_imperial_censure:0 "Uphold an administrative censure under the current lawful grounds."
 mam_cen.public_imperial_censure_tt:0 "The separately reviewed native legal grounds remain current: impose the administrative censure detailed below. This does not convict the official of the original charge or create another criminal reason. There is no discovery reward."
 mam_cen.remove_official:0 "Require #bold [mam_cen_subject.GetShortUIName]#! to leave public office."
 mam_cen.remove_official_tt:0 "On verified removal, impose a 3-year native appointment timeout. Supported senior governors enter Personnel custody with their jurisdiction; lower governors retire through the native engine; ministers yield through the native heir handoff. Failed removal gives no success or timeout. Without supported misconduct or separately reviewed current native legal grounds, you gain 10 Tyranny only after removal. Prisoners cannot use this guarded retirement path."
 mam_cen.protect:0 "I will retain #bold [mam_cen_subject.GetShortUIName]#!."
 mam_cen.protect_tt:0 "The official gains 20 Opinion of you for 5 years and 3 years of protection from random inspection selection. An unconflicted Censor can accept, renew the memorial once or offer resignation. If the Censor is the accused, your decision closes the review. Protection neither erases facts nor blocks a genuinely new discovery."
 mam_cen.rebuke:0 "The investigator must answer for these methods."
 mam_cen.rebuke_tt:0 "The recorded author of the threats, coercion or false charge loses 75 Influence, is Discredited for 3 years (-20% monthly Influence, -10 General Opinion), and is Restrained for 2 years (-10% monthly Influence; harsh/custom bargaining methods blocked). A successor does not inherit their guilt."
 mam_cen.return:0 "There is one point that still needs a proper answer."
 mam_cen.return_tt:0 "Return once for a further examination, advisory opinion or connected testimony. This does not declare either official guilty and cannot repeat indefinitely."
 mam_cen.7_title:0 "An Office Under Accusation"
 mam_cen.7_desc:0 "The inspection of [mam_cen_subject.GetShortUIName] has become a question for the throne. The Censor seeks an answer; the official and those who defend them expect one too. I may uphold a supported finding, protect a useful servant, require further scrutiny, or turn my attention to how the accusation was pursued."
 mam_cen.7_recused:0 "The confidential papers concern [mam_cen_subject.GetShortUIName], whose own seal can offer no impartial judgment of this allegation. The decision rests with me. I may uphold a supported censure, retain the official, or require a lawful transfer of office."
 mam_cen.confirm_link:0 "I will confirm the exchange, and explain why I agreed."
 mam_cen.confirm_link_tt:0 "Corroborate the actual recorded payment and appointment linkage. No new accusation or personal sanction is automatically created against you."
 mam_cen.deny_link:0 "Deny the connection. Let them prove it without me."
 mam_cen.deny_link_tt:0 "Your Intrigue and Diplomacy oppose the inspector's Intrigue and Learning. If the linkage is not yet corroborated, there is a current [mam_cen_witness_chance|0]% chance your denial is defeated by the existing record. Already admitted proof is never erased."
 mam_cen.link_protest:0 "I will answer, but I will also report these threats."
 mam_cen.link_protest_tt:0 "Put a procedural complaint on record. It does not automatically disprove the payment or condemn the Censor. Recorded threats will accompany the final memorial."
 mam_cen.8_title:0 "The Name in the Margin"
 mam_cen.8_desc:0 "Your name appears in the record connecting a private payment to an appointment handled by [mam_cen_subject.GetShortUIName]. I require your account of that exchange. You are being heard as a connected participant; an accusation against another official is not proof against you."
 mam_cen.accept_answer:0 "The Dragon Throne has spoken. I will let the matter rest."
 mam_cen.accept_answer_tt:0 "Close the dispute without further sanctions. Recorded facts and the emperor's protection remain; disagreement is not erased."
 mam_cen.press:0 "Let my objection be heard openly, once more."
 mam_cen.press_tt:0 "Renew the memorial publicly once. The emperor can yield, insist on the decision, mediate, or remove you through a valid native handoff. This is a political risk, not automatic victory."
 mam_cen.resign_offer:0 "If my seal carries no weight, I offer to return it."
 mam_cen.resign_offer_tt:0 "Offer resignation. The emperor may uphold a censure, accept through the safe native minister handoff, or settle the disagreement. Your office is not removed merely by sending the offer."
 mam_cen.9_title:0 "The Throne Has Answered"
 mam_cen.9_desc:0 "The emperor will retain [mam_cen_subject.GetShortUIName]. My memorial has not vanished, but neither has it prevailed. I must decide whether accepting this answer serves the empire, whether the court should hear my objection, or whether I can continue to hold my own seal."
 mam_cen.yield:0 "Uphold the supported censure, and let the matter rest."
 mam_cen.yield_tt:0 "Apply the supported censure once: -50 Influence, 2 years of Publicly Censured (-15% monthly Influence, -5 General Opinion), and -25 Opinion of the Censor for 5 years. Retain the official's titles."
 mam_cen.stand_firm:0 "My decision stands. We will not reopen it again."
 mam_cen.stand_firm_tt:0 "End this dispute. The current Censor loses 15 Opinion of you for 3 years. No automatic punishment, office loss or realm-wide stability penalty follows disagreement."
 mam_cen.remove_censor:0 "Then return the seal of the Censorate."
 mam_cen.remove_censor_tt:0 "Remove the current Censor using the native heir handoff and a 3-year appointment timeout. This requires a safe, eligible successor and no mixed territorial holdings. The common fund and the investigated official's titles are untouched."
 mam_cen.mediate:0 "Retain both offices, under a narrower understanding."
 mam_cen.mediate_tt:0 "Retain both officials. Restrict the responsible Censor's harsh/custom bargaining methods for 2 years (-10% monthly Influence). Your Diplomacy also determines whether the settlement restores goodwill or leaves resentment. Lawful scrutiny and native spying remain available."
 mam_cen.10_title:0 "Two Seals Before the Throne"
 mam_cen.10_desc:0 "[mam_cen_censor.GetShortUIName] has renewed the objection to retaining [mam_cen_subject.GetShortUIName]. The dispute now concerns how this government can work together. Yielding may vindicate a necessary warning; standing firm may preserve a useful servant, or teach the court that protection matters more than an answer."
 mam_cen.owe_favor:0 "I will owe the favor. Let this report end here."
 mam_cen.owe_favor_tt:0 "The named bargainer receives one native Favor Hook on you in exchange for withholding this custom report. No Gold/Treasury moves and no native secret is concealed. The settlement is retained in the institutional record."
 mam_cen.refuse_favor:0 "I will answer the inspection, not owe a private debt."
 mam_cen.refuse_favor_tt:0 "Refuse. No hook or payment is created. The Censor must decide the report without this private agreement."
 mam_cen.expose_demand:0 "Put that demand before the emperor, with my name on it."
 mam_cen.expose_demand_tt:0 "Report the actual demand against its author. The emperor reviews both the original matter and the investigator's conduct. No guilt is assigned to a successor."
 mam_cen.11_title:0 "The Price of Quiet"
 mam_cen.11_desc:0 "A private accommodation has been suggested: an obligation to [mam_cen_bargainer.GetShortUIName], and this custom report need not reach the court. The offer does not alter the papers. I can accept the debt, refuse it, or carry the demand to the emperor myself."
 mam_cen.return_e_minister_of_personnel:0 "\n\nThe request concerns the reasons given for recommendations and the credentials behind them. A qualified relative is not automatically an unfit appointee; a certified false return is another matter."
 mam_cen.return_e_minister_of_revenue:0 "\n\nThe request concerns public accounts. Common funds, the imperial treasury and personal Gold must remain distinct. A legitimate payment is not a theft, and a missing explanation is not a missing sum."
 mam_cen.return_e_minister_of_works:0 "\n\nThe request concerns the administration of public works. Field reports and authorizations may arrive at different times; a project delay by itself establishes neither dishonesty nor diversion."
 mam_cen.return_e_minister_of_war:0 "\n\nThe request concerns military administration. A poor outcome is not a false return, and this demand gives the Censor no command over armies."
 mam_cen.return_e_minister_grand_marshal:0 "\n\nThe request concerns the account given of military service. The Marshal retains command; the truth of an official attestation remains open to scrutiny."
 mam_cen.return_e_minister_of_rites:0 "\n\nThe request concerns the performance of ceremonial and cultural duties. The Censor cannot rewrite examination honors or assume that appearing at an examination made this ministry its payer."
 mam_cen.return_e_minister_of_justice:0 "\n\nThe request concerns how official procedures have been described. It neither retries an existing criminal case nor transfers Justice's native powers to the Censor."
 mam_cen.return_e_minister_chancellor:0 "\n\nThe request reaches the government's own coordinating office. Defending a programme is legitimate; certifying an account known to be unchecked is a different choice."
 mam_cen.return_check:0 "Ask for time, and verify every assertion before signing."
 mam_cen.return_check_tt:0 "Take four weeks to verify the response. No misconduct is created. A slower answer is not obstruction, although political opponents may still complain."
 mam_cen.return_limits:0 "State plainly what these papers cannot establish."
 mam_cen.return_limits_tt:0 "Submit a limited but honest return. The uncertainty remains visible and cannot become a supported charge by itself."
 mam_cen.return_false:0 "Certify it all. My seal will have to stand for the missing checks."
 mam_cen.return_false_tt:0 "Knowingly sign beyond the checked record. This creates a new false official attestation, not a theft or a past crime. A proper comparison by the Censor may uncover it; it is not automatically known or proved."
 mam_cen.12_title:0 "The Signature They Require"
 mam_cen.12_desc:0 "The papers requested for [mam_cen_office.GetName] do not all arrive together. The Censor wants a signed return, while clerks warn that some details still need checking. I can admit the limits of the record, take time to verify it, or certify more than I can honestly establish."
 mam_cen.result_1_title:0 "The Inspection Closed"
 mam_cen.result_1_desc:0 "The inspection of [mam_cen_office.GetName] has closed without a sanction. This is a disposition of the present record, not a claim that every decision was wise or that known secrets have ceased to exist."
 mam_cen.result_2_title:0 "A Correction, Not a Ruined Career"
 mam_cen.result_2_desc:0 "The fault recorded in the inspection has been settled through an administrative correction. [mam_cen_subject.GetShortUIName] remains in office. No public money was seized and no appointment was reversed."
 mam_cen.result_3_title:0 "The Censor's Reprimand"
 mam_cen.result_3_desc:0 "[mam_cen_subject.GetShortUIName] has been publicly censured on a supported finding. The loss of Influence and standing is real, but the inspection has not transferred a title or created a criminal sentence."
 mam_cen.result_4_title:0 "A Memorial Upheld"
 mam_cen.result_4_desc:0 "The throne has upheld a supported censure of [mam_cen_subject.GetShortUIName]. The official retains the office under a public reprimand. The inquiry and the responses of those who intervened remain on record."
 mam_cen.result_5_title:0 "A Seal Returned"
 mam_cen.result_5_desc:0 "The emperor has required [mam_cen_subject.GetShortUIName] to leave public office through the native retirement procedure. The official receives a three-year appointment timeout. The Censor has not selected a replacement."
 mam_cen.result_6_title:0 "Protected by the Throne"
 mam_cen.result_6_desc:0 "The emperor retains [mam_cen_subject.GetShortUIName]. The political dispute has ended for now. Protection does not erase the inspection's record or turn disagreement into a criminal judgment."
 mam_cen.result_7_title:0 "The Investigator Rebuked"
 mam_cen.result_7_desc:0 "The recorded author of abusive methods has been discredited and restrained. The sanction belongs to that person, not whoever happens to hold the Censorate now. The original accusation has not thereby become a proved crime."
 mam_cen.result_9_title:0 "The Censor Returns the Seal"
 mam_cen.result_9_desc:0 "The emperor has ended this confrontation by removing the current Censor through the native ministry handoff. The investigated official remains in place. The office's institutional record survives its holder."
 mam_cen.result_10_title:0 "An Inspection Overtaken"
 mam_cen.result_10_desc:0 "Death, departure, unavailable authority or the outer time limit has ended the inspection of [mam_cen_office.GetName] without a new sanction. Uncertainty has not been converted into guilt or a payment."
 mam_cen.result_11_title:0 "A Report Kept Quiet"
 mam_cen.result_11_desc:0 "This custom report will not be put before the court. Any agreed private obligation and the disposition remain in the institutional record. No known native secret or public payment record has been erased."
 mam_cen.result_12_title:0 "An Uneasy Accommodation"
 mam_cen.result_12_desc:0 "Both officials remain. The Censor's harsh methods are restrained for two years, while lawful scrutiny and native intelligence work continue. The settlement ends the confrontation without pretending that everyone agreed."
 mam_cen.result_13_title:0 "The Handoff Could Not Be Confirmed"
 mam_cen.result_13_desc:0 "The intended removal did not satisfy its handoff checks. No successful retirement or new appointment timeout is claimed. Check the current office and Personnel custody before attempting another removal; no substitute title grant or payment was made."
 mam_cen.result_14_title:0 "An Inspection Declined"
 mam_cen.result_14_desc:0 "The Censor has declined to pursue the proposed inspection of [mam_cen_office.GetName]. No examination or clearance is claimed, and no penalty follows simply from having been selected."
 mam_cen.result_title:0 "Concerning an Inspection"
 mam_cen.result_unavailable:0 "The disposition cannot be read from these papers. No new action is taken."
 mam_cen.result_private_public:0 "The Censorate has closed the inspection of [mam_cen_office.GetName] without proposing a sanction. This notice establishes no clearance or conviction."
 mam_cen.result_public_censure:0 "[mam_cen_subject.GetShortUIName] has received an administrative censure for continuing in office under separately reviewed native legal grounds. Influence and standing are reduced. This disposition neither proves the original criminal accusation nor creates another criminal reason, imprisonment or release."
 mam_cen.received:0 "I have received the account."
 mam_cen.refer_justice_4:0 "Refer the matter concerning #bold [mam_cen_subject.GetShortUIName]#! to Justice."
 mam_cen.refer_justice_4_tt:0 "Create an independent judicial proceeding without declaring guilt or closing this administrative inspection. Justice hears the accused and must respect native grounds, judicial authority and actual custody. Existing Personnel succession remains separate."
 mam_cen.refer_justice_6:0 "Refer the matter concerning #bold [mam_cen_subject.GetShortUIName]#! to Justice."
 mam_cen.refer_justice_6_tt:0 "Create an independent judicial proceeding without declaring guilt or closing this administrative inspection. Justice hears the accused and must respect native grounds, judicial authority and actual custody. Existing Personnel succession remains separate."
 mam_cen.intel_title:0 "What the Confidential Papers Reveal"
 mam_cen.intel_known:0 "The papers name #bold [mam_cen_intel_subject.GetShortUIName]#!. This is a discovery to answer, not a sentence already passed. I can call the official to account, bring the matter before the throne, or keep my own report quiet."
 mam_cen.intel_public:0 "A criminal matter involving #bold [mam_cen_intel_subject.GetShortUIName]#! has reached the Censorate. The office is too important for either the charge or its handling to pass without scrutiny. I can hear the official, examine the lawful grounds and seek advice before reporting to the throne. An accusation alone does not establish guilt."
 mam_cen.intel_unknown:0 "A plot has been uncovered within the imperial court, but its author remains unnamed. I can put my officers on the trail or strengthen the intended victim's protection. Naming an enemy without tracing the plot would prove nothing."
 mam_cen.intel_trace_failed:0 "\n\nThe trail has broken off, or the plot ended before its author could be identified. No official has been named. Protection is still possible; another roll will not conjure up a culprit."
 mam_cen.intel_victim:0 "\n\nThe intended victim is [mam_cen_intel_victim.GetShortUIName]."
 mam_cen.intel_kind_1:0 "\n\nThe discovery concerns the siphoning of a public treasury. Native exposure and criminal proceedings remain separate from this inspection."
 mam_cen.facts_intel_1:0 "\n\nThe discovery concerns the siphoning of a public treasury. The original discovery is retained in the inspection; it has not created an automatic arrest or criminal sentence."
 mam_cen.intel_kind_2:0 "\n\nThe discovery concerns embezzlement. Native exposure and criminal proceedings remain separate from this inspection."
 mam_cen.facts_intel_2:0 "\n\nThe discovery concerns embezzlement. The original discovery is retained in the inspection; it has not created an automatic arrest or criminal sentence."
 mam_cen.intel_kind_3:0 "\n\nThe discovery concerns cheating in an imperial examination. Native exposure and criminal proceedings remain separate from this inspection."
 mam_cen.facts_intel_3:0 "\n\nThe discovery concerns cheating in an imperial examination. The original discovery is retained in the inspection; it has not created an automatic arrest or criminal sentence."
 mam_cen.intel_kind_4:0 "\n\nThe discovery concerns an invitation to a foreign incursion. Native exposure and criminal proceedings remain separate from this inspection."
 mam_cen.facts_intel_4:0 "\n\nThe discovery concerns an invitation to a foreign incursion. The original discovery is retained in the inspection; it has not created an automatic arrest or criminal sentence."
 mam_cen.intel_kind_5:0 "\n\nThe discovery concerns a conspiracy to seize sovereign power. Native exposure and criminal proceedings remain separate from this inspection."
 mam_cen.facts_intel_5:0 "\n\nThe discovery concerns a conspiracy to seize sovereign power. The original discovery is retained in the inspection; it has not created an automatic arrest or criminal sentence."
 mam_cen.intel_kind_6:0 "\n\nThe discovery concerns a murder. Native exposure and criminal proceedings remain separate from this inspection."
 mam_cen.facts_intel_6:0 "\n\nThe discovery concerns a murder. The original discovery is retained in the inspection; it has not created an automatic arrest or criminal sentence."
 mam_cen.intel_kind_7:0 "\n\nThe discovery concerns an attempted murder. Native exposure and criminal proceedings remain separate from this inspection."
 mam_cen.facts_intel_7:0 "\n\nThe discovery concerns an attempted murder. The original discovery is retained in the inspection; it has not created an automatic arrest or criminal sentence."
 mam_cen.intel_kind_20:0 "\n\nThe officers have traced a discovered murder plot to its author. Native exposure and criminal proceedings remain separate from this inspection."
 mam_cen.facts_intel_20:0 "\n\nThe officers have traced a discovered murder plot to its author. The original discovery is retained in the inspection; it has not created an automatic arrest or criminal sentence."
 mam_cen.intel_kind_21:0 "\n\nThe officers have traced a discovered abduction plot to its author. Native exposure and criminal proceedings remain separate from this inspection."
 mam_cen.facts_intel_21:0 "\n\nThe officers have traced a discovered abduction plot to its author. The original discovery is retained in the inspection; it has not created an automatic arrest or criminal sentence."
 mam_cen.intel_kind_22:0 "\n\nThe officers have traced a discovered treasury-siphoning plot to its author. Native exposure and criminal proceedings remain separate from this inspection."
 mam_cen.facts_intel_22:0 "\n\nThe officers have traced a discovered treasury-siphoning plot to its author. The original discovery is retained in the inspection; it has not created an automatic arrest or criminal sentence."
 mam_cen.intel_kind_30:0 "\n\nA public criminal record is accompanied by a native legal reason against the official. The inquiry must distinguish the right to proceed from proof of the alleged act."
 mam_cen.intel_kind_31:0 "\n\nSomeone holding a native legal reason has formally referred the accusation. Their claim is on record; the Censor has not adopted it as a verdict."
 mam_cen.intel_kind_32:0 "\n\nThe official has been taken into custody within the empire. The circumstances and the grounds for proceeding deserve examination. Detention does not prove guilt, and this review does not release the prisoner."
 mam_cen.intel_open:0 "Require #bold [mam_cen_intel_subject.GetShortUIName]#! to answer this discovery."
 mam_cen.intel_open_tt:0 "Open one inspection of the named official, preserving this discovery as a supported factual lead. The official can answer, challenge your methods or seek a defender. No title, money, secret exposure or criminal sentence changes now."
 mam_cen.public_open:0 "Hear #bold [mam_cen_intel_subject.GetShortUIName]#! and examine the accusation."
 mam_cen.public_open_tt:0 "Open one inspection of the senior official. This records the accusation or detention, not guilt. The official may answer from custody; a minister can intervene, and Justice can assess the current native legal grounds. No arrest, release, conviction or title transfer occurs now."
 mam_cen.intel_imperial_review:0 "Review the conduct of #bold [mam_cen_intel_subject.GetShortUIName]#! under my own seal."
 mam_cen.intel_imperial_review_tt:0 "Open imperial review of the matter concerning the named Censor. They cannot investigate or judge themselves. Allegations remain distinct from supported misconduct. You decide the administrative disposition; no automatic exposure, release, money transfer or criminal sentence."
 mam_cen.intel_memorial:0 "Place the discovery against #bold [mam_cen_intel_subject.GetShortUIName]#! before the Dragon Throne."
 mam_cen.intel_memorial_tt:0 "Submit a supported memorial directly to the emperor without first hearing the official. The emperor may censure, protect, return it for further work or authorize a guarded removal. This does not automatically expose a secret or grant an imprisonment reason."
 mam_cen.public_memorial:0 "Put the handling of #bold [mam_cen_intel_subject.GetShortUIName]#!'s case before the emperor."
 mam_cen.public_memorial_tt:0 "Refer the accusation or detention directly to the emperor. The referral creates no proof, criminal reason or release. Without supported misconduct or separately verified current legal grounds, an administrative removal still incurs the existing custom Tyranny consequence."
 mam_cen.intel_trace:0 "Follow the messengers and find who gave the order."
 mam_cen.intel_trace_tt:0 "Attempt to identify the actual author in 7 days. Current chance: [mam_cen_trace_chance|0]%, from your Intrigue/Learning against the author's Intrigue/Diplomacy and relevant traits (10-90%). The plot must still exist. One attempt per discovered plot; failure names nobody. Succession during tracing invalidates that investigator's attempt."
 mam_cen.intel_guard:0 "Place #bold [mam_cen_intel_victim.GetShortUIName]#! under closer protection."
 mam_cen.intel_guard_tt:0 "Give the living intended victim closer protection for 6 months: hostile scheme phases against them take 5 days longer. This ends this intelligence referral without accusing anyone or ending the native plot. The modifier refreshes without stacking."
 mam_cen.intel_hold:0 "Keep these papers under seal. I will decide later."
 mam_cen.intel_hold_tt:0 "Set this referral aside for 30 days, allowing other work to proceed. The lead expires after 2 years without a new penalty. Existing native knowledge and plots remain unchanged."
 mam_cen.intel_bury:0 "I will not pursue my report."
 mam_cen.intel_bury_tt:0 "Close this referral without a sanction or reward. This does not erase anyone's native secret knowledge, stop a plot, or prevent an independently informed emperor from reviewing the Censor. The same discovery cannot generate repeated rewards."
 mam_censor_inspect_interaction:0 "Censor: Inspect Public Conduct"
 mam_censor_inspect_interaction_desc:0 "Open an inspection of this official. The current Censor chooses the approach; the subject and other officials can answer, resist or intervene. An inspection is not a declaration of guilt."
 mam_censor_petition_interaction:0 "Censor: Demand Safeguards"
 mam_censor_petition_interaction_desc:0 "Intervene in the active inspection. Ask for fair limits, defend an official or support scrutiny. One additional petition may interrupt an inspection before an imperial memorial is submitted."
 mam_censor_begin_decision:0 "Censor: Begin an Inspection"
 mam_censor_begin_decision_desc:0 "Choose a senior official for scrutiny. County and duchy officials can be selected through the Ministry interaction on their character."
 mam_censor_intelligence_decision:0 "Censor: Review Confidential Discoveries"
 mam_censor_refer_crime_interaction:0 "Censor: Refer a Criminal Accusation"
 mam_censor_refer_crime_interaction_desc:0 "Refer an actual native legal reason against this senior official to the Censorate. The official may answer, and the Censor may seek Justice's advice or report to the throne. This files an accusation, not a conviction; no new crime, arrest, release or payment occurs."
 mam_cen.public_no_duplicate:0 "This continuing criminal matter has not already been referred. A pending, completed or declined referral is not repeated while the same grounds or custody continue."
 mam_cen.public_queue_room:0 "The Censorate has room for another referral in its eight-entry queue."
 mam_censor_intelligence_decision_desc:0 "Review relevant known official secrets and imperial plot warnings. Only one referral or inspection is presented at a time. The emperor reviews an independently known allegation against the Censor. Discoveries normally arrive within seven days."
 mam_cen.intel_confirm:0 "Bring the confidential papers."
 mam_cen_guarded:0 "Under the Censorate's Protection"
 mam_cen_guarded_desc:0 "Closer protection makes hostile scheme phases against this character take 5 additional days. It is not immunity from plots."
 mam_censor_resume_decision:0 "Censor: Resume My Pending Business"
 mam_censor_resume_decision_desc:0 "Recall the current stage addressed to you. This does not repeat a decision already made or transfer another official's authority."
 mam_cen.begin_confirm:0 "Consider whom to inspect"
 mam_cen.resume_confirm:0 "Bring the papers"
 mam_cen.only_one_tt:0 "The Censorate can pursue one major inspection at a time."
 mam_cen.current_censor_tt:0 "The living Censor must hold both the ministry and its council seat."
 mam_cen.cooldown_tt:0 "This official has not been selected for an inspection in the past two years."
 mam_cen.retired_reason:0 "Removed from public office after a censorial confrontation"
 mam_cen_feared:0 "Feared Censor"
 mam_cen_feared_desc:0 "This inspector has made threats part of government. Officials may submit, but resentment and appeals can follow."
 mam_cen_trusted:0 "Trusted Inspector"
 mam_cen_trusted_desc:0 "This official has earned confidence through a supported and measured disposition."
 mam_cen_censured:0 "Publicly Censured"
 mam_cen_censured_desc:0 "A supported finding has damaged this official's political standing without transferring their office."
 mam_cen_restrained:0 "Censorial Methods Restrained"
 mam_cen_restrained_desc:0 "Imperial limits prohibit new threats, coerced confessions and private demands in the custom inspection system. Lawful scrutiny and native spying continue."
 mam_cen_protected:0 "Protected by the Throne"
 mam_cen_protected_desc:0 "The emperor has retained this official. Automatic inspections pass over them for three years; records are not erased."
 mam_cen_reformed:0 "Reconciled with Oversight"
 mam_cen_reformed_desc:0 "An administrative fault was resolved without destroying the official's career."
 mam_cen_discredited:0 "Discredited Investigator"
 mam_cen_discredited_desc:0 "The investigator's own methods have become the subject of an adverse imperial finding."
 mam_cen_resentment:0 "Resented Censorial Pressure"
 mam_cen_fair_hearing:0 "Granted a Fair Hearing"
 mam_cen_defended_me:0 "Defended My Position"
 mam_cen_abandoned_me:0 "Rejected My Memorial"
 mam_cen_exposed_abuse:0 "Exposed My Abuse"
 mam_cen_skillful_mediation:0 "Settled Our Dispute Skillfully"
 mam_cen_rival_reason:0 "Their confrontation over a public inspection hardened into a lasting rivalry."
 mam_cen.censure_consequences:0 "Once on a supported finding: -50 Influence; Publicly Censured for 2 years (-15% monthly Influence, -5 General Opinion). No money, title, imprisonment reason or candidate score changes."
 mam_cen.censure_resentment:0 "The official loses 25 Opinion of the living Censor for 5 years."
 mam_cen.censure_rival:0 "Because of the official's temperament, this confrontation creates a native Rivalry with the Censor."
 mam_cen.trust_consequences:0 "The actual deciding/reporting Censor gains Trusted Inspector for 3 years (+10% monthly Influence, +5 General Opinion) if alive; the modifier does not stack."
 mam_cen.mediation_skilled_tt:0 "Your Diplomacy is at least 15: the official and the living memorial author each gain 10 Opinion of you for 3 years."
 mam_cen.mediation_unskilled_tt:0 "Your Diplomacy is below 8: the living memorial author loses 15 Opinion of you for 3 years."
 mam_cen.agenda_title:0 "Where Shall I Look?"
 mam_cen.agenda_desc:0 "An inspection can reach a powerful ministry or a provincial administration. These are candidates for scrutiny, not a list of guilty officials. I may also inspect an eligible official directly through their Ministry interaction."
 mam_cen.agenda_1:0 "Inspect #bold [mam_cen_pick_1.GetShortUIName]#! in [mam_cen_pick_1.GetPrimaryTitle.GetName]."
 mam_cen.agenda_2:0 "Inspect #bold [mam_cen_pick_2.GetShortUIName]#! in [mam_cen_pick_2.GetPrimaryTitle.GetName]."
 mam_cen.agenda_3:0 "Inspect #bold [mam_cen_pick_3.GetShortUIName]#! in [mam_cen_pick_3.GetPrimaryTitle.GetName]."
 mam_cen.agenda_cancel:0 "I will choose another official myself."
