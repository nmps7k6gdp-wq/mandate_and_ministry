 mam_rv.priority_recommend_reserves_desc:0 "[mam_rv_revenue.GetShortUIName] recommends a greater emphasis on #high building central reserves#!.\n\nThe ministry asks for a direction; it cannot change the government's priorities on its own. Shall I accept this recommendation or retain the present programme?"
 mam_rv.priority_recommend_recovery_desc:0 "[mam_rv_revenue.GetShortUIName] recommends a greater emphasis on #high provincial recovery#!.\n\nThe ministry asks for a direction; it cannot change the government's priorities on its own. Shall I accept this recommendation or retain the present programme?"
