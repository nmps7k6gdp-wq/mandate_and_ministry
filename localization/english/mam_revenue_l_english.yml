l_english:
 mam_rv.aid_title:0 "Public Funds for [mam_rv_subject.GetName]"
 mam_rv.aid_desc:0 "[mam_rv_recipient.GetShortUIName] seeks funds for #high [mam_rv_subject.GetName]#!. Its public treasury holds [mam_rv_recipient_balance|0] [treasury_i]. I must decide what support the government can afford.\n\nThe proposed payer is [mam_rv_donor.GetShortUIName], using that office's public treasury. The recipient is [mam_rv_recipient.GetShortUIName].\n\nI can recommend [mam_rv_amount|0] [treasury_i], offer less, or revise the amount. A recommendation alone moves no money; any required consent and approval come first."
 mam_rv.contribution_title:0 "A Contribution Between Offices"
 mam_rv.contribution_desc:0 "#high [mam_rv_subject.GetName]#!, held by [mam_rv_recipient.GetShortUIName], is the intended recipient of this contribution. [mam_rv_donor.GetShortUIName] would provide the funds from their office's public treasury.\n\nThat account holds [mam_rv_donor_balance|0] [treasury_i] and must retain [mam_rv_donor_reserve|0] [treasury_i]. Up to [mam_rv_max_amount|0] [treasury_i] is presently available. My draft asks for #high [mam_rv_amount|0]#! [treasury_i].\n\nThe donor may agree, offer half or object. I can revise the amount before seeking consent."
 mam_rv.settlement_title:0 "The Finances of [mam_rv_subject.GetName]"
 mam_rv.settlement_desc:0 "[mam_rv_recipient.GetShortUIName] administers #high [mam_rv_subject.GetName]#!. I must weigh what this province can contribute against the support it needs.\n\nAn extraordinary contribution would send 100 [treasury_i] from the governor's public treasury to the emperor's public treasury. Recovery or project assistance would instead draw the displayed grant from the emperor, unless I explicitly arrange a contribution from another ministry.\n\nThe ordinary obligations remain in force. None of these recommendations takes personal gold."
 mam_rv.budget_title:0 "Funding [mam_rv_subject.GetName]"
 mam_rv.budget_desc:0 "The allocation for #high [mam_rv_subject.GetName]#! determines the funds available to [mam_rv_recipient.GetShortUIName] for ministerial business. I can recommend a Low, Medium or High Budget.\n\nThis changes future ministry-budget receipts; it does not transfer a lump sum today. The appropriate superior must approve the recommendation.\n\nA minister whose budget is reduced may appeal once within six months. The new allocation remains in force while that appeal is considered."
 mam_rv.donor_title:0 "A Call on My Treasury"
 mam_rv.donor_desc:0 "[mam_rv_revenue.GetShortUIName] asks my office to send #high [mam_rv_amount|0]#! [treasury_i] to #high [mam_rv_subject.GetName]#!, administered by [mam_rv_recipient.GetShortUIName].\n\nThe money would come from my office's public treasury. It currently holds [mam_rv_donor_balance|0] [treasury_i] and must retain [mam_rv_donor_reserve|0] [treasury_i].\n\nI may consent, offer [mam_rv_half_amount|0] [treasury_i], or ask my superior to preserve these funds for my own work. Consent does not replace any approval required by law."
 mam_rv.approval_title:0 "A Fiscal Recommendation"
 mam_rv.approval_desc:0 "[mam_rv_revenue.GetShortUIName] recommends a payment of #high [mam_rv_amount|0]#! [treasury_i] for #high [mam_rv_subject.GetName]#!.\n\nThe payer would be [mam_rv_donor.GetShortUIName], drawing from their office's public treasury. [mam_rv_recipient.GetShortUIName] would receive the funds.\n\nI may approve, reduce, return or refuse the proposal. No payment has yet been made. If I approve, the named payer must still retain its protected reserve."
 mam_rv.annual_title:0 "The Affairs of Revenue"
 mam_rv.annual_desc:0 "The ministry must account for the needs of the provinces and the resources available to meet them. Some offices ask for support; others may be able to make a contribution.\n\nThe current fiscal priority is #high [ROOT.Char.Custom('MamRevenuePriority')]#!. I can continue within these instructions, recommend a different emphasis, or submit a budget proposal when one is due. The Chancellor directs priorities, subject to the emperor's instructions."
 mam_rv.mandate_title:0 "The Law of Fiscal Authority"
 mam_rv.mandate_desc:0 "The realm's fiscal authority is governed by #high [ROOT.Char.Custom('MamRevenueAuthority')]#!. The Ministry of Revenue must work within this law.\n\n[ROOT.Char.Custom('MamRevenueAuthoritySummary')]\n\nTo change the law, open #high Realm > Laws > Revenue Fiscal Authority#!. A change costs 150 Prestige, requires peace and starts a five-year cooldown. The law continues after succession; changing it does not replenish the current yearly spending allowance."
 mam_rv.priority_title:0 "Directing Fiscal Affairs"
 mam_rv.priority_desc:0 "I must give the Ministry of Revenue a clear fiscal direction. Building central reserves will favour contributions and cautious expenditure; provincial recovery will give greater weight to legitimate requests for assistance.\n\nRevenue will choose allocations within these instructions. The emperor's directions take precedence."
 mam_rv.recommendation_title:0 "A Change of Fiscal Emphasis"
 mam_rv.recommendation_desc:0 "The Ministry of Revenue has submitted a proposed fiscal priority for review."
 mam_rv.grant_full:0 "Recommend [mam_rv_amount|0] [treasury_i] for [mam_rv_recipient.GetShortUIName]."
 mam_rv.grant_half:0 "Offer [mam_rv_half_amount|0] [treasury_i] to [mam_rv_recipient.GetShortUIName]."
 mam_rv.recovery:0 "Support the recovery of #high [mam_rv_subject.GetName]#!."
 mam_rv.development:0 "Appropriate funds towards an existing civilian project."
 mam_rv.find_contribution:0 "Ask [mam_rv_alternative_donor.GetShortUIName] to contribute."
 mam_rv.refuse:0 "Other needs must take precedence."
 mam_rv.contribute_50:0 "Request 50 [treasury_i] for #high [mam_rv_subject.GetName]#!."
 mam_rv.contribute_100:0 "Request 100 [treasury_i] for #high [mam_rv_subject.GetName]#!."
 mam_rv.contribute_200:0 "Request 200 [treasury_i] for #high [mam_rv_subject.GetName]#!."
 mam_rv.close:0 "There is no need to proceed with this contribution."
 mam_rv.standard:0 "Continue the ordinary arrangements for #high [mam_rv_subject.GetName]#!."
 mam_rv.remittance:0 "Ask [mam_rv_recipient.GetShortUIName] for an extraordinary contribution."
 mam_rv.budget_low:0 "Recommend a Low Budget for #high [mam_rv_subject.GetName]#!."
 mam_rv.budget_medium:0 "Recommend a Medium Budget for #high [mam_rv_subject.GetName]#!."
 mam_rv.budget_high:0 "Recommend a High Budget for #high [mam_rv_subject.GetName]#!."
 mam_rv.keep_budget:0 "The current allocation should remain."
 mam_rv.donor_accept:0 "My office can contribute [mam_rv_amount|0] [treasury_i]."
 mam_rv.donor_half:0 "I can spare [mam_rv_half_amount|0] [treasury_i]."
 mam_rv.donor_dispute:0 "These funds are needed here. Let the matter be reviewed."
 mam_rv.approve:0 "Approve the recommendation for #high [mam_rv_subject.GetName]#!."
 mam_rv.approve_half:0 "Authorize half the proposed payment."
 mam_rv.return:0 "The ministry should reconsider its recommendation."
 mam_rv.reject:0 "I will not authorize this measure."
 mam_rv.continue:0 "Continue the present programme."
 mam_rv.recommend_reserves:0 "Recommend that we build the government's reserves."
 mam_rv.recommend_recovery:0 "Recommend greater support for provincial recovery."
 mam_rv.native_budget:0 "Submit a budget recommendation to [mam_rv_emperor.GetShortUIName]."
 mam_rv.mandate_0:0 "Reserve new fiscal measures for approval."
 mam_rv.mandate_1:0 "Delegate limited fiscal administration."
 mam_rv.mandate_2:0 "Grant an expanded fiscal mandate."
 mam_rv.priority_0:0 "Balance reserves with legitimate civilian needs."
 mam_rv.priority_1:0 "Build the central reserves."
 mam_rv.priority_2:0 "Prioritize provincial recovery."
 mam_rv.allow_chancellor:0 "Let the Chancellor direct fiscal priorities."
 mam_rv.accept_priority:0 "Accept the proposed emphasis."
 mam_rv.retain_priority:0 "Keep the present direction."
 mam_rv.defer:0 "This matter can wait a little longer."
 mam_rv.resume:0 "Resume fiscal business"
 mam_rv.public_money_tt:0 "#bold Source of funds#!\nThe proposed payer is [mam_rv_donor.GetShortUIName], using that office's public treasury. The recipient is [mam_rv_recipient.GetShortUIName].\nThe payer currently holds [mam_rv_donor_balance|0] [treasury_i] and must retain [mam_rv_donor_reserve|0] [treasury_i]. Personal gold is unaffected. No payment occurs until the required consent and approval are obtained."
 mam_rv.gratitude_tt:0 "After a successful grant: the recipient gains #P +15 Opinion#! of Revenue and #P +10 Opinion#! of the actual payer for #V 3 years#!. These rewards do not stack with themselves. Further aid to the same office is normally limited for #V 180 days#!."
 mam_rv.full_tt:0 "Recommend #V [mam_rv_amount|0]#! [treasury_i] from [mam_rv_donor.GetShortUIName]'s public treasury to [mam_rv_recipient.GetShortUIName]'s public treasury. If that sum is insufficient to clear a debt, the remaining debt stays outstanding. The law determines whether a further approval is needed."
 mam_rv.half_tt:0 "Reduce the proposed payment to [mam_rv_half_amount|0] [treasury_i]. The remaining need is not automatically funded."
 mam_rv.recovery_tt:0 "A successful payment funds one year of recovery. Eligible counties below #V 60 Control#! within this office's own jurisdiction gain #P +10 Popular Opinion#! and #P +0.2 Monthly Control Growth#! for #V 1 year#!. Nested kingdoms are handled separately. No tax exemption or plague cure is implied."
 mam_rv.development_tt:0 "Fund an existing civilian or recovery project through its responsible public office. The responsible officials retain control of the work; funding does not complete it instantly. The same project cannot receive this appropriation again for #V 1 year#!."
 mam_rv.find_contribution_tt:0 "Ask the named ministry to fund the displayed amount. It can agree, contribute half or dispute the request. No money moves merely because a recommendation is made."
 mam_rv.contribution_tt:0 "After consent and any required approval, the selected public treasury pays the displayed sum. A non-imperial donor other than Revenue gains #N -10 Opinion#! of Revenue for #V 3 years#! and cannot be asked for another contribution for #V 1 year#!. The protected reserve is checked again immediately before payment."
 mam_rv.standard_tt:0 "Keep ordinary obligations. This does not refund past payments, remove already funded recovery, or reset contribution and aid cooldowns."
 mam_rv.remittance_tt:0 "Request #V 100#! [treasury_i] from the governor's public treasury for the central government. A protected reserve must remain. Successful payment gives the governor #N -10 Opinion#! of Revenue for #V 3 years#! and prevents another extraordinary contribution for #V 1 year#!. A refusal is a dispute, not proof of misconduct."
 mam_rv.budget_low_tt:0 "Recommend #V Low Budget#!: #N -0.5#! to the monthly ministry-budget base before other modifiers, and the native #N -15 Opinion#! of the liege. An actual reduction also gives #N -10 Opinion#! of Revenue for #V 3 years#!. The minister may appeal once within #V 180 days#!. No treasury is debited today."
 mam_rv.budget_medium_tt:0 "Recommend #V Medium Budget#!: no adjustment to the monthly ministry-budget base. An actual increase gives #P +10 Opinion#! of Revenue; a reduction gives #N -10 Opinion#!, for #V 3 years#!. A reduction can be appealed once within #V 180 days#!. Other obligations are unchanged."
 mam_rv.budget_high_tt:0 "Recommend #V High Budget#!: #P +0.5#! to the monthly ministry-budget base before other modifiers. An actual increase gives #P +10 Opinion#! of Revenue for #V 3 years#!. This changes future receipts; it does not take a matching lump sum from another ministry."
 mam_rv.donor_accept_tt:0 "Record consent to the displayed public payment. It proceeds only under the applicable mandate or superior approval. On success, you gain #N -10 Opinion#! of Revenue, while the beneficiary gains #P +10 Opinion#! of you, for #V 3 years#!."
 mam_rv.donor_half_tt:0 "Consent to a reduced contribution of [mam_rv_half_amount|0] [treasury_i], subject to the same authority and reserve protections. Success has the normal contribution opinion effects."
 mam_rv.dispute_tt:0 "No money moves now. Refer the request to the proper superior. If a compulsory payment is subsequently authorized and succeeds, the donor additionally gains #N -15 Opinion#! of that superior for #V 3 years#!."
 mam_rv.approval_tt:0 "Approve only the displayed measure. A successful payment uses the named public accounts and applies the grant/contribution consequences; a budget recommendation changes only its native Ministry Budget setting. A changed holder, balance or contract sends it back for review."
 mam_rv.return_tt:0 "Send this recommendation back to Revenue for reconsideration after #V 30 days#!. The officials receive a result notice. No money moves, no budget changes and no success rewards are granted."
 mam_rv.refuse_tt:0 "Decline the request and inform Revenue and the applicant. No funds move. A refused funding applicant gains #N -10 Opinion#! of the deciding official for #V 2 years#!. This office cannot make another ordinary funding petition for #V 180 days#!."
 mam_rv.compassionate_refusal_tt:0 "Because you are Compassionate, refusing this severe need while the imperial treasury could afford the displayed payment gives #N 10 base Stress#!."
 mam_rv.vengeful_tt:0 "Because you are Vengeful, successfully funding your personal rival gives #N 15 base Stress#!."
 mam_rv.just_favour_tt:0 "Because you are Just, knowingly funding a personal connection ahead of an outstanding severe need gives #N 15 base Stress#! after success."
 mam_rv.honest_favour_tt:0 "Because you are Honest, knowingly funding a personal connection ahead of an outstanding severe need gives #N 15 base Stress#! after success."
 mam_rv.compulsion_tt:0 "Because you are Compassionate, explicitly authorizing a successful compulsory contribution gives #N 10 base Stress#!."
 mam_rv.recommend_priority_tt:0 "Send a recommendation to the Chancellor, or to the emperor if an imperial direction is in force. The existing priority remains until the proper authority accepts."
 mam_rv.native_budget_tt:0 "Present a proposed budget to the emperor. Costs the Influence amount shown below. Available only when a new recommendation is due; the emperor can approve or refuse."
 mam_rv.mandate_0_tt:0 "#bold Imperial Approval#!\nEvery new Revenue payment and budget change requires the emperor's approval. Revenue can review needs and negotiate proposals; a donor's consent alone cannot authorize payment.\n\nThe imperial treasury must retain #V 500#! [treasury_i]. Other public accounts retain their own protected reserve. Approval grants no access to personal gold."
 mam_rv.mandate_1_tt:0 "#bold Limited Delegation#!\nRevenue may settle ordinary, consenting payments of up to #V 100#! [treasury_i] without another approval. Delegated payments from the imperial treasury share a #V 400#! [treasury_i] yearly allowance and must leave #V 500#! [treasury_i] in reserve. Contributions from other ministries do not use that imperial allowance.\n\nLarger payments and all budget changes need approval. Chancellor, Censor, Grand Marshal, War and Revenue's own measures remain reserved to the emperor. An ordinary donor dispute goes to the Chancellor. Explicit imperial approval can exceed the delegated allowance, but cannot breach the protected reserve."
 mam_rv.mandate_2_tt:0 "#bold Expanded Delegation#!\nRevenue may settle ordinary, consenting payments of up to #V 200#! [treasury_i] without another approval. Delegated payments from the imperial treasury share an #V 800#! [treasury_i] yearly allowance and must leave #V 300#! [treasury_i] in reserve. Contributions from other ministries do not use that imperial allowance.\n\nLarger payments and all budget changes need approval. Chancellor, Censor, Grand Marshal, War and Revenue's own measures remain reserved to the emperor. An ordinary donor dispute goes to the Chancellor. Explicit imperial approval can exceed the delegated allowance, but cannot breach the protected reserve."
 mam_rv.priority_0_tt:0 "Give balanced weight to genuine needs and preservation of public reserves. No money moves when choosing a priority."
 mam_rv.priority_1_tt:0 "Favour lawful extraordinary contributions, cautious grants and review of well-funded departments. Reserves and donor protections still apply."
 mam_rv.priority_2_tt:0 "Give greater priority to documented recovery needs and civilian assistance. This creates no automatic grants or invented crises."
 mam_rv.allow_chancellor_tt:0 "Withdraw the imperial priority override. The current Chancellor can establish ordinary fiscal priorities; the imperial spending mandate remains unchanged."
 mam_rv.accept_priority_tt:0 "Adopt the recommended priority within your authority. No treasury transfer or budget law change occurs merely by accepting this direction."
 mam_rv.retain_priority_tt:0 "Keep the present fiscal priority. No money moves and no approval is inferred."
 mam_rv.defer_tt:0 "Set this matter aside for #V 30 days#! and allow the next eligible matter to be considered. Silence never authorizes expenditure. A stale event has no financial effect."
 mam_rv.funded_title:0 "Public Funding Secured"
 mam_rv.funded_desc:0 "Public funds have been allocated to your office through the Ministry of Revenue."
 mam_rv.returned_title:0 "A Fiscal Petition Refused"
 mam_rv.returned_desc:0 "Your request has been declined. No public payment has been made."
 mam_rv.unverified_title:0 "A Treasury Transfer Needs Review"
 mam_rv.unverified_desc:0 "The treasury clerks could not reconcile the two accounts. The allocation has been closed for review, and another payment for this office will not be sought automatically this year."
 mam_rv.priority_balanced:0 "balanced administration"
 mam_rv.priority_reserves:0 "building central reserves"
 mam_rv.priority_recovery:0 "provincial recovery"
 mam_rv.recommend_payment:0 "The proposal sends #high [mam_rv_amount|0]#! [treasury_i] from [mam_rv_donor.GetShortUIName]'s public treasury to [mam_rv_recipient.GetShortUIName]'s public treasury.\n\nThe proposed payer is [mam_rv_donor.GetShortUIName], using that office's public treasury. The recipient is [mam_rv_recipient.GetShortUIName]."
 mam_rv.recommend_low:0 "The proposal assigns a Low Ministry Budget to [mam_rv_recipient.GetShortUIName]."
 mam_rv.recommend_medium:0 "The proposal assigns a Medium Ministry Budget to [mam_rv_recipient.GetShortUIName]."
 mam_rv.recommend_high:0 "The proposal assigns a High Ministry Budget to [mam_rv_recipient.GetShortUIName]."
 mam_revenue_designate_recipient_interaction:0 "Revenue: Designate a Funding Recipient"
 mam_revenue_designate_recipient_desc:0 "Designate this public office as the recipient of a proposed contribution. Then use Revenue: Arrange a Treasury Contribution on a donor ministry. The designation lasts 90 days and moves no money."
 mam_revenue_arrange_contribution_interaction:0 "Revenue: Arrange a Treasury Contribution"
 mam_revenue_arrange_contribution_desc:0 "Consider a contribution from this ministry to your designated public office. Choose an amount, seek the donor's consent and obtain any necessary approval. Protected reserves remain intact."
 mam_revenue_review_budget_interaction:0 "Revenue: Review Departmental Funding"
 mam_revenue_review_budget_desc:0 "Recommend a Low, Medium or High Ministry Budget for this eligible department. The proper superior approves changes. This does not alter other obligations or military budget systems."
 mam_revenue_settle_province_interaction:0 "Revenue: Settle Provincial Contributions"
 mam_revenue_settle_province_desc:0 "Continue ordinary contributions, propose an extraordinary remittance, or recommend public recovery or project funding for this senior civilian office."
 mam_revenue_petition_assistance_interaction:0 "Revenue: Petition for Public Assistance"
 mam_revenue_petition_assistance_desc:0 "Petition Revenue for your office's financial distress, recovery or existing civilian project. Costs the native treasury-request Influence amount. A usable hook is consumed only if funding succeeds; debt clearance requires a sufficient actual payment. The minister may offer less or seek superior approval."
 mam_revenue_direct_priorities_interaction:0 "Revenue: Direct Fiscal Priorities"
 mam_revenue_direct_priorities_desc:0 "Direct Revenue to balance needs and reserves, build reserves or prioritize provincial recovery. The emperor can override ordinary Chancellor instructions."
 mam_revenue_set_mandate_interaction:0 "Revenue: Review Fiscal Authority"
 mam_revenue_set_mandate_desc:0 "Read the current Fiscal Authority law and its approval rules, payment limits and protected reserves. Change the law through Realm > Laws. This interaction does not change the law or spend funds."
 mam_revenue_resume_cases_decision:0 "Revenue: Resume Fiscal Business"
 mam_revenue_resume_cases_desc:0 "Return to outstanding fiscal matters assigned to you, including those you previously set aside."
 mam_revenue_recovery_county_modifier:0 "Public Recovery Funding"
 mam_revenue_recovery_county_modifier_desc:0 "Public funds support the recovery of this county's administration."
 mam_revenue_recovery_office_modifier:0 "Recovery Allowance"
 mam_revenue_recovery_office_modifier_desc:0 "This public office has received a treasury grant for recovery. This is not a tax exemption."
 mam_revenue_extra_remittance_modifier:0 "Extraordinary Public Contribution"
 mam_revenue_extra_remittance_modifier_desc:0 "This office has made an additional treasury contribution to the central government."
 mam_revenue_development_funding_modifier:0 "Civilian Project Appropriation"
 mam_revenue_development_funding_modifier_desc:0 "This office has received public funds towards an existing civilian project."
 mam_revenue_secured_funding_opinion:0 "Secured Public Funding"
 mam_revenue_contribution_burden_opinion:0 "Requested an Extraordinary Contribution"
 mam_revenue_overruled_opinion:0 "Overruled My Fiscal Objection"
 mam_revenue_refused_aid_opinion:0 "Refused Public Assistance"
 mam_revenue_fair_terms_opinion:0 "Funded My Public Office"
 mam_revenue_budget_raised_opinion:0 "Recommended More Funding"
 mam_revenue_budget_reduced_opinion:0 "Recommended Less Funding"
 mam_rv.no_measure_tt:0 "Close this fiscal recommendation without a payment or a change to obligations. No success rewards are given."
 mam_rv.can_arrange_tt:0 "Your designated recipient is still eligible and ready for funding, and the donor can contribute at least 50 treasury without breaching its protected reserve or contribution cooldown."
 mam_rv.can_review_budget_tt:0 "This department has no pending budget review and its previous review cooldown has ended."
 mam_rv.can_settle_tt:0 "This senior civilian office has no pending provincial settlement."
 mam_rv.can_petition_tt:0 "Your office has an eligible financial, recovery or project need, no pending funding request, and no active assistance cooldown; you are not at war with Revenue or your liege."
 mam_rv.can_direct_tt:0 "No fiscal-priority decision is already awaiting resolution."
 mam_rv.can_mandate_tt:0 "No review of fiscal authority is already awaiting your attention."
 mam_revenue_fiscal_authority_laws:0 "Revenue Fiscal Authority"
 mam_revenue_authority_reserved:0 "Imperial Fiscal Control"
 mam_revenue_authority_limited:0 "Supervised Fiscal Administration"
 mam_revenue_authority_expanded:0 "Delegated Fiscal Administration"
 mam_revenue_authority_reserved_desc:0 "The emperor approves the spending programme and every new material allocation. Revenue executes existing authorized operations automatically."
 mam_revenue_authority_limited_desc:0 "The Chancellor directs the programme and approves ordinary material allocations. The emperor reserves exceptional imperial funding and sensitive offices."
 mam_revenue_authority_expanded_desc:0 "Revenue authorizes ordinary allocations within the approved programme. The Chancellor directs priorities and hears appeals; the emperor retains reserved powers."
 mam_rv.law_change_tt:0 "Change fiscal authority in #high Realm > Laws#!. Costs #V 150 Prestige#!, requires peace and starts a #V 5-year#! cooldown. The law survives succession. A change does not reset this year's delegated expenditure."
 mam_rv.law_cooldown_tt:0 "At least five years have passed since the last change to Fiscal Authority."
 mam_rv.law_shared_tt:0 "All departmental budget changes require superior approval. Under delegation, ordinary donor disputes go to the Chancellor; sensitive measures go to the emperor. Imperial approval may authorize a payment above delegated limits, but every payer must retain its protected reserve. No fiscal authority grants access to personal gold."
 mam_rv.acknowledge_law:0 "The ministry shall work within this law."
 mam_rv.payer_imperial:0 "#high The imperial public treasury pays.#! Revenue recommends and administers the grant; the Revenue ministry's own funds are unaffected. This is also the default source for debt-clearance assistance."
 mam_rv.payer_revenue:0 "#high The Revenue ministry's public treasury pays.#! Revenue has been explicitly selected as the donor. This payment does not draw on the emperor's treasury or anyone's personal gold."
 mam_rv.payer_other:0 "#high [mam_rv_donor.GetShortUIName]'s office pays from its public treasury.#! The emperor's and Revenue ministry's own accounts are unaffected by this contribution."
 mam_rv.contribute_selected:0 "Request #high [mam_rv_amount|0]#! [treasury_i] for #high [mam_rv_subject.GetName]#!."
 mam_rv.edit_amount:0 "I should revise the amount first."
 mam_rv.edit_amount_tt:0 "Adjust the draft by 25 or 100, select the exact amount needed to clear the recipient's current treasury debt, or select the payer's available surplus. There is no fixed 200-treasury ceiling. Larger proposals still need approval; reserves and cooldowns remain in force."
 mam_rv.amount_title:0 "How Much Can the Treasury Spare?"
 mam_rv.amount_desc:0 "I am considering #high [mam_rv_amount|0]#! [treasury_i] for #high [mam_rv_subject.GetName]#!.\n\nThe proposed payer is [mam_rv_donor.GetShortUIName], using that office's public treasury. The recipient is [mam_rv_recipient.GetShortUIName].\n\nThe payer holds [mam_rv_donor_balance|0] [treasury_i]; its protected reserve is [mam_rv_donor_reserve|0] [treasury_i]. The available surplus is #high [mam_rv_max_amount|0]#! [treasury_i].\n\nThese adjustments only change my draft. I will return to the recommendation before requesting any payment."
 mam_rv.amount_use:0 "Use #high [mam_rv_amount|0]#! [treasury_i] in my recommendation."
 mam_rv.amount_plus25:0 "Increase the draft by 25 [treasury_i]."
 mam_rv.amount_plus100:0 "Increase the draft by 100 [treasury_i]."
 mam_rv.amount_minus25:0 "Reduce the draft by 25 [treasury_i]."
 mam_rv.amount_minus100:0 "Reduce the draft by 100 [treasury_i]."
 mam_rv.amount_debt:0 "Set #high [mam_rv_debt_amount|0]#! [treasury_i] to clear the current debt."
 mam_rv.amount_max:0 "Set the available surplus: #high [mam_rv_max_amount|0]#! [treasury_i]."
 mam_rv.amount_cancel:0 "Keep my original draft."
 mam_rv.edit_only_tt:0 "Change only the draft, then review the updated amount. No payment, consent or approval occurs. Adjustments stop at the payer's available surplus."
 mam_rv.amount_use_tt:0 "Return to the recommendation with this amount selected. You must still choose to submit it; the required donor consent and superior approval remain in force."
 mam_rv.amount_max_tt:0 "Select the payer's current public treasury less its protected reserve, rounded down. This may require exceptional approval. No money is transferred by selecting it."
 mam_rv.amount_cancel_tt:0 "Restore the draft amount used before opening this editor and return to the recommendation."
 mam_rv.outcome_title:0 "The Fiscal Decision"
 mam_rv.outcome_desc:0 "The clerks have reported a fiscal decision, but this older notice has no complete account record. No payment is confirmed by this notice. Review the current public treasury accounts before making another recommendation."
 mam_rv.outcome_paid:0 "The contribution for #high [mam_rv_outcome_subject.GetName]#! has been completed.\n\n#high [mam_rv_outcome_amount|0]#! [treasury_i] was paid from [mam_rv_outcome_payer.GetShortUIName]'s public treasury to [mam_rv_outcome_recipient.GetShortUIName]'s public treasury.\n\n#bold Accounts at payment#!\nPayer: [mam_rv_outcome_before_donor|2] to [mam_rv_outcome_after_donor|2] [treasury_i] (#N -[mam_rv_outcome_debit|2]#!).\nRecipient: [mam_rv_outcome_before_recipient|2] to [mam_rv_outcome_after_recipient|2] [treasury_i] (#P +[mam_rv_outcome_credit|2]#!).\n\nBoth changes matched the approved amount. Personal gold was unaffected."
 mam_rv.outcome_refused:0 "[mam_rv_outcome_decider.GetShortUIName] has refused the funding request concerning #high [mam_rv_outcome_subject.GetName]#!.\n\nNo treasury payment was made. Revenue and the applicant have been informed. An ordinary funding petition from this office must wait six months before reconsideration."
 mam_rv.outcome_budget_refused:0 "[mam_rv_outcome_decider.GetShortUIName] has refused the proposed budget for #high [mam_rv_outcome_subject.GetName]#!.\n\nIts existing allocation remains in force. No treasury payment was made. Revenue must wait six months before opening another ordinary budget review for this office."
 mam_rv.outcome_budget_changed:0 "The Ministry Budget has been changed. This changes future receipts; no lump sum was transferred today."
 mam_rv.outcome_returned:0 "[mam_rv_outcome_decider.GetShortUIName] has returned the recommendation concerning #high [mam_rv_outcome_subject.GetName]#! to Revenue for reconsideration.\n\nNo funds were transferred and no budget was changed. The ministry may revisit the recommendation after thirty days. This is a request for revision, not final approval or refusal."
 mam_rv.outcome_consent:0 "[mam_rv_outcome_payer.GetShortUIName] has agreed to contribute #high [mam_rv_outcome_amount|0]#! [treasury_i] towards #high [mam_rv_outcome_subject.GetName]#!.\n\nThe donor's consent has been recorded. The measure still needs superior approval, so no payment has yet been made. Revenue will receive a further result when the final decision is carried out."
 mam_rv.outcome_uncertain:0 "The clerks could not reconcile the attempted transfer for #high [mam_rv_outcome_subject.GetName]#!. This is not a confirmed payment.\n\nApproved amount: [mam_rv_outcome_amount|0] [treasury_i].\nPayer's public treasury: [mam_rv_outcome_before_donor|2] to [mam_rv_outcome_after_donor|2] [treasury_i].\nRecipient's public treasury: [mam_rv_outcome_before_recipient|2] to [mam_rv_outcome_after_recipient|2] [treasury_i].\n\nThe case is closed without success rewards. No automatic retry will occur; the offices are protected from another attempt for one year."
 mam_rv.outcome_appeal_upheld:0 "The appeal was upheld and the previous Ministry Budget restored. No treasury payment was made."
 mam_rv.outcome_appeal_rejected:0 "[mam_rv_outcome_decider.GetShortUIName] has rejected the appeal from #high [mam_rv_outcome_subject.GetName]#!. The reduced budget remains in force.\n\nThe minister gains -10 Opinion of the deciding superior for two years. This cut cannot be appealed again. No treasury payment was made."
 mam_rv.understood:0 "The decision is recorded."
 mam_rv.outcome_ack_tt:0 "Acknowledge this result. This does not repeat the transaction or change its outcome."
 mam_rv.level_low:0 "Low"
 mam_rv.level_medium:0 "Medium"
 mam_rv.level_high:0 "High"
 mam_revenue_appeal_budget_interaction:0 "Revenue: Appeal Departmental Funding"
 mam_revenue_appeal_budget_desc:0 "Ask the appropriate superior to restore the allocation reduced on Revenue's recommendation. You can appeal once within six months, provided the officeholder and reduced budget remain unchanged. The budget remains in force while the appeal is pending."
 mam_rv.appeal_title:0 "A Minister Contests a Budget Cut"
 mam_rv.appeal_desc:0 "The minister asks for the previous departmental budget to be restored. This appeal transfers no treasury."
 mam_rv.uphold_appeal:0 "Restore the previous allocation to #high [mam_rv_subject.GetName]#!."
 mam_rv.reject_appeal:0 "The reduced allocation must remain."
 mam_rv.uphold_appeal_tt:0 "Restore only the budget that existed before this cut. The appellant gains #P +10 Opinion#! of you for #V 3 years#!, and the specific #N -10 Opinion#! of Revenue for this overturned cut is removed. No treasury payment occurs. A later budget change or new officeholder invalidates this appeal."
 mam_rv.reject_appeal_tt:0 "Keep the reduced budget. The appellant gains #N -10 Opinion#! of you for #V 2 years#! and cannot appeal this cut again. No funds move."
 mam_rv.appeal_cut:0 "I shall petition for the former allocation."
 mam_rv.appeal_cut_tt:0 "Submit one appeal to restore the pre-cut Ministry Budget. Ordinary cases go to the Chancellor; sensitive offices and cuts approved by the emperor go to the emperor. The current budget remains in force. No treasury payment occurs."
 mam_rv.appeal_route_tt:0 "A valid superior is available. The appeal is routed by authority: the Chancellor cannot overturn a decision reserved to the emperor."
 mam_revenue_appeal_upheld_opinion:0 "Reconsidered My Ministry Budget"
 mam_revenue_appeal_rejected_opinion:0 "Rejected My Budget Appeal"
 mam_revenue_authority_reserved_effects:0 "$EFFECT_LIST_BULLET$#indent_newline:3 The emperor approves the consolidated programme, new grants and material operating changes#!\n$EFFECT_LIST_BULLET$#indent_newline:3 The Chancellor prepares priorities and hears ordinary appeals for imperial submission#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Existing authorized salaries and standing military commitments are funded automatically when cash permits#!\n$EFFECT_LIST_BULLET$#indent_newline:3 The imperial Ministry Budget remains the overall native funding provision; additional imperial top-ups always require imperial approval#!\n$EFFECT_LIST_BULLET$#indent_newline:3 The common reserve protects two months of approved recurring costs plus the programme reserve#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Personal gold and provincial treasuries remain separate; no new currency is created#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Changes cost 150 Prestige, require peace and have a five-year cooldown#!"
 mam_revenue_authority_limited_effects:0 "$EFFECT_LIST_BULLET$#indent_newline:3 The Chancellor approves the spending programme and ordinary material allocations#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Imperial top-ups, Chancellor funding and sensitive senior offices remain reserved to the emperor#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Existing authorized salaries and standing military commitments are funded automatically when cash permits#!\n$EFFECT_LIST_BULLET$#indent_newline:3 The imperial Ministry Budget remains the overall native funding provision; additional imperial top-ups always require imperial approval#!\n$EFFECT_LIST_BULLET$#indent_newline:3 The common reserve protects two months of approved recurring costs plus the programme reserve#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Personal gold and provincial treasuries remain separate; no new currency is created#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Changes cost 150 Prestige, require peace and have a five-year cooldown#!"
 mam_revenue_authority_expanded_effects:0 "$EFFECT_LIST_BULLET$#indent_newline:3 Revenue may approve ordinary requests up to 500 treasury within the programme#!\n$EFFECT_LIST_BULLET$#indent_newline:3 New optional projects require superior approval under reserve-building or recovery programmes#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Revenue cannot approve its own increased allowance; appeals go to the lawful superior#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Imperial top-ups and sensitive senior offices remain reserved to the emperor#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Existing authorized salaries and standing military commitments are funded automatically when cash permits#!\n$EFFECT_LIST_BULLET$#indent_newline:3 The imperial Ministry Budget remains the overall native funding provision; additional imperial top-ups always require imperial approval#!\n$EFFECT_LIST_BULLET$#indent_newline:3 The common reserve protects two months of approved recurring costs plus the programme reserve#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Personal gold and provincial treasuries remain separate; no new currency is created#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Changes cost 150 Prestige, require peace and have a five-year cooldown#!"
 mam_rv.native_credit_tt:0 "After a successful petition payment, Revenue receives #P [mam_rv_native_credit|0] Influence#!. No Influence reward is granted for refusal or an unverified payment."
 mam_rv.native_hook_tt:0 "The petitioner's selected hook on Revenue is consumed only after the payment succeeds."
 mam_rv.debt_hook_tt:0 "If this payment actually clears the petitioner's treasury debt, the payer receives the native strong Indebted hook on the petitioner and the relevant native debt-clearance catalyst may apply. A smaller grant that leaves debt outstanding does not earn this hook."
 mam_rv.authority_summary_reserved:0 "I retain approval of every new Revenue payment and departmental budget change. Revenue may negotiate proposals, but no funds move without my consent. The imperial treasury must retain at least 500 treasury."
 mam_rv.authority_summary_limited:0 "Revenue may settle ordinary consenting payments up to 100 treasury. Delegated imperial grants share 400 treasury per year and leave an imperial reserve of 500. Larger payments, budget changes and sensitive measures still need approval."
 mam_rv.authority_summary_expanded:0 "Revenue may settle ordinary consenting payments up to 200 treasury. Delegated imperial grants share 800 treasury per year and leave an imperial reserve of 300. Larger payments, budget changes and sensitive measures still need approval."
 mam_rv.current_law_rules_tt:0 "[ROOT.Char.Custom('MamRevenueAuthorityRules')]"
 mam_rv.outcome_superseded:0 "The appeal concerning #high [mam_rv_outcome_subject.GetName]#! could not be enacted because its officeholder, budget or authorizing official changed.\n\nNo further budget change or payment was made. The latest valid allocation remains in force."
 mam_rv.approval_budget_low_desc:0 "[mam_rv_revenue.GetShortUIName] recommends a #high Low Ministry Budget#! for #high [mam_rv_subject.GetName]#!, held by [mam_rv_recipient.GetShortUIName].\n\nThis changes the office's future budget receipts. It does not transfer a lump sum from another treasury today.\n\nI may approve the allocation, return it for revision, or refuse it. A minister whose budget is reduced may appeal once within six months."
 mam_rv.appeal_low_desc:0 "[mam_rv_recipient.GetShortUIName] asks me to reverse the cut to #high [mam_rv_subject.GetName]#! and restore the former #high Low Ministry Budget#!.\n\nI can restore that allocation or uphold the reduction. An imperial decision can only be overturned by the emperor. The current budget remains in force until I decide; this appeal transfers no treasury."
 mam_rv.outcome_budget_changed_low:0 "The budget recommendation for #high [mam_rv_outcome_subject.GetName]#! has been approved and enacted. Its Ministry Budget is now #high Low#!.\n\nThis changes future ministry-budget receipts. No lump sum was transferred today. The applicable opinion changes have taken effect.\n\nIf this was a reduction, the affected minister may appeal once within six months. The enacted budget remains in force while that appeal is considered."
 mam_rv.outcome_appeal_upheld_low:0 "[mam_rv_outcome_decider.GetShortUIName] has upheld the appeal from #high [mam_rv_outcome_subject.GetName]#!. Its previous #high Low#! Ministry Budget has been restored.\n\nThe minister gains +10 Opinion of the deciding superior for three years, and the specific resentment towards Revenue for the overturned cut is removed. No lump sum was transferred."
 mam_rv.approval_budget_medium_desc:0 "[mam_rv_revenue.GetShortUIName] recommends a #high Medium Ministry Budget#! for #high [mam_rv_subject.GetName]#!, held by [mam_rv_recipient.GetShortUIName].\n\nThis changes the office's future budget receipts. It does not transfer a lump sum from another treasury today.\n\nI may approve the allocation, return it for revision, or refuse it. A minister whose budget is reduced may appeal once within six months."
