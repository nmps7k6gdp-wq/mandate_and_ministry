l_english:
 mam_personnel_review_official_interaction:0 "Personnel: Review Official"
 mam_personnel_review_official_desc:0 "While managing talent, review this official for advancement. An endorsement improves prospects for a future senior vacancy; it does not remove an incumbent."
 mam_personnel_revamp.review_title:0 "A Record of Service"
 mam_personnel_revamp.review_desc:0 "The ministry has laid #bold [mam_review_official.GetShortUINamePossessive]#! service papers before me. Progress deserves recognition, but a decline must be weighed against the circumstances. I should consider the record before deciding what advice to give."
 mam_personnel_revamp.endorse:0 "#bold [mam_review_official.GetShortUINameNoTooltip]#! has earned the chance to rise."
 mam_personnel_revamp.endorse_tt:0 "For three years, add 20 appointment score when competing for an eligible higher kingdom- or empire-tier civilian governorship in this realm. Does not stack or bypass eligibility."
 mam_personnel_revamp.dossier:0 "Let me examine the service papers."
 mam_personnel_revamp.observe:0 "I will watch their service a little longer."
 mam_personnel_service_endorsement:0 "Personnel Endorsement"
 mam_personnel_service_endorsement_desc:0 "Recorded service supports advancement to a higher senior public office."
 mam_personnel_royal_favor:0 "Personnel: Royal Favor"
 mam_personnel_royal_favor_desc:0 "Royal favor adds 10 appointment score for eligible senior civilian governorships in the sponsoring realm. Refreshed while Personnel bestows favor."
 mam_personnel_revamp.record_concern:0 "I must record my concerns about #bold [mam_review_official.GetShortUINameNoTooltip]#!."
 mam_personnel_revamp.concern_tt:0 "Requires mature, comparable evidence of decline without war disruption. For three years, subtract 10 senior appointment score in this realm and withdraw an existing advancement endorsement. Grants no punishment or removal."
 mam_personnel_poor_service:0 "Personnel: Poor Service Assessment"
 mam_personnel_poor_service_desc:0 "Documented service concerns reduce senior appointment score by 10 in the assessing realm for three years."
 mam_personnel_revamp.credentials:0 "What qualifications does #bold [mam_review_official.GetShortUINameNoTooltip]#! hold?"
 mam_personnel_manage_talent_task_effect:0 "\n#bold Ministry of Personnel#!\nUnlocks Personnel: Review Official. Three years of comparable service can support a three-year endorsement (+20 candidate score for a higher senior civilian office) or a poor-service assessment (-10 senior candidate score). Interruptions restart observation."
 mam_personnel_favor_task_effect:0 "\n#bold Ministry of Personnel#!\nThe target receives +10 candidate score for eligible kingdom and empire civilian offices in this realm. The benefit lasts 90 days, is refreshed monthly while this assignment continues, and does not stack."
