l_english:
 mam_review_posting_interaction:0 "Personnel: Review This Governorship"
 mam_review_posting_interaction_desc:0 "#bold Find a successor for this governorship#!\nAs Personnel minister, compare available candidates, transfers, and the current successor in CK3's appointment order. Inspect their qualifications before preparing a recommendation.\n\nOpening the review costs nothing and replaces no one. A serving nominee must surrender the old posting to a qualified replacement. The emperor must approve the submitted proposal."
 mam_personnel.0020.t:0 "Personnel: Available Candidates for Office"
 mam_personnel.0020.desc:0 "#bold Posting:#! [mam_posting.GetName]\n#bold Incumbent:#! [mam_incumbent.GetShortUIName]\n\nCandidates must meet merit-rank, civilian-career, and recruitment requirements. Recent appointees are excluded for #V five years#!.\n\n"
 mam_posting_has_candidates:0 "Ministry shortlist: up to three eligible, available candidates. Switch categories to review serving officials.\n\n"
 mam_posting_no_candidates:0 "No candidates in this category passed every check. Try the other category. The native successor may still be inspected separately.\n\n"
 mam_personnel.0021.t:0 "A Candidate for This Posting"
 mam_posting_candidate_intro:0 "Posting: [mam_posting.GetName]\nCandidate: [mam_inspected.GetShortUIName]\n\n"
 mam_posting_still_eligible:0 "The candidate still passes the destination review checks.\n\n"
 mam_posting_no_longer_eligible:0 "This candidate does not currently meet the destination requirements. Native merit rank, civilian eligibility, recruitment standards and the five-year appointment restriction still apply.\n\n"
 mam_posting_existing_office:0 "Current office: [mam_inspected.GetPrimaryTitle.GetName]. Promotion or transfer requires surrendering this jurisdiction to a qualified replacement.\n\n"
 mam_posting_no_existing_office:0 "The candidate is currently unlanded. Their house or estate title is not treated as a provincial posting.\n\n"
 mam_posting_review_only:0 "Reviewing this report changes no offices. An appointment proposal is available only when the destination and any existing posting pass the jurisdiction checks. Transfers also require an eligible replacement."
 mam_posting.view_credentials:0 "Review qualifications and suitability"
 mam_posting.back:0 "Back to the candidate list"
 mam_posting.inspect_1:0 "Review [mam_posting_candidate_1.GetShortUINameNoTooltip]"
 mam_posting.inspect_2:0 "Review [mam_posting_candidate_2.GetShortUINameNoTooltip]"
 mam_posting.inspect_3:0 "Review [mam_posting_candidate_3.GetShortUINameNoTooltip]"
 mam_personnel.0022.t:0 "Personnel: Transfer Candidates for Office"
 mam_list.serving_posting:0 "Ministry transfer shortlist: up to three eligible serving officials, including qualified county and duchy governors. For a kingdom posting, use Promotion Candidates to compare lower-tier officials separately. Each needs a replacement for the surrendered posting.\n\n"
 mam_native.successor:0 "Native successor: [mam_native_successor.GetShortUIName] (appointment score: [mam_native_successor_score|0]). This is separate from ministry suitability.\n\n"
 mam_native.no_successor:0 "No successor is currently listed in CK3's appointment order.\n\n"
 mam_native.inspect:0 "Inspect the native successor"
 mam_native.candidate_score:0 "Native appointment score for this posting: [mam_native_candidate_score|0]. Ministry suitability is a separate score shown in the credential report.\n\n"
 mam_personnel.0023.t:0 "Personnel: Promotion Candidates"
 mam_list.show_promotions:0 "View county and duchy governors for promotion"
 mam_list.promotion_posting:0 "County and duchy governors qualified for this kingdom posting. Each must leave the old jurisdiction with a qualified replacement.\n\n"
 mam_mark_candidate_interaction:0 "Personnel: Mark for Nomination"
 mam_mark_candidate_interaction_desc:0 "Mark this eligible civilian for the senior vacancy shortlist. Your mark is checked whenever the appointment list opens. If the list is already open, set the appointment aside and use Personnel: Resume Senior Appointments. Marking grants no office and does not waive qualifications or imperial confirmation."
 mam_marked.review:0 "Review marked candidate: [mam_marked_candidate.GetShortUIName]"
 mam_clear_marked_candidate_decision:0 "Personnel: Clear Marked Candidate"
 mam_clear_marked_candidate_decision_desc:0 "#bold Remove your preferred nominee#!\nClear the person you marked for a future recommendation. This costs nothing, changes no office, and does not cancel a proposal already sent to the emperor."
 mam_clear_marked_candidate_decision_confirm:0 "Clear the marked candidate"
 mam_block.recent:0 "#N - Recently appointed: protected from another ministry appointment for five years.#!\n"
 mam_block.exam:0 "#N - Examination standard: this official lacks the qualification required by the current recruitment law.#!\n"
 mam_block.merit:0 "#N - Merit rank: below the native rank required for this destination. Ministry suitability does not waive this.#!\n"
 mam_block.civilian:0 "#N - Career: this posting requires a civilian candidate.#!\n"
 mam_block.minister:0 "#N - Current minister: ministerial officeholders are excluded from this provincial appointment route.#!\n"
 mam_block.register:0 "#N - Basic eligibility: requires a living adult in this imperial realm with recorded qualification or merit, other than the emperor.#!\n"
 mam_block.appointment:0 "#N - Native appointment permission: CK3 does not currently permit this candidate for this title. Check the native appointment interface for its restrictions.#!\n"
 mam_block.native:0 "#N - Native title validity: candidate/title rules fail, such as title-grant permission, government, age or title tier.#!\n"
 mam_block.source:0 "#N - Existing office: not a supported clean civilian jurisdiction in this empire, contains unrelated land/vassals, or its governor is at war.#!\n"
 mam_block.destination:0 "#N - Destination: its incumbent must hold a supported clean civilian jurisdiction directly beneath the emperor and be at peace.#!\n"
 mam_block.war:0 "#N - Imperial war: new ministry recommendations require the emperor to be at peace.#!\n"
 mam_block.pending:0 "#N - Pending business: resolve or wait for the existing recommendation before preparing another.#!\n"
 mam_block.authority:0 "#N - Authority: only the current, matched Personnel minister can prepare this recommendation.#!\n"
 mam_feedback.checks:0 "\nRecommendation checks:\n"
 mam_feedback.ready:0 "#P Ready to prepare: authority, destination and candidate checks pass. A landed nominee still needs an eligible replacement before submission.#!\n"
 mam_feedback.marked:0 "Your marked candidate: [mam_marked_candidate.GetShortUIName]. Use the separate marked-candidate option below.\n\n"
 mam_feedback.unmarked:0 "No personal candidate marked. Right-click an official to mark them for nomination.\n\n"
