l_english:
 mam_enable_dossiers_decision:0 "Personnel: Start Service Records"
 mam_enable_dossiers_decision_desc:0 "#bold Begin a record of provincial service#!\nAs Personnel minister, start fresh observations of civilian governors. Annual updates compare merit rank and average county control and development over #V three years#!. AI ministers also record advisory reviews.\n\n#bold Effect#!\nRecord keeping costs nothing and grants no office or penalty. It continues after succession. Restarting after a pause replaces the old baseline; unobserved time earns no service credit."
 mam_enable_dossiers_decision_confirm:0 "Begin fresh observations"
 mam_disable_dossiers_decision:0 "Personnel: Pause Service Records"
 mam_disable_dossiers_decision_desc:0 "#bold Pause service observations#!\nStop new dossier updates while retaining the last snapshots for inspection. Starting again begins a fresh observation period.\n\nThis costs nothing and does not suspend the separate routine AI appointment reviews."
 mam_disable_dossiers_decision_confirm:0 "Pause observations"
 mam_inspect_dossier_interaction:0 "Personnel: Inspect Service Dossier"
 mam_inspect_dossier_interaction_desc:0 "#bold Review this governor's service#!\nRead recorded merit, average county control and development, and the context behind those figures. A change of governor, realm, or county coverage starts a fresh observation period.\n\nInspection costs nothing and grants no appointment or punishment. Use the service review to record advice or consider a qualified successor."
 mam_dossier.open:0 "Inspect the incumbent's service dossier"
 mam_personnel.0060.t:0 "Personnel: Service Dossier"
 mam_personnel.0061.t:0 "Service Dossier: Context"
 mam_dossier.heading:0 "Official: [mam_dossier_governor.GetShortUIName]\nPosting: [mam_dossier_title.GetName]\n\n"
 mam_dossier.missing:0 "No comparable record is available. Assign Personnel to Manage Talent to begin observations. Paused or superseded records cannot be used to judge the current holder.\n\n"
 mam_dossier.mature:0 "Three-year observation period reached ([mam_dossier_days|0] recorded days). These indicators support review; they are not a verdict.\n\n"
 mam_dossier.observing:0 "Observation in progress: [mam_dossier_days|0] / 1095 days. No performance verdict is available.\n\n"
 mam_dossier.figures:0 "#bold Service indicators#!\nBaseline → Latest observation\nMerit rank: [mam_dossier_start_merit|0] → [mam_dossier_end_merit|0]\nAverage control: [mam_dossier_start_control|1] → [mam_dossier_end_control|1]\nAverage development: [mam_dossier_start_development|1] → [mam_dossier_end_development|1]\n\nCompared across the same #V [mam_dossier_count|0] counties#!.\n\n"
 mam_dossier.paused:0 "#N Record keeping is paused. Displayed figures are the last snapshot.#!\n"
 mam_dossier.war_short:0 "#N War was observed during this period. Interpret changes cautiously.#!\n"
 mam_dossier.context:0 "Read context and provenance"
 mam_dossier.back:0 "Back to the service dossier"
 mam_dossier.back_posting:0 "Back to the posting shortlist"
 mam_dossier.method:0 "Each county has equal weight. Native control can exceed 100 with Absolute Control. Baseline and latest averages use the same recorded county set. A change of holder, realm or county coverage starts a new period. The date is the start of observation, not a reconstructed appointment date.\n\n"
 mam_dossier.sponsor:0 "Recorded ministry sponsor: [mam_dossier_sponsor.GetShortUIName]. This link was recorded during a successful Mandate and Ministry appointment, not inferred from the current minister.\n\n"
 mam_dossier.no_sponsor:0 "No ministry sponsor is recorded for this observation period. Existing or native appointments are not attributed to the current minister.\n\n"
 mam_dossier.reset_holder:0 "This baseline began after a change of holder or a new grant of the posting.\n\n"
 mam_dossier.reset_realm:0 "This baseline began after a change of imperial realm. Imperial succession within the same realm does not reset it.\n\n"
 mam_dossier.reset_counties:0 "This baseline began after the counties under administration changed.\n\n"
 mam_dossier.reset_enabled:0 "This baseline began when record keeping was started or restarted. Earlier service is not reconstructed.\n\n"
 mam_dossier.reset_initial:0 "This baseline began when the supported office was first observed.\n\n"
 mam_dossier.limits:0 "War is sampled at record creation, annual updates and inspection; short conflicts between samples can be missed. Control and development can change for reasons outside the governor's control. Conduct, corruption, disasters and revenue are not assessed here. Dossiers add no rewards, penalties, dismissals or promotion privileges. Existing two-year sponsorship assessments continue separately."
 mam_dossier.no_baseline:0 "No comparable baseline exists for this holder and posting. Earlier service has not been reconstructed.\n\n"
