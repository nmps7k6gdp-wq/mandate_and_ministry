l_english:
 mam_open_personnel_register_decision:0 "Personnel: Review Talent Register"
 mam_open_personnel_register_decision_desc:0 "#bold Find candidates for office#!\nAs Personnel minister, compare up to three available candidates or switch to serving officials eligible for transfer. Inspect their merit, examinations, skills, and the reasons for your recommendation.\n\n#bold What happens next#!\nThis register grants no office and costs nothing. To prepare an appointment, open a governorship review and select a candidate. Recent appointees are excluded for five years; the emperor decides submitted requests."
 mam_open_personnel_register_decision_tooltip:0 "Review up to three leading candidates and inspect their credentials."
 mam_open_personnel_register_decision_confirm:0 "Open the register"
 mam_register_read_only_tt:0 "Read the register. No appointment or payment is made."
 mam_inspect_credentials_interaction:0 "Personnel: Inspect Credentials"
 mam_inspect_credentials_interaction_desc:0 "Read this person's current merit and recorded examination qualification. This inspection does not appoint them or contact them."
 mam_personnel.0001.t:0 "The Talent Register: Available Candidates"
 mam_personnel.0001.desc:0 "This list ranks unlanded civilian candidates by merit, examination qualification, skills and ministerial preference. Recently appointed officials and current ministers are excluded. Specific office eligibility is checked in the governorship review. Routine review and recommendations belong to the current Personnel minister."
 mam_personnel.0010.t:0 "A Review of Credentials"
 mam_personnel.0010.desc:0 "#bold [mam_inspected.GetShortUIName]#!\nMerit rank: [GetMeritLevelName(mam_inspected.GetMeritLevel)]\nQualification: [mam_inspected.Custom('MamQualificationEvidence')]\nDistinction: [mam_inspected.Custom('MamExamDistinction')]\n\n#bold Suitability breakdown#!\nMerit: [mam_detail_merit|0] / 50\nQualification: [mam_detail_qualification|0] / 25\nExamination distinction: [mam_detail_distinction|+0] / 16\nRelevant skills: [mam_detail_skills|0] / 15\nMinisterial preference: [mam_detail_preference|+0]\n\n#bold Total suitability: [mam_detail_total|0]#!\n\nSuitability helps compare nominees; it does not waive the requirements of a particular office. Unrecorded examination results are not inferred. New palace honors can grant a one-time career Merit award, capped at 50, 100, or 150 according to the distinction."
 mam_personnel.close:0 "Close the review"
 mam_minister_current:0 "#bold Personnel minister:#! [mam_minister.GetShortUIName]."
 mam_minister_missing:0 "#N No authorized Personnel minister is available.#! Suitability is shown without a ministerial preference."
 mam_register_populated:0 "Up to three leading people in the selected category are shown below. This register does not certify eligibility for a specific office."
 mam_register_empty:0 "No candidates in this category passed the register filters. Try the other category or inspect an individual's credentials."
 mam_qualification_palace:0 "Palace qualification recorded; origin and past examination distinction not reconstructed"
 mam_qualification_metropolitan:0 "Metropolitan qualification recorded; past examination distinction unknown"
 mam_qualification_provincial:0 "Provincial qualification recorded with ordinary-pass evidence"
 mam_qualification_bypass:0 "Provincial examination bypass recorded; no competitive-pass points awarded"
 mam_qualification_unknown:0 "No persistent examination qualification found; past result unknown"
 mam_personnel.inspect_1:0 "Review [mam_candidate_1.GetShortUINameNoTooltip]"
 mam_personnel.inspect_2:0 "Review [mam_candidate_2.GetShortUINameNoTooltip]"
 mam_personnel.inspect_3:0 "Review [mam_candidate_3.GetShortUINameNoTooltip]"
 mam_personnel.0002.t:0 "The Talent Register: Serving Officials"
 mam_list.serving_register:0 "This list ranks serving civilian governors with supported, transferable jurisdictions. Recently appointed officials and current ministers are excluded. A new posting requires surrendering the old one and an eligible replacement. The emperor reviews the evidence in submitted appointment requests."
 mam_list.show_serving:0 "View serving officials for transfer"
 mam_list.show_available:0 "View available candidates"
 mam_credentials.back:0 "Back to the previous review"
