l_english:
 mam_personnel.0063.t:0 "The Grounds for a Service Recommendation"
 mam_service.method:0 "How the minister reached this advice"
 mam_service.back:0 "Back to the service recommendation"
 mam_service.numbers:0 "Concern [mam_srv_concern|0] / scrutiny [mam_srv_scrutiny|0]; improvements [mam_srv_improvements|0] / recognition [mam_srv_praise|0].\n\n"
 mam_service.short_limits:0 "Advisory only; appointment authority remains with the emperor."
 mam_service.praise_method:0 "Commendation requires no concern threshold to be crossed and measurable improvement: control up 5, development up 0.5, or native merit rank increased. Each is one indicator. Normally two indicators are needed. Generous ministers and ambitious ministers judging their own house lower the praise threshold; just, honest, paranoid and lazy ministers raise it. It remains between 1 and 3. Player ministers can recommend praise for any measurable improvement without a concern threshold being crossed. Commendation is a recommendation only; it grants no award or advantage.\n\n"
 mam_service.open:0 "Review this official for advancement"
 mam_personnel.0062.t:0 "Personnel: Service Recommendation"
 mam_service.commend:0 "Record: Recommend commendation"
 mam_service.suggest_commend:0 "#P Suggested: commendation.#!\n"
 mam_service.record_commend:0 "Commendation.\n"
 mam_service.observe:0 "Record: Continue observation"
 mam_service.retain:0 "Record: Recommend retention"
 mam_service.investigate:0 "Record: Request further review"
 mam_service.saved:0 "#P Recommendation recorded.#!\n"
 mam_service.changed:0 "#N The recommendation was not recorded: authority or the evidence changed. Review the refreshed dossier.#!\n\n"
 mam_service.insufficient:0 "Suggested: continue observation.\n"
 mam_service.suggest_investigate:0 "#N Suggested: further review.#!\n"
 mam_service.suggest_retain:0 "Suggested: retain in office.\n"
 mam_service.thresholds:0 "Public concern: [mam_srv_concern|0] (0: no threshold crossed; 2: modest decline; 4: substantial decline). Ministerial scrutiny threshold: [mam_srv_scrutiny|0].\nA modest decline is control down 5 points, development down 0.5, or any loss of merit rank. A substantial decline is control down 20, development down 2, or merit down 2. These are provisional gameplay thresholds, not proof of misconduct.\n\nDiligent or paranoid ministers scrutinize more readily. Lazy ministers, and ambitious ministers reviewing their own house, are more lenient. The threshold stays between 1 and 3, so substantial concerns always warrant further review. Player ministers choose their own permitted recommendation.\n\n"
 mam_service.no_advice:0 "No recommendation recorded.\n"
 mam_service.author:0 "Last recorded by [mam_srv_author.GetShortUIName]: "
 mam_service.stale:0 "#N Historical advice: the snapshot changed or recording is paused. It is not a current assessment.#!\n"
 mam_service.record_observe:0 "Continue observation.\n"
 mam_service.record_retain:0 "Retain in office.\n"
 mam_service.record_investigate:0 "Further review.\n"
 mam_service.limits:0 "#bold What this recommendation does#!\nOnly the current Personnel minister may record advice. Advice alone grants no office, reward, or punishment.\n\nA current recommendation for further review can lead to a successor proposal for a direct civilian duchy or kingdom posting, if measurable concerns remain and war has not made the evidence unreliable. Qualifications and imperial approval still apply. Submitted follow-ups have a three-year posting cooldown; failed AI attempts also wait three years.\n\nWar-related declines call for more observation. Stable or improving mature records can support retention or praise. Commendation remains advisory. AI ministers review annually while record keeping is active; player ministers choose their own advice."
 mam_service.reason_0:0 "The available record is too short, missing or inactive. More observation is needed before assessing service."
 mam_service.reason_1:0 "War was observed during this period. Changes may reflect disruption beyond the governor's control; wait for comparable evidence."
 mam_service.reason_2:0 "Average county control fell by at least 20 points. Examine local conditions and the causes of lost control before assigning responsibility."
 mam_service.reason_3:0 "Average county development fell by at least 2 levels. Examine devastation and local events before drawing conclusions about the governor."
 mam_service.reason_4:0 "Native merit rank declined. Review the official's standing alongside the county indicators; the dossier does not establish misconduct."
 mam_service.reason_5:0 "Average county control fell by at least 5 points. The minister considers this decline sufficient to request an explanation."
 mam_service.reason_6:0 "Average county development fell by at least half a level. The minister wants more information about the local causes."
 mam_service.reason_7:0 "Native merit rank improved while no concern threshold was crossed. The minister weighs this improvement alongside local conditions."
 mam_service.reason_8:0 "Average county development improved by at least half a level without a concern threshold being crossed."
 mam_service.reason_9:0 "Average county control improved by at least 5 points without a concern threshold being crossed."
 mam_service.reason_10:0 "The recorded indicators remain broadly steady. This supports continued service, rather than exceptional praise."
 mam_service.reason_13:0 "The minister exercised personal discretion and recorded a different recommendation from the calculated suggestion. The underlying evidence remains unchanged."
 mam_service.reason_11:0 "There is a modest decline, but this minister's lenient scrutiny threshold favors retaining the governor. Laziness or shared-house ambition may explain that lenience."
 mam_service.reason_12:0 "War affected this observation period. Stable or improving indicators support provisional retention or praise; they do not establish personal credit for wartime outcomes.\n"
