l_english:
 mam_exam.triple:0 "First at provincial, metropolitan and palace stages (+16 selection)"
 mam_exam.first:0 "Palace examination champion (+12 selection)"
 mam_exam.honors:0 "Palace examination top three (+8 selection)"
 mam_exam.metro:0 "Metropolitan examination champion (+6 selection)"
 mam_exam.provincial:0 "Provincial examination champion (+4 selection)"
 mam_exam.unknown:0 "No recorded distinction; past placement unknown"
 mam_exam.badge_honors_tt:0 "#T Palace Examination Honors#!\n[Character.GetShortUIName] placed among the top three in a palace examination.\n\n$mam_exam.badge_honors_effects$\n\n$mam_exam.badge_reward_rules$"
 mam_exam.badge_honors_effects:0 "$EFFECT_LIST_BULLET$Appointment assessment: #P +8#! from examination distinction.\n$EFFECT_LIST_BULLET$Career distinction reward: up to #P 50#! additional Merit.\n$EFFECT_LIST_BULLET$Permanent laureate recognition; fellow laureates have #P +5#! opinion.\n$EFFECT_LIST_BULLET$Career recognition reward: up to #P 150#! Prestige."
 mam_exam.badge_champion_tt:0 "#T Palace Examination Champion#!\n[Character.GetShortUIName] earned first place in a palace examination.\n\n$mam_exam.badge_champion_effects$\n\n$mam_exam.badge_reward_rules$"
 mam_exam.badge_champion_effects:0 "$EFFECT_LIST_BULLET$Appointment assessment: #P +12#! from examination distinction.\n$EFFECT_LIST_BULLET$Career distinction reward: up to #P 100#! additional Merit.\n$EFFECT_LIST_BULLET$Permanent laureate recognition; fellow laureates have #P +5#! opinion.\n$EFFECT_LIST_BULLET$Career recognition reward: up to #P 300#! Prestige."
 mam_exam.badge_triple_tt:0 "#T Three Consecutive First Places#!\n[Character.GetShortUIName] earned first place at the provincial, metropolitan and palace stages.\n\n$mam_exam.badge_triple_effects$\n\n$mam_exam.badge_reward_rules$"
 mam_exam.badge_triple_effects:0 "$EFFECT_LIST_BULLET$Appointment assessment: #P +16#! from examination distinction.\n$EFFECT_LIST_BULLET$Career distinction reward: up to #P 150#! additional Merit.\n$EFFECT_LIST_BULLET$Permanent laureate recognition; fellow laureates have #P +5#! opinion.\n$EFFECT_LIST_BULLET$Career recognition reward: up to #P 600#! Prestige."
 mam_exam.badge_reward_rules:0 "Only the highest examination distinction contributes to appointment assessment. Merit and Prestige are awarded when the examination is completed; earlier payments count toward their respective lifetime limits. Viewing this badge grants no reward.\n\n#weak These honors grant no monthly Merit or Diplomacy. Examination eligibility follows the usual rules.#!"
 trait_mam_exam_laureate:0 "Examination Laureate"
 trait_mam_exam_laureate_desc:0 "This scholar earned a place among the top three in a palace examination. Fellow laureates recognize the distinction, and the Ministry of Personnel considers it when assessing candidates."
 trait_mam_exam_palace_champion:0 "Palace Champion"
 trait_mam_exam_palace_champion_desc:0 "This scholar earned first place in a palace examination. Their name is celebrated among examination graduates and carries particular weight with officials who value a distinguished academic record."
 trait_mam_exam_threefold_laureate:0 "Threefold Laureate"
 trait_mam_exam_threefold_laureate_desc:0 "First at the provincial, metropolitan and palace stages: this scholar has achieved a rare distinction that will follow them throughout their public career."
 mam_exam.honors_heading:0 "Examination Honors"
 mam_exam.status_recorded:0 "#P This honor is recorded.#!"
 mam_exam.status_unrecorded:0 "#weak No award of this honor is recorded. Complete the examinations and earn the required placement to receive it. A historical pass alone does not establish finishing position.#!"
 mam_exam.status_honors_tt:0 "#T Examination Laureate#!\n[SelectLocalization(GetScriptedGui('mam_exam_earned_honors').IsValid(GuiScope.SetRoot(Character.MakeScope).End), 'mam_exam.status_recorded', 'mam_exam.status_unrecorded')]\n\nAwarded for a top-three finish in a palace examination.\n\n$mam_exam.badge_honors_effects$\n\n$mam_exam.badge_reward_rules$"
 mam_exam.status_champion_tt:0 "#T Palace Champion#!\n[SelectLocalization(GetScriptedGui('mam_exam_earned_champion').IsValid(GuiScope.SetRoot(Character.MakeScope).End), 'mam_exam.status_recorded', 'mam_exam.status_unrecorded')]\n\nAwarded for first place in a palace examination. A new champion in the Chinese realm may be received by the emperor.\n\n$mam_exam.badge_champion_effects$\n\n$mam_exam.badge_reward_rules$"
 mam_exam.status_triple_tt:0 "#T Threefold Laureate#!\n[SelectLocalization(GetScriptedGui('mam_exam_earned_triple').IsValid(GuiScope.SetRoot(Character.MakeScope).End), 'mam_exam.status_recorded', 'mam_exam.status_unrecorded')]\n\nAwarded for first place at the provincial, metropolitan and palace stages. The emperor may offer career sponsorship in recognition of the achievement.\n\n$mam_exam.badge_triple_effects$\n\n$mam_exam.badge_reward_rules$"
 mam_exam.label_triple:0 "#P Threefold Laureate#!"
 mam_exam.label_champion:0 "#P Palace Champion#!"
 mam_exam.label_honors:0 "#P Laureate#!"
 mam_exam.label_none:0 ""
 mam_exam_imperial_sponsorship:0 "Imperial Sponsorship"
 mam_exam_imperial_sponsorship_desc:0 "The emperor has taken an interest in this laureate's career: +15 in Personnel assessment, central ministerial assessment, and native senior civilian governor appointment scores within the sponsoring realm."
 mam_exam_imperial_congratulations:0 "Congratulated My Examination Success"
 mam_exam_imperial_commendation:0 "Publicly Commended My Scholarship"
 mam_exam_imperial_gratitude:0 "Sponsored My Scholarly Career"
 mam_exam_scholar_respect:0 "Distinguished Scholar"
 mam_exam_passed_over:0 "Passed Over for a Weaker Connected Candidate"
 mam_exam.1.t:0 "A Name Distinguished"
 mam_exam.1.desc:0 "The results have been announced, and my name stands among those who have brought distinction to the examinations. The years spent over books and essays have earned me a reputation that will follow me into public life.\n\nI am now known as a [ROOT.Char.Custom('MamExamAppointmentLabel')]. In the ministry, in the court, and among fellow scholars, my achievement will be remembered."
 mam_exam.1.a:0 "May my service live up to this distinction."
 mam_exam.1.reward_tt:0 "You have received [SCOPE.GetValue('mam_exam_prestige_gain')|0] Prestige and [SCOPE.GetValue('mam_exam_merit_gain')|0] additional Merit for this achievement and gained permanent recognition as a laureate. Fellow laureates have +5 opinion of one another. Your highest examination distinction continues to contribute to appointment assessment."
 mam_exam.2.t:0 "A Scholar Before the Throne"
 mam_exam.2.desc:0 "#bold [mam_laureate.GetShortUIName]#! has earned first place in the palace examination. The examiners praise [mam_laureate.GetHerHis] work, and the court now looks to me to acknowledge a scholar of such promise.\n\nA few words of recognition would honor the achievement. My personal sponsorship could give [mam_laureate.GetHerHim] a place among the people on whom this government will depend."
 mam_exam.2.triple_desc:0 "The examiners present #bold [mam_laureate.GetShortUIName]#! with an extraordinary record: first at the provincial, metropolitan and palace stages. Scholars throughout the realm will know [mam_laureate.GetHerHis] name.\n\nSuch an achievement deserves recognition before the throne. Shall I offer my congratulations, commend [mam_laureate.GetHerHim] before the court, or take a personal interest in [mam_laureate.GetHerHis] career?"
 mam_exam.2.sponsor:0 "Let #bold [mam_laureate.GetShortUIName]#! advance with my support."
 mam_exam.2.sponsor_tt:0 "Costs 75 Prestige. Imperial sponsorship adds +15 to appointment assessment and native senior civilian governor candidate scores within your realm for five years. It preserves the usual qualifications and does not reserve an office."
 mam_exam.2.commend:0 "The court shall hear my praise of #bold [mam_laureate.GetShortUIName]#!."
 mam_exam.2.congratulate:0 "Offer #bold [mam_laureate.GetShortUIName]#! my congratulations."
 mam_exam.2.stale:0 "There is no longer an audience to arrange."
 mam_exam.snub_explanation_tt:0 "#bold [mam_exam_snubbed.GetShortUIName]#! is an eligible laureate with an assessment more than five points above this candidate. Favoring a weaker relative, faction associate or paid client will damage the laureate's opinion of the appointing official if the appointment succeeds."
 mam_exam.candidate_honor_tt:0 "#bold [mam_exam_candidate.GetShortUIName]#!: [mam_exam_candidate.Custom('MamExamDistinction')]."
 mam_exam.candidate_sponsorship_tt:0 "This candidate has the sponsorship of #bold [mam_exam_candidate.Var('mam_exam_sponsored_by').Char.GetShortUIName]#!: +15 in assessment within this realm for the remaining duration of the sponsorship."
 mam_exam.candidate_respect_tt:0 "Your professional outlook gives this distinction a further +[SCOPE.GetValue('mam_exam_respect_points')|0] in ministerial assessment."
