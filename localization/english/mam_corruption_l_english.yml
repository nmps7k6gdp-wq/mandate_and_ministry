l_english:
 mam_ai_offer_personnel_bribe_decision:0 "Seek private Personnel patronage"
 mam_offer_personnel_bribe_interaction:0 "Personnel: Offer a Private Payment"
 mam_designate_political_client_interaction:0 "Personnel: Manage Political Patronage"
 mam_corrupt.offer_desc:0 "#bold Seek an advantage in selection#!\nOffer the Personnel minister #V 100 Gold#! for favorable consideration. You pay only if the offer is accepted; an offer can be made once every #V two years#!.\n\nAcceptance guarantees no office. Qualifications, replacement arrangements and imperial approval still apply. The payment may leave evidence for the Censorate."
 mam_corrupt.client_desc:0 "#bold Add or remove a political client#!\nBring this person into your following, or release them if already designated. A client receives a modest advantage in your recommendations. Nominating them leaves a patronage record.\n\nPatronage grants no office and waives no qualification. This following is separate from membership in a political faction."
 mam_corrupt.offer_title:0 "A Private Offer"
 mam_corrupt.offer_text:0 "#bold [mam_bribe_payer.GetShortUIName]#! has approached me with an offer of #V 100 Gold#!. In return, they hope I will remember their name when an office needs filling.\n\nThe money would be welcome, but accepting it would bind my judgment to a private favor."
 mam_corrupt.accept:0 "I will accept #V 100 Gold#! and remember #bold [mam_bribe_payer.GetShortUINameNoTooltip]#!."
 mam_corrupt.refuse:0 "My recommendations are not for sale."
 mam_corrupt.report:0 "Refuse the money and have the offer recorded."
 mam_corrupt.accepted_title:0 "A Private Understanding"
 mam_corrupt.accepted_text:0 "The Personnel minister has accepted your #V 100 Gold#!.\n\nYour prospects improve while the obligation lasts: up to #V three years#! or one successful sponsored appointment. You must still qualify for the posting, and the emperor may refuse. An accepted payment is not refunded if an appointment fails.\n\n#N The transaction may leave evidence for an investigation.#!"
 mam_corrupt.refused_title:0 "Private Offer Declined"
 mam_corrupt.refused_text:0 "The Personnel minister has refused your offer. #bold No Gold changed hands.#!\n\nThe minister may have recorded the attempted bribe. A reported attempt can reach the Censorate, but an allegation alone is not a conviction."
 mam_corrupt.petition:0 "Petition for an imperial exception to recruitment or ranking"
 mam_corrupt.exception_notice:0 "#bold Exceptional appointment petition#!\nPersonnel requests an explicit exception to its recruitment or ranked-selection standard for this nominee and this posting. This is not an ordinary compliant recommendation. Approval authorizes this specific exception; it does not waive native eligibility, nomination jurisdiction, source replacement or other appointment safeguards. A related nominee is not automatically guilty of misconduct."
 mam_corrupt.accept_stress_tt:0 "Accepting this payment gives 25 Stress for each of Honest and Just. The payment is recorded privately even while criminal proceedings are disabled."
