l_english:
 mam_jurisdiction_laws:0 "Personnel Nomination Jurisdiction"
 mam_discretion_laws:0 "Personnel Selection Discretion"
 mam_jurisdiction_full:0 "Full Provincial Mandate"
 mam_jurisdiction_full_desc:0 "Personnel may propose supported civilian duchy and kingdom appointments, with qualified replacements for surrendered source offices. Imperial confirmation is required."
 mam_jurisdiction_restricted:0 "Restricted Provincial Mandate"
 mam_jurisdiction_restricted_desc:0 "Personnel may propose supported civilian duchy appointments. Kingdom destinations and kingdom source replacements are reserved to direct imperial powers. County source replacements remain supported. Imperial confirmation is required."
 mam_discretion_choice:0 "Ministerial Choice"
 mam_discretion_choice_desc:0 "The minister may recommend any eligible candidate. Public qualification gaps are disclosed to the emperor. Native appointment rules and recruitment standards still apply."
 mam_discretion_ranked:0 "Ranked Recommendations"
 mam_discretion_ranked_desc:0 "Primary nominees and source replacements must be within five public-suitability points of the best actionable eligible candidate for their respective posting. Minister personality does not alter this benchmark."
 mam_power.hub_title:0 "Personnel: Imperial Mandate"
 mam_power.hub_desc:0 "#bold Recruitment:#! [ROOT.Char.Custom('MamRecruitmentStandard')]\n#bold Jurisdiction:#! [ROOT.Char.Custom('MamNominationJurisdiction')]\n#bold Selection:#! [ROOT.Char.Custom('MamSelectionDiscretion')]\n\nChoose which part of the Personnel mandate to review. Only the independent emperor may change these laws.\n\n#bold Cost and limits#!\nEach change costs 150 Prestige and requires peace with no pending recommendation. Recruitment has a ten-year cooldown; jurisdiction and discretion each have separate five-year cooldowns. Until changed, Full Provincial Mandate and Ministerial Choice apply."
 mam_power.recruitment:0 "Recruitment standards"
 mam_power.jurisdiction:0 "Nomination jurisdiction"
 mam_power.discretion:0 "Selection discretion"
 mam_power.jurisdiction_title:0 "Personnel: Nomination Jurisdiction"
 mam_power.discretion_title:0 "Personnel: Selection Discretion"
 mam_power.jurisdiction_desc:0 "#bold Full Provincial Mandate#!\nPersonnel may recommend civilian duchy and kingdom appointments, with qualified replacements for surrendered postings.\n\n#bold Restricted Provincial Mandate#!\nPersonnel may recommend duchy appointments and county or duchy replacements. Kingdom appointments remain under direct imperial control.\n\nEvery recommendation requires imperial confirmation.\n\n#bold Change the law#!\n150 Prestige; five-year cooldown. Requires peace and no pending recommendation."
 mam_power.discretion_desc:0 "#bold Ministerial Choice#!\nThe minister may recommend any eligible nominee. Qualification gaps are disclosed to the emperor.\n\n#bold Ranked Recommendations#!\nThe nominee must be within five public-suitability points of the best eligible, available candidate for the posting. A replacement for the surrendered office is ranked separately. Personal preferences do not alter this benchmark.\n\n#bold Change the law#!\n150 Prestige; five-year cooldown. Requires peace and no pending recommendation. Neither policy waives qualifications or replacement requirements."
 mam_power.back:0 "Back to imperial mandate"
 mam_power.ai_policy_desc:0 "Consider Personnel authority under the current imperial mandate."
 mam_ai_power_policy_decision:0 "Personnel: Consider Imperial Mandate"
 mam_power.request_summary:0 "Personnel mandate: [mam_emperor.Custom('MamNominationJurisdiction')]; [mam_emperor.Custom('MamSelectionDiscretion')]."
 mam_power.comparison:0 "#bold Selection comparison#!\nBest eligible public suitability: [mam_power_display_best|1]\nNominee shortfall: [mam_power_display_gap|1]\nRanked Recommendations permits a shortfall of up to five points. A source replacement is assessed separately."
 mam_power.no_benchmark:0 "No actionable eligible comparison candidate was found. Ranked Recommendations cannot authorize a nomination without a valid benchmark."
 mam_power.block_jurisdiction:0 "Blocked: this posting exceeds Personnel nomination jurisdiction. The emperor retains separate native appointment powers."
 mam_power.block_discretion:0 "Blocked: the nominee is outside the lawful ranked band, or no current eligible benchmark exists. Marking a person does not waive this law."
