l_english:
 mam_jus.opening:0 "Concerning a matter of justice,"
 mam_jus.stale:0 "These papers have been overtaken by events."
 mam_jus.custody_fact:0 "\n\n[mam_jus_subject.GetShortUIName] is in custody. Detention is recorded separately from guilt; this hearing alone grants no release."
 mam_jus.referral_fact:0 "\n\nThe Censorate's inspection accompanies the papers. Its observations, objections and any supported findings remain distinct from a judicial disposition."
 mam_jus.private_fact:0 "\n\nA private approach is recorded between its actual participants. A later minister cannot inherit another person's promised payment or favor."
 mam_jus.mitigation_fact:0 "\n\nThe official has presented a persuasive case for consideration. That may weigh in favor of mercy; it does not erase the grounds or establish innocence."
 mam_jus.evidence_judicial:0 "\n\nThe Censorate has corroborated a recorded judicial demand or unauthorized measure attributable to [mam_jus_subject.GetShortUIName]. The exercise of public authority is itself in question."
 mam_jus.evidence_certification:0 "\n\nThe checked returns identify a knowingly false official certification made under [mam_jus_subject.GetShortUIName]'s seal. The limits of the original inquiry were not honestly stated."
 mam_jus.evidence_appointment:0 "\n\nThe Censorate's papers link an actual payment to an appointment made under [mam_jus_subject.GetShortUIName]'s authority. This is more than a complaint about favoring a friend."
 mam_jus.proposal_1:0 "\n\n[mam_jus_performer.GetShortUIName] would take the official into custody."
 mam_jus.proposal_2:0 "\n\n[mam_jus_performer.GetShortUIName] would pardon [mam_jus_pardon_authority.GetShortUIName]'s current criminal rights together; other authorities may retain theirs. This does not release a prisoner."
 mam_jus.proposal_3:0 "\n\n[mam_jus_performer.GetShortUIName] would release the prisoner without a separate pardon."
 mam_jus.proposal_4:0 "\n\n[mam_jus_performer.GetShortUIName] would carry out the proposed execution under existing native grounds."
 mam_jus.proposal_5:0 "\n\n[mam_jus_performer.GetShortUIName] would carry out native banishment, if the prisoner accepts its terms."
 mam_jus.proposal_6:0 "\n\nOnly the separate imperial warrant would be withdrawn. Other criminal rights and existing custody would remain."
 mam_jus.proposal_7:0 "\n\nA three-year imperial warrant would establish an imprisonment reason for documented abuse of office. It grants no execution, banishment or revocation right."
 mam_jus.conditional_effects:0 "If the proposed native action is eventually executed, its native consequences apply. Approval alone moves no money and does not arrest, release, pardon or kill anyone."
 mam_jus.hear:0 "Let #bold [mam_jus_subject.GetShortUIName]#! answer."
 mam_jus.hear_tt:0 "Send a hearing letter. The accused may answer from custody. No guilt, criminal reason or punishment is created."
 mam_jus.request_censor:0 "Ask the Censor to examine what these papers do not establish."
 mam_jus.request_censor_tt:0 "Request one independent inspection if the Censor can take the subject. A busy desk is retried quietly for at most 60 days. The Censor can decline; the request neither proves guilt nor forces a finding."
 mam_jus.decline:0 "These papers do not require criminal proceedings."
 mam_jus.decline_tt:0 "Decline this custom proceeding without a conviction, pardon, release or erasure of known facts. Native legal rights remain. This does not reverse the Censor's administrative work."
 mam_jus.1_title:0 "A Matter for the Ministry of Justice"
 mam_jus.1_desc:0 "The conduct and circumstances of #bold [mam_jus_subject.GetShortUIName]#! require a decision. I must distinguish an accusation from an established act, and a lawful ground for proceeding from the punishment someone wishes to impose."
 mam_jus.answer:0 "I will answer the charge and provide what I know."
 mam_jus.answer_tt:0 "Cooperate without admitting an unproved offense. Your Diplomacy and Learning affect how persuasively you present mitigation. Justice's Learning, and Intrigue against a deceitful defense, affect its assessment. This affects discretionary mercy, never proof or legal rights."
 mam_jus.contest:0 "Show me the lawful grounds for proceeding."
 mam_jus.contest_tt:0 "Dispute the grounds or handling. A lawful objection is not obstruction and creates no new offense. Skills affect the presentation of mitigation, not the existence of a criminal reason."
 mam_jus.mercy:0 "I ask for mercy, whatever the court decides."
 mam_jus.mercy_tt:0 "Ask for clemency without creating proof of guilt. Mercy, native pardon and release remain different decisions."
 mam_jus.surrender:0 "If lawful custody is required, I will submit to it."
 mam_jus.surrender_tt:0 "Consent to custody by the currently named judge if native permissions permit it. A different officeholder cannot inherit this personal consent. This does not admit guilt."
 mam_jus.2_title:0 "An Answer to the Ministry"
 mam_jus.2_desc:0 "I ask for your answer concerning these accusations and your treatment. State what you dispute, what should be examined, and whether you ask the government for clemency. This demand for an answer is not a finding of guilt."
 mam_jus.support:0 "Justice should pursue what the actual grounds support."
 mam_jus.support_tt:0 "Record support, not a verdict. No new criminal right or penalty follows."
 mam_jus.defend:0 "This official deserves a fair hearing and consideration for mercy."
 mam_jus.defend_tt:0 "The official gains 20 Opinion of you for 3 years. Your intervention influences the minister's choices but does not erase evidence or bind the emperor."
 mam_jus.scrutiny:0 "Put the handling of this matter before the throne."
 mam_jus.scrutiny_tt:0 "Seek procedural imperial review. It does not authorize an arrest or punishment and does not declare either party guilty."
 mam_jus.3_title:0 "An Official Takes an Interest"
 mam_jus.3_desc:0 "The proceeding against #bold [mam_jus_subject.GetShortUIName]#! has consequences beyond one household. I may defend the official, support lawful scrutiny, or insist that Justice state its reasons."
 mam_jus.action_1:0 "Seek lawful custody of #bold [mam_jus_subject.GetShortUIName]#!."
 mam_jus.action_1_tt:0 "Propose custody using existing grounds and native permissions. The Justice minister's native privilege is retained; central ministers and protected imperial family use the emperor as enforcer, requiring native automatic acceptance or genuine surrender. Current arrest costs: [mam_jus_arrest_cost|0] @treasury_icon! and [mam_jus_arrest_prestige|0] Prestige. Arrest does not convict the accused. Approval, consent, costs and current permissions are rechecked before execution."
 mam_jus.action_2:0 "Propose a pardon for #bold [mam_jus_subject.GetShortUIName]#!."
 mam_jus.action_2_tt:0 "[mam_jus_pardon_performer.GetShortUIName] would grant this pardon, clearing [mam_jus_pardon_authority.GetShortUIName]'s current imprisonment, execution, banishment and revocation reasons together. Other authorities may retain their own rights. This does not itself release a prisoner. Current costs for that performer: [mam_jus_pardon_cost|0] @treasury_icon! and [mam_jus_pardon_influence|0] Influence. Approval, consent, costs and current permissions are rechecked before execution."
 mam_jus.action_3:0 "Propose the release of #bold [mam_jus_subject.GetShortUIName]#!."
 mam_jus.action_3_tt:0 "Release requires the actual custodian's consent when someone else holds the prisoner. Ordinary release does not clear unrelated criminal rights. Approval, consent, costs and current permissions are rechecked before execution."
 mam_jus.action_4:0 "Put a capital recommendation before the emperor."
 mam_jus.action_4_tt:0 "Capital punishment always requires the current emperor's seal, the actual custodian's consent and a current native execution reason. A custom corruption warrant grants no execution reason. Approval, consent, costs and current permissions are rechecked before execution."
 mam_jus.action_5:0 "Recommend native banishment under the existing grounds."
 mam_jus.action_5_tt:0 "Banishment always requires imperial approval, actual custody, native banishment permissions and the prisoner's agreement to these terms. Native forfeiture/title consequences, where applicable, remain native. Approval, consent, costs and current permissions are rechecked before execution."
 mam_jus.action_6:0 "Ask to withdraw the separate imperial warrant."
 mam_jus.action_6_tt:0 "Withdraw only this mod's identifiable warrant opinion from its current imperial issuer. Unrelated native reasons are preserved. This does not release a prisoner or erase the finding. Approval, consent, costs and current permissions are rechecked before execution."
 mam_jus.action_7:0 "Ask the emperor for a warrant for documented abuse of public office."
 mam_jus.action_7_tt:0 "The emperor must explicitly review actual, corroborated appointment-for-payment, detected knowingly false official certification, or documented judicial solicitation/abuse. Mere accusations, kinship and legitimate spending do not qualify. A warrant grants only a three-year native imprisonment reason; never an execution, banishment or title-revocation right. Approval, consent, costs and current permissions are rechecked before execution."
 mam_jus.seek_surrender:0 "Ask #bold [mam_jus_subject.GetShortUIName]#! to submit to lawful custody."
 mam_jus.seek_surrender_tt:0 "Ask for genuine consent to the currently named enforcer. This is useful when a new warrant or a changed enforcer makes the earlier answer insufficient. Refusal does not create another crime."
 mam_jus.gold_offer:0 "A private payment might secure a favorable decision."
 mam_jus.gold_offer_tt:0 "Offer a conditional private bargain for 100 personal Gold. The accused may refuse or report it. No money moves now. Payment occurs only once after an agreed, actually executed pardon or release. Soliciting this exchange is a documented abuse of office."
 mam_jus.favor_offer:0 "An obligation to me might settle this more quietly."
 mam_jus.favor_offer_tt:0 "Offer a conditional native Favor Hook for an actual pardon or release. No hook is created before agreement and successful execution. A successor cannot collect it. The demand can be reported to the Censor."
 mam_jus.shadow:0 "I will act on my own seal, despite the instructions."
 mam_jus.shadow_tt:0 "Consider an explicitly unauthorized arrest, pardon or release. Native permissions and real costs still apply. Actual unauthorized conduct is attributable to you and can provoke Censor scrutiny, restraint or an imperial warrant. Capital punishment and banishment cannot use this bypass."
 mam_jus.defer:0 "I need more time before deciding."
 mam_jus.defer_tt:0 "Defer once for 30 days. Older delayed business can trigger a coordination appeal. No native deadline becomes an automatic guilty verdict."
 mam_jus.retain:0 "Leave the existing custody to the native process for now."
 mam_jus.retain_tt:0 "Close this custom hearing without changing custody, criminal rights or punishment. The prisoner remains where the native game holds them. A single petition may challenge the handling; no new conviction is recorded."
 mam_jus.return_admin:0 "The remaining question is administrative, not a criminal sentence."
 mam_jus.return_admin_tt:0 "End this proceeding without changing native criminal rights, custody or the Censor's findings. Unsupported allegations do not become convictions."
 mam_jus.4_title:0 "What Shall Justice Do?"
 mam_jus.4_desc:0 "I have heard the matter concerning #bold [mam_jus_subject.GetShortUIName]#!. The next decision will determine how the law is used, who benefits from mercy, and who must answer for the exercise of this office."
 mam_jus.approve:0 "Authorize the proposed measure under my seal."
 mam_jus.approve_tt:0 "Actual native costs for the currently proposed performer: [mam_jus_cost_treasury|0] @treasury_icon!, [mam_jus_cost_gold|0] @gold_icon!, [mam_jus_cost_influence|0] Influence, [mam_jus_cost_prestige|0] Prestige and [mam_jus_cost_piety|0] Piety. Costs and permissions are checked again before execution. Authorize only the current proposal. A changed emperor, law, custodian, payer balance or legal eligibility can require renewed review. Native execution effects apply only if the measure is actually carried out."
 mam_jus.return:0 "Hear the matter again, with my supervision."
 mam_jus.return_tt:0 "Require imperial approval for further measures in this case. Return it to the current unconflicted judge. No crime, pardon, release or title change occurs."
 mam_jus.refuse:0 "This matter needs no further action under my seal."
 mam_jus.refuse_tt:0 "Refuse and end this custom proposal. Existing native custody and criminal rights remain; no failed recommendation is reported as a completed action."
 mam_jus.rebuke:0 "This minister must answer for the recorded handling."
 mam_jus.rebuke_tt:0 "The actual living author of a recorded private solicitation or unauthorized act loses 75 Influence and is restrained for 2 years (-10% monthly Influence, -5 General Opinion). A later minister does not inherit that sanction. This does not reverse a pardon or revive consumed criminal reasons."
 mam_jus.5_title:0 "A Judicial Memorial Before the Throne"
 mam_jus.5_desc:0 "Justice has brought the matter concerning #bold [mam_jus_subject.GetShortUIName]#! before me. My seal authorizes a particular measure, not a verdict written in advance. The current law, the actual custodian and native permissions must still be respected."
 mam_jus.custodian_accept:0 "I will carry out the authorized measure."
 mam_jus.custodian_accept_tt:0 "Actual native costs for the currently proposed performer: [mam_jus_cost_treasury|0] @treasury_icon!, [mam_jus_cost_gold|0] @gold_icon!, [mam_jus_cost_influence|0] Influence, [mam_jus_cost_prestige|0] Prestige and [mam_jus_cost_piety|0] Piety. Costs and permissions are checked again before execution. Consent as the actual performer. A pardon consumes the identified authority's full current bundle. Custody and any required prisoner agreement remain necessary for release or punishment."
 mam_jus.custodian_refuse:0 "I will not consent to this measure."
 mam_jus.custodian_refuse_tt:0 "Refuse your consent and lose 20 Opinion of the deciding judge for 5 years. Custody is unchanged. Refusal is recorded, not automatically converted into a new crime."
 mam_jus.6_title:0 "A Measure Requiring My Consent"
 mam_jus.6_desc:0 "The government asks you to act concerning #bold [mam_jus_subject.GetShortUIName]#!. Your own authority and consent are required before the measure can proceed."
 mam_jus.accept_gold:0 "I will pay the agreed 100 Gold if the promised act is carried out."
 mam_jus.accept_gold_tt:0 "Agree conditionally. Exactly 100 of your personal Gold transfers to the actual proposer only after an actual agreed pardon/release, if they still hold Justice and both parties remain eligible. Public Treasury is not used. No payment occurs now."
 mam_jus.accept_favor:0 "I will owe the agreed favor if the promised act is carried out."
 mam_jus.accept_favor_tt:0 "Agree conditionally to one native Favor Hook for the actual current proposer after a successful agreed pardon/release. If that pardon itself grants a native Loyalty Hook, it fulfills the obligation without a second hook. A successor cannot collect it; no hook is created now."
 mam_jus.refuse_offer:0 "I will not purchase this decision."
 mam_jus.refuse_offer_tt:0 "Refuse without a payment, hook, pardon or punishment. The demand remains the responsibility of its actual author."
 mam_jus.report_offer:0 "The throne and the Censor should hear this demand."
 mam_jus.report_offer_tt:0 "Report the actual recorded solicitation to the emperor. It may support Censor scrutiny of its author; it does not automatically convict anyone, erase evidence or remove their office."
 mam_jus.7_title:0 "A Price for Mercy"
 mam_jus.7_desc:0 "I may be able to bring your matter to a favorable end. Before I put my seal to it, I require something in return. You know what my office can do, and what further delays might cost."
 mam_jus.expedite:0 "Justice must give a timely, reasoned answer."
 mam_jus.expedite_tt:0 "Return unfinished business for an answer. This is pressure, not approval of a punishment. A completed disposition cannot be replayed through this option."
 mam_jus.appeal_throne:0 "Let the emperor hear the complaint."
 mam_jus.appeal_throne_tt:0 "Escalate one procedural appeal. Completed pardons, releases and punishments remain completed; consumed native rights are not recreated."
 mam_jus.uphold:0 "The recorded disposition should stand."
 mam_jus.uphold_tt:0 "Close this review without a new native action or punishment. This does not declare that every earlier choice was wise."
 mam_jus.8_title:0 "Justice Cannot Remain Unanswered"
 mam_jus.8_desc:0 "The handling of #bold [mam_jus_subject.GetShortUIName]#!'s matter has prompted a petition. I can press for a timely answer or bring the complaint before the throne. Coordination does not give me the right to erase evidence or judge my own interests."
 mam_jus.shadow_1:0 "Take custody on my own authority."
 mam_jus.shadow_1_tt:0 "Explicitly bypass reserved approval for this noncapital measure. Real native permissions, acceptance, custody and costs still apply. If executed, the breach is recorded against you and can be investigated. No criminal reason is fabricated to make an arrest lawful."
 mam_jus.shadow_2:0 "Grant the native pardon on my own authority."
 mam_jus.shadow_2_tt:0 "Explicitly bypass reserved approval for this noncapital measure. Real native permissions, acceptance, custody and costs still apply. If executed, the breach is recorded against you and can be investigated. No criminal reason is fabricated to make an arrest lawful."
 mam_jus.shadow_3:0 "Release my prisoner on my own authority."
 mam_jus.shadow_3_tt:0 "Explicitly bypass reserved approval for this noncapital measure. Real native permissions, acceptance, custody and costs still apply. If executed, the breach is recorded against you and can be investigated. No criminal reason is fabricated to make an arrest lawful."
 mam_jus.shadow_back:0 "I will return to the lawful choices."
 mam_jus.shadow_back_tt:0 "Return without an action or breach."
 mam_jus.9_title:0 "The Reach of My Own Seal"
 mam_jus.9_desc:0 "I can try to exercise the ministry's native powers without the required higher authority. Doing so would be my decision, recorded against me; it would not turn an accusation into truth."
 mam_jus.accept_terms:0 "I accept these terms."
 mam_jus.accept_terms_tt:0 "Consent to the currently named custodian's native banishment terms. Eligibility and imperial approval are rechecked. Native forfeiture/title consequences may apply; no action occurs until commitment."
 mam_jus.reject_terms:0 "I will not agree to these terms."
 mam_jus.reject_terms_tt:0 "Refuse. No banishment or forfeiture occurs, and your refusal does not create a crime."
 mam_jus.10_title:0 "Terms of Banishment"
 mam_jus.10_desc:0 "The proposed terms would release you through native banishment. Do you accept these terms? Imperial authorization does not stand in for your agreement, and the current custodian must still consent."
 mam_jus.result_title:0 "The Judicial Disposition"
 mam_jus.result_subject:0 "Concerning #bold [mam_jus_subject.GetShortUIName]#! and the proceeding begun at [mam_jus_office.GetName]:\n\n"
 mam_jus.result_costs:0 "\n\nThe last completed measure was carried out by [mam_jus_last_performer.GetShortUIName]. Native costs charged for that measure: [mam_jus_paid_treasury|0] @treasury_icon!, [mam_jus_paid_gold|0] @gold_icon!, [mam_jus_paid_influence|0] Influence, [mam_jus_paid_prestige|0] Prestige and [mam_jus_paid_piety|0] Piety. Other native consequences remain in effect."
 mam_jus.result_external:0 "\n\nAn independent native action resolved the pending proposal. Its native interface handled its costs and consequences; the custom proceeding did not charge or execute it again."
 mam_jus.result_desc:0 "The ministry has recorded its disposition concerning [mam_jus_subject.GetShortUIName]. Native actions, if completed, retain their actual effects. A closed hearing is not automatically a conviction or pardon. The disposition and its responsible participants remain on record."
 mam_jus.result_1:0 "This proceeding ended without a new punishment. Native criminal rights and any existing custody were not cleared."
 mam_jus.result_2:0 "The original native pardon was carried out. It clears the affected authority's native criminal reasons as that action specifies; it does not itself release a prisoner or erase historical facts."
 mam_jus.result_3:0 "The agreed native release was carried out. The former custodian no longer holds this prisoner. Other criminal grounds were not automatically pardoned."
 mam_jus.result_4:0 "The authorized native execution was carried out by the actual custodian. Its native consequences and succession now apply."
 mam_jus.result_5:0 "The authorized, agreed native banishment was carried out. Its native release, forfeiture and title consequences, where applicable, remain in effect."
 mam_jus.result_6:0 "Only the separate imperial warrant created by this module was withdrawn. Unrelated native criminal reasons remain."
 mam_jus.result_8:0 "The custom hearing ended without altering the existing custody. This is not a new conviction or sentence."
 mam_jus.result_9:0 "The proposal or review was closed without another native action. No earlier completed pardon, release or punishment was replayed."
 mam_jus.result_10:0 "Death, changed jurisdiction, unavailable eligibility or the outer time limit ended the proceeding. No new success is claimed."
 mam_jus.result_11:0 "The recorded author of the handling was rebuked and restrained. This did not reverse a completed disposition or recreate a consumed criminal reason."
 mam_jus.received:0 "The decision is recorded."
 mam_justice_resume_decision:0 "Justice: Resume My Pending Business"
 mam_justice_petition_decision:0 "Justice: Petition for Review of My Treatment"
 mam_jus.petition:0 "Submit my petition."
 mam_justice_resume_decision_desc:0 "Recall the judicial matter currently addressed to you. This cannot repeat a completed disposition."
 mam_jus.resume:0 "Bring the papers."
 mam_jus.native_authority_tt:0 "This senior judicial measure requires the current authority and native permissions. Use the Ministry judicial interaction to propose a reserved action. Special mutilation, coerced vows and other exceptional release terms remain outside delegated Justice."
 mam_justice_authority_laws:0 "Judicial Authority"
 mam_justice_authority_delegated:0 "Delegate Ordinary Justice"
 mam_justice_authority_delegated_effects:0 "$EFFECT_LIST_BULLET$#indent_newline:3 Justice handles ordinary senior custody, native pardons and release within native permissions#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Central ministers, protected imperial family, severe pardons and supervised cases require the emperor#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Capital punishment, banishment and custom imperial warrants always require the current emperor#!\n$EFFECT_LIST_BULLET$#indent_newline:3 The actual custodian and any required prisoner consent are respected; no accusation automatically establishes guilt#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Actual appointment-for-payment, knowingly false official certification, judicial solicitation and unauthorized coercion may support an explicit imperial warrant under the new statute#!\n$EFFECT_LIST_BULLET$#indent_newline:3 New custom offenses apply prospectively from this statute's adoption; earlier records remain available for administrative scrutiny#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Changes cost 150 Prestige, require peace and have a five-year cooldown#!"
 mam_justice_authority_reserved:0 "Reserve Senior Judicial Measures"
 mam_justice_authority_reserved_effects:0 "$EFFECT_LIST_BULLET$#indent_newline:3 Senior arrests, native pardons and releases also require imperial approval#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Hearings and advice remain independent; an unauthorized noncapital bypass creates a record against its actual author#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Capital punishment, banishment and custom imperial warrants always require the current emperor#!\n$EFFECT_LIST_BULLET$#indent_newline:3 The actual custodian and any required prisoner consent are respected; no accusation automatically establishes guilt#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Actual appointment-for-payment, knowingly false official certification, judicial solicitation and unauthorized coercion may support an explicit imperial warrant under the new statute#!\n$EFFECT_LIST_BULLET$#indent_newline:3 New custom offenses apply prospectively from this statute's adoption; earlier records remain available for administrative scrutiny#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Changes cost 150 Prestige, require peace and have a five-year cooldown#!"
 mam_jus_imperial_warrant:0 "Imperial Warrant for Abuse of Public Office"
 mam_jus_grateful:0 "Granted Judicial Mercy"
 mam_jus_resentment:0 "Subjected Me to Judicial Action"
 mam_jus_advocated:0 "Spoke for Me in a Judicial Matter"
 mam_jus_defied:0 "Disputed My Judicial Direction"
 mam_jus_restrained:0 "Judicial Powers Restrained"
 mam_jus_restrained_desc:0 "Ordinary senior measures require imperial review. Private judicial bargains and the unauthorized bypass are blocked. Monthly Influence: -10%; General Opinion: -5."
 mam_justice_review_interaction:0 "Justice: Refer a Judicial Matter"
 mam_justice_review_interaction_desc:0 "Ask Justice to hear a supported senior criminal matter or review actual custody. A referral is not a conviction. The current minister or an unconflicted emperor handles it."
 mam_justice_petition_interaction:0 "Justice: Petition for Review"
 mam_justice_petition_interaction_desc:0 "Petition once concerning this person's current or recent judicial proceeding. Eligible participants may seek coordination or imperial review. Completed actions are not undone or replayed."
 mam_jus.queue_room:0 "The judicial queue has room and this person has no active proceeding or recent duplicate referral."
 mam_jus.censor_referral:0 "Refer the senior matter to Justice without declaring guilt. Censor's administrative inspection remains independently completable."
 mam_justice_authority_laws_desc:0 "Determine how much senior judicial authority the emperor delegates to Justice."
 mam_justice_authority_delegated_desc:0 "Entrust ordinary proceedings to the minister while reserving grave measures and protected cases."
 mam_justice_authority_reserved_desc:0 "Require the imperial seal for senior measures while Justice prepares and hears the cases."
