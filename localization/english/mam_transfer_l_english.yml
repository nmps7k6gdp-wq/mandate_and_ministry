l_english:
 mam_transfer.rules_checked:0 "Requires the current Personnel minister, no recent-appointment protection, and valid destination, nominee and replacement checks."
 mam_transfer.prepare:0 "Prepare an appointment proposal"
 mam_personnel.0030.t:0 "Prepare the Personnel Recommendation"
 mam_transfer.preview:0 "#bold Nominee:#! [mam_nominee.GetShortUIName]\n#bold Destination:#! [mam_posting.GetName]\n#bold Outgoing governor:#! [mam_incumbent.GetShortUIName]\n\n"
 mam_transfer.source:0 "Office to surrender: [mam_source.GetName]. Select a qualified replacement below before submitting the recommendation. If approved, both jurisdictions change hands together; the nominee keeps one provincial posting.\n\n"
 mam_transfer.unlanded:0 "The nominee is unlanded and needs no replacement at another provincial posting.\n\n"
 mam_transfer.submit_unlanded:0 "Submit this appointment to the emperor"
 mam_transfer.cancel:0 "Cancel this recommendation"
 mam_personnel.0040.t:0 "A Recommendation from Personnel"
 mam_transfer.approval:0 "#bold Recommending minister:#! [mam_minister.GetShortUIName]\n#bold Nominee:#! [mam_nominee.GetShortUIName]\n#bold Destination:#! [mam_posting.GetName]\n#bold Outgoing governor:#! [mam_incumbent.GetShortUIName]\n\n"
 mam_transfer.approval_source:0 "Surrendered posting: [mam_source.GetName]\nReplacement: [mam_replacement.GetShortUIName]\n\n"
 mam_transfer.conditions:0 "#bold Effect of approval#!\nReplace the governor and transfer the provincial jurisdiction. Any surrendered posting passes to its selected replacement; family and estate titles are excluded.\n\n#bold Cost and timing#!\nNo Gold or Influence cost. The proposal expires after #V 90 days#!. Authority, officeholders and eligibility must still match when you approve."
 mam_transfer.approve:0 "Approve and carry out the appointment"
 mam_transfer.reject:0 "Decline or dismiss this proposal"
 mam_personnel.0041.t:0 "Appointment Outcome"
 mam_transfer.success:0 "[mam_nominee.GetShortUIName] now governs #bold [mam_posting.GetName]#!.\n\nAny surrendered posting has passed to its selected replacement. New appointees are protected from further ministry appointments for #V five years#!."
 mam_transfer.postcondition_failure:0 "#N The appointment could not be verified.#!\nThe transfer was attempted, but the resulting officeholders or jurisdiction did not match the proposal. Preserve this save for inspection and avoid further ministry appointments in it; there is no automatic reversal."
 mam_personnel.0042.t:0 "The Recommendation Has Lapsed"
 mam_transfer.stale:0 "The proposal no longer matches the current offices, authority or eligibility rules. No appointment was carried out. Open a fresh governorship review."
 mam_personnel.0043.t:0 "The Emperor Declines the Recommendation"
 mam_transfer.declined:0 "The emperor declined your recommendation of [mam_nominee.GetShortUIName] for [mam_posting.GetName]. No appointment was carried out. You may review the posting again and recommend another qualified official."
 mam_enable_ai_personnel_decision:0 "Personnel: Enable Routine Reviews"
 mam_enable_ai_personnel_decision_desc:0 "#bold Delegate routine selection#!\nAllow an AI Personnel minister to review one civilian governorship at a time, seek a substantial improvement, and arrange any replacement needed. Qualified recommendations are sent to the emperor for a decision.\n\nEnabling this costs nothing. CK3's ordinary appointments continue separately. Suspend these reviews at any time; proposals already submitted remain pending."
 mam_enable_ai_personnel_decision_confirm:0 "Enable ministry reviews"
 mam_disable_ai_personnel_decision:0 "Personnel: Suspend Routine Reviews"
 mam_disable_ai_personnel_decision_desc:0 "#bold Stop new routine recommendations#!\nSuspend the AI Personnel minister's automatic governorship reviews. This costs nothing and does not reverse appointments. Any proposal already before the emperor still needs a decision."
 mam_disable_ai_personnel_decision_confirm:0 "Suspend ministry reviews"
 mam_ai_personnel_review_decision:0 "Personnel: Routine Ministry Review"
 mam_ai_personnel_review_decision_desc:0 "Review one supported civilian jurisdiction and recommend a substantial improvement through the common appointment procedure."
 mam_ai_personnel_review_decision_confirm:0 "Review a posting"
 mam_transfer.choose_1:0 "Replace the old posting with [mam_replacement_1.GetShortUINameNoTooltip]"
 mam_transfer.choose_2:0 "Replace the old posting with [mam_replacement_2.GetShortUINameNoTooltip]"
 mam_transfer.choose_3:0 "Replace the old posting with [mam_replacement_3.GetShortUINameNoTooltip]"
 mam_feedback.no_replacement:0 "#N No qualified replacement was found for the office being surrendered. This transfer cannot be submitted.#!"
